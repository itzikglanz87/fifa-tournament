      "אחרי ההגרלה בחר קבוצה לכל שחקן — ומהטורניר הבא הן ייקבעו לבד." +
      '</div><div class="ringline" style="margin-top:9px">' +
      CLUB_RING.map(c => '<span class="club" style="--c:' + clubCol(c) + '"><i class="cdot"></i>' + esc(c) + "</span>")
        .join('<span class="mut">←</span>') + '<span class="mut">← חוזר לתחילת המחזור</span></div>';
  } else {
    brief.innerHTML = '<div class="lbl">מחזור הקבוצות · המשך מטורניר ' + prev.num + " של " +
      esc(seasonById(prev.season).name) + "</div>" +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:9px">' +
      draft.players.map(p => {
        const nn = rot.note[p];
        return '<div class="blocked">' + plate(p) +
          (nn.from ? '<span class="mut">' + esc(nn.from) + "</span><span class=\"mut\">←</span>" : "") +
          (rot.got[p] ? "<b>" + esc(rot.got[p]) + "</b>" : '<span class="mut">—</span>') +
          (nn.why ? '<span class="mut" style="opacity:.75">(' + esc(nn.why) + ")</span>" : "") + "</div>";
      }).join("") + "</div>";
  }
  wrap.appendChild(brief);

  /* the ceremony */
  const potWrap = el("div", "pots");
  potWrap.id = "pots";
  const n = draft.size;
  for (let i = 0; i < n; i++) {
    const pot = el("div", "pot empty");
    pot.innerHTML = '<div class="slot">מקום ' + (i + 1) + '</div><div class="who">—</div><div class="got"></div>';
    potWrap.appendChild(pot);
  }
  wrap.appendChild(potWrap);

  const acts = el("div", "chips");
  const ready = draft.players.length === draft.size && draft.clubs.length === draft.size;
  const bDraw = el("button", "btn", ready ? "בצע הגרלה" :
    "בחר " + draft.size + " משתתפים ו־" + draft.size + " קבוצות");
  bDraw.disabled = !ready;
  const bSave = el("button", "btn ghost", "פתח את הטורניר");
  bSave.disabled = true;
  acts.append(bDraw, bSave);
  const bCancel = el("button", "btn ghost", "ביטול");
  bCancel.onclick = () => { draft = null; viewLive(document.getElementById("v-live")); };
  acts.appendChild(bCancel);
  wrap.appendChild(acts);

  const relax = el("div", "notice warn"); relax.hidden = true; wrap.appendChild(relax);

  bDraw.onclick = () => {
    if (draft.players.length !== draft.size) return flash("צריך בדיוק " + draft.size + " משתתפים");
    if (draft.clubs.length !== draft.size) return flash("צריך בדיוק " + draft.size + " קבוצות");
    const slots = shuffle(draft.players.slice());
    /* only the order is drawn; the clubs follow the ring, or wait for a choice */
    const r2 = manual ? null : rotateClubs(slots, draft.clubs, prev);
    draft.slots = slots;
    draft.assigned = manual ? draft.clubs.slice() : slots.map(p => r2.got[p]);
    draft.manual = manual;
    draft.note = r2 ? r2.note : null;
    const odd = r2 ? slots.filter(p => r2.note[p].fallback) : [];
    relax.hidden = !odd.length;
    if (odd.length) relax.innerHTML = "<b>שימו לב</b> " +
      odd.map(p => esc(P[p])).join(", ") + " לא יכלו להתקדם במחזור " +
      "(" + esc(r2.note[odd[0]].why || "") + "), וקיבלו את מה שנשאר. אפשר לשנות למטה.";
    runCeremony(potWrap, slots, manual ? slots.map(() => null) : draft.assigned,
      () => { bSave.disabled = false; renderAssign(); });
  };

  const assignHost = el("div"); wrap.appendChild(assignHost);
  function renderAssign() {
    assignHost.innerHTML = "";
    const b = el("section", "block");
    b.innerHTML = '<div class="bhead"><h2>' + (draft.manual ? "בחירת הקבוצות" : "הקבוצות לפי המחזור") +
      '</h2><span class="note">' + (draft.manual
        ? "טורניר ראשון בעונה — בחר קבוצה לכל שחקן. מהטורניר הבא המחזור ימלא אותן לבד."
        : "כל שחקן קיבל את הקבוצה הבאה במחזור. אפשר לשנות — ההחלפה מחליפה בין השניים כדי שלא תהיה כפילות.") +
      "</span></div>";
    const box = el("div", "tscroll fit");
    const tb = el("table");
    tb.innerHTML = "<thead><tr><th>מקום</th><th>שחקן</th><th>קבוצה</th></tr></thead>";
    const body = el("tbody");
    draft.slots.forEach((p, i) => {
      const tr = el("tr");
      tr.innerHTML = '<td class="rank">' + (i + 1) + "</td><td>" + plate(p) + "</td>";
      const td = el("td");
      td.appendChild(clubSelect(draft.assigned[i], v => {
        const j = draft.assigned.indexOf(v);
        if (j >= 0 && j !== i) draft.assigned[j] = draft.assigned[i];
        draft.assigned[i] = v; renderAssign();
      }));
      const nn = draft.note && draft.note[p];
      if (nn && nn.from) {
        const onRing = draft.assigned[i] === ringNext(nn.from);
        td.appendChild(el("span", "mut", onRing
          ? " · " + nn.from + " ← " + draft.assigned[i]
          : " ⚠ חריגה מהמחזור (היה " + nn.from + ", בתור " + (ringNext(nn.from) || "—") + ")"));
      }
      tr.appendChild(td);
      body.appendChild(tr);
    });
    tb.appendChild(body); box.appendChild(tb); b.appendChild(box);
    assignHost.appendChild(b);
  }

  bSave.onclick = () => {
    const rec = { i: id, s: season, n: num, tpl: String(draft.size), slots: draft.slots.slice(),
                  clubs: draft.assigned.slice(),
                  scores: TPL[String(draft.size)].map(() => [null, null]), champs: [] };
    LIVE[id] = hydrate(rec);
    draft = null; liveId = id;
    rebuild(); refreshChrome(); refreshLive();
    Store.saveT(LIVE[id]);
    publishBulletin(LIVE[id]);
    flash("טורניר " + num + " נפתח");
  };

  return wrap;
}

function clubSelect(value, onChange) {
  const s = el("select");
  const names = Array.from(new Set(CLUB_POOL.concat(CLUBS).concat([value]).filter(Boolean)));
  names.forEach(n => { const o = el("option", null, esc(n)); o.value = n; if (n === value) o.selected = true; s.appendChild(o); });
  s.onchange = () => onChange(s.value);
  return s;
}

function runCeremony(host, slots, clubs, done) {
  const pots = Array.from(host.children);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  pots.forEach(p => { p.className = "pot empty"; p.querySelector(".who").textContent = "—"; p.querySelector(".got").innerHTML = ""; });
  if (reduce) {
    slots.forEach((p, i) => paint(i, p, clubs[i]));
    done(); return;
  }
  let i = 0;
  (function step() {
    if (i >= slots.length) { done(); return; }
    const pot = pots[i], who = pot.querySelector(".who");
    pot.className = "pot rolling";
    let ticks = 0;
    const spin = setInterval(() => {
      who.textContent = P[slots[(ticks * 3 + i) % slots.length]];
      if (++ticks > 7) {
        clearInterval(spin);
        paint(i, slots[i], clubs[i]);
        pot.classList.add("reveal");
        i++; setTimeout(step, 210);
      }
    }, 55);
  })();
  function paint(i, p, club) {
    const pot = pots[i];
    pot.className = "pot";
    pot.style.setProperty("--c", PC(p));
    pot.querySelector(".who").textContent = P[p];
    pot.querySelector(".got").innerHTML = club ? clubTag(clubIdx(club)) : "";
    if (!pot.querySelector(".bar")) pot.appendChild(el("i", "bar"));
  }
}

/* ---------- an open tournament ---------- */
/* The control room, cut into the four tabs of the new layout. Everything is
   still built exactly as before; `pane` only decides what goes on screen, so
   no behaviour changes — the fixtures, the table, the final and the admin
   parts simply stop sharing one endless page. */
function livePanel(t, pane) {
  pane = pane || "games";
  const box = el("div", "view");
  const add = (node, p) => { if (p === pane) box.appendChild(node); };
  const tplKey = t.rec.tpl, fixtures = TPL[tplKey];
  const filled = t.m.filter(m => m[6] != null && m[7] != null).length;

  /* the competition header over the fixtures, like a league strip */
  const head = el("div", "leaguehead");
  head.innerHTML = '<span class="lg-ico">🏆</span><span class="lg-name">טורניר ' + t.num + " · " +
    esc(seasonById(t.season).name) + '</span><span class="lg-count" id="liveProgress">' +
    filled + " מתוך " + t.m.length + " משחקים הוזנו" + (t.done ? " · הסתיים" : "") + "</span>";
  const actions = el("div", "chips");

  const bSave = el("button", "btn sm", "שמור הכל");
  bSave.onclick = async () => {
    bSave.disabled = true;
    const label = bSave.textContent;
    bSave.textContent = "שומר…";
    const r = await Store.forceSave(LIVE[t.i] || t);
    bSave.disabled = false;
    bSave.textContent = r.ok ? "נשמר בענן ✓"
      : (r.local ? "לא עלה לענן — נשמר בדפדפן" : "השמירה נכשלה");
    if (!r.ok) flash("השמירה בענן נכשלה: " + r.why, true);
    setTimeout(() => { bSave.textContent = label; }, 2600);
  };
  actions.appendChild(bSave);

  const bBackup = el("button", "btn ghost sm", "העתק גיבוי");
  bBackup.onclick = () => copyText(Store.backup(), bBackup);
  actions.appendChild(bBackup);

  const bDel = el("button", "btn ghost sm danger", "מחק טורניר");
  bDel.onclick = async () => {
    const played = t.m.filter(m => m[6] != null && m[7] != null).length;
    const ok = await askConfirm({
      title: "בטוח שאתה רוצה למחוק את טורניר " + t.num + "?",
      body: played
        ? "בטורניר הזה כבר הוזנו " + played + " מתוך " + t.m.length +
          " משחקים. המחיקה תסיר אותו מהמכשיר ומהענן, וכל התוצאות שבו יאבדו."
        : "הטורניר עדיין ריק. המחיקה תסיר אותו מהמכשיר ומהענן.",
      warn: "אי אפשר לבטל את הפעולה הזאת.",
      ok: "כן, מחק את הטורניר",
      cancel: "לא, חזור"
    });
    if (!ok) return;
    bDel.disabled = true;
    bDel.textContent = "מוחק…";
    try { await Store.delT(t.i); }
    catch (err) {
      showFatal("delete → " + (err && err.message ? err.message : err));
      bDel.disabled = false; bDel.textContent = "מחק טורניר";
      return;
    }
    liveId = null;
    rebuild(); refreshChrome();
    viewLive(document.getElementById("v-live"));
    flash("טורניר " + t.num + " נמחק.");
  };
  actions.appendChild(bDel);
  /* save / backup / delete live under ניהול, not above the fixtures */
  const adm = el("section", "block");
  adm.innerHTML = '<div class="bhead"><h2>טורניר ' + t.num + " · " + esc(seasonById(t.season).name) +
    '</h2><span class="note">שמירה, גיבוי ומחיקה של הטורניר.</span></div>';
  adm.appendChild(actions);
  add(head, "games");
  add(adm, "manage");

  /* squads */
  const sq = el("section", "block");
  sq.innerHTML = '<div class="bhead"><h2>הרכב</h2><span class="note">אפשר להחליף קבוצה גם אחרי הפתיחה.</span></div>';
  const sbox = el("div", "tscroll fit");
  const stb = el("table");
  stb.innerHTML = "<thead><tr><th>מקום</th><th>שחקן</th><th>קבוצה</th></tr></thead>";
  const sbody = el("tbody");
  t.rec.slots.forEach((p, i) => {
    const tr = el("tr");
    tr.innerHTML = '<td class="rank">' + (i + 1) + "</td><td>" + plate(p) + "</td>";
    const td = el("td");
    td.appendChild(clubSelect(t.rec.clubs[i], v => {
      writable(t);
      const j = t.rec.clubs.indexOf(v);
      if (j >= 0 && j !== i) t.rec.clubs[j] = t.rec.clubs[i];
      t.rec.clubs[i] = v;
      const fresh = hydrate(t.rec);
      LIVE[t.i] = fresh;
      rebuild(); refreshChrome(); refreshLive();
      Store.saveT(fresh);
    }));
    tr.appendChild(td); sbody.appendChild(tr);
  });
  stb.appendChild(sbody); sbox.appendChild(stb); sq.appendChild(sbox);
  add(sq, "manage");

  /* live table */
  const st = el("section", "block");
  st.innerHTML = '<div class="bhead"><h2>טבלה חיה</h2><span class="note">ארבעת הראשונים עולים לגמר.</span></div>';
  const stHost = el("div"); stHost.id = "liveStandings";
  stHost.appendChild(standingsTable(t));
  st.appendChild(stHost);
  add(st, "table");

  if (pane === "table") add(filled ? timelineBlock(t) : forecastBlock(t), "table");

  /* fixtures with score entry */
  const mb = el("section", "block");
  /* no heading: the league strip above says what this is */
  const mc = el("div", "panel matches");
  if (t.m.some(m => m[6] == null || m[7] == null)) mc.appendChild(oddsKey());
  t.m.forEach((m, idx) => {
    const [h1, h2, ht, a1, a2, at, hg, ag] = m;
    const fx = el("div", "fixture");
    fx.setAttribute("data-fx", t.i + "-" + idx);
    const row = el("div", "mrow");
    row.innerHTML = '<div class="mn">מחזור ' + (idx + 1) + "</div>" +
      '<div class="side"><div class="duo">' + plateFace(h1) + plateFace(h2) + "</div>" + clubTag(ht) + "</div>";
    const mid = el("div", "entry");
    const mkScore = which => {
      const n = el("input");
      n.type = "number"; n.min = "0"; n.max = "30"; n.autocomplete = "off";
      /* deliberately no id: the platform restores values into ids after a
         republish, which would show a score the data does not hold */
      n.setAttribute("data-k", "sc-" + t.i + "-" + idx + "-" + which);
      n.setAttribute("aria-label", (which === "h" ? "שערי בית" : "שערי חוץ") + " במשחק " + (idx + 1));
      return n;
    };
    const iA = mkScore("a"), iH = mkScore("h");
    iA.value = ag == null ? "" : ag; iH.value = hg == null ? "" : hg;
    /* write the typed score into the model; returns true if anything moved */
    const apply = () => {
      const a = iA.value === "" ? null : Math.max(0, parseInt(iA.value, 10) || 0);
      const h = iH.value === "" ? null : Math.max(0, parseInt(iH.value, 10) || 0);
      const was = t.rec.scores[idx] || [null, null];
      if (was[0] === h && was[1] === a) return false;
      t.rec.scores[idx] = [h, a];
      const fresh = hydrate(t.rec);
      LIVE[t.i] = fresh;
      rebuild(); refreshChrome();
      Store.saveT(fresh);
      publishBulletin(LIVE[t.i]);
      return true;
    };
    /* the second line: odds while unplayed, a saved marker once entered */
    const stateLine = () => {
      fx.querySelectorAll(".odds, .doneline, .gravity").forEach(n => n.remove());
      const sc = t.rec.scores[idx] || [null, null];
      const filled = sc[0] != null && sc[1] != null;
      iA.classList.toggle("filled", filled);
      iH.classList.toggle("filled", filled);
      fx.classList.toggle("played", filled);
      fx.querySelectorAll(".social").forEach(n => n.remove());
      if (!filled) {
        const o = oddsRow((LIVE[t.i] || t).m[idx]);
        if (o) fx.appendChild(o);
        fx.appendChild(socialLine(LIVE[t.i] || t, idx));
        return;
      }
      const d = el("div", "doneline");
      d.setAttribute("data-t", String(t.i));
      const pend = !!Store.dirty[t.i];
      d.innerHTML = '<span class="ok' + (pend ? " pend" : "") + '">' +
        (pend ? "⏳ ממתין לענן" : "✓ נשמר בענן") + "</span>";

      const clr = el("button", "btn ghost sm", "נקה");
      clr.title = "נקה את התוצאה — המשחק יחזור לרשימת הצפויים";
      clr.onclick = () => { iA.value = ""; iH.value = ""; onType(); heavy(); };
      d.appendChild(clr);
      fx.appendChild(d);
      fx.appendChild(socialLine(LIVE[t.i] || t, idx));
    };

    /* write the typed score into the record right now — no timer involved */
    const writeScore = () => {
      writable(t);
      const a2 = iA.value === "" ? null : Math.max(0, parseInt(iA.value, 10) || 0);
      const h2 = iH.value === "" ? null : Math.max(0, parseInt(iH.value, 10) || 0);
      const was = t.rec.scores[idx] || [null, null];
      if (was[0] === h2 && was[1] === a2) return null;
      if ((was[0] == null || was[1] == null) && h2 != null && a2 != null) resultSound(h2, a2);
      t.rec.scores[idx] = [h2, a2];
      t.rec.gg = false;
      const fresh = decorate(hydrate(t.rec));
      LIVE[t.i] = fresh;
      Store.dirty[t.i] = true;
      Store.localFlush();     // safe on this device before anything async runs
      return fresh;
    };

    /* the ✓ button's write: always applies, never short-circuits */
    const writeScoreForce = () => {
      writable(t);
      const a2 = iA.value === "" ? null : Math.max(0, parseInt(iA.value, 10) || 0);
      const h2 = iH.value === "" ? null : Math.max(0, parseInt(iH.value, 10) || 0);
      const was = t.rec.scores[idx] || [null, null];
      if ((was[0] == null || was[1] == null) && h2 != null && a2 != null) resultSound(h2, a2);
      t.rec.scores[idx] = [h2, a2];
      t.rec.gg = false;
      const fresh = decorate(hydrate(t.rec));
      LIVE[t.i] = fresh;
      Store.dirty[t.i] = true;
      Store.localFlush();
      return fresh;
    };

    /* cheap repaint straight from the record */
    const quickPaint = fresh => {
      const sh = document.getElementById("liveStandings");
      if (sh) { sh.innerHTML = ""; sh.appendChild(standingsTable(fresh)); }
      const bar = document.getElementById("liveProgress");
      if (bar) bar.textContent = fresh.m.filter(x => x[6] != null && x[7] != null).length +
        " מתוך " + fresh.m.length + " משחקים הוזנו" + (fresh.done ? " · הסתיים" : "");
      stateLine();
      const fh = document.getElementById("liveFinal");
      if (fh) renderFinal(fresh, fh);
    };

    /* the costly half: aggregates, the cloud, the newsroom */
    const heavy = () => {
      clearTimeout(typing);
      rebuild(); refreshChrome();
      Store.saveT(LIVE[t.i]);
      publishBulletin(LIVE[t.i]);
      scheduleInsights(LIVE[t.i] || t);
    };

    const onType = () => {
      const fresh = writeScore();
      if (!fresh) return;
      quickPaint(fresh);
      clearTimeout(typing);
      typing = setTimeout(heavy, 600);
    };

    let typing = null;
    iA.oninput = iH.oninput = onType;
    iA.onchange = iH.onchange = () => { onType(); heavy(); };
    iA.onblur = iH.onblur = () => { onType(); heavy(); };

    const rowSave = el("button", "rowsave", "✓");
    const saveKey = t.i + "-" + idx;
    rowSave.setAttribute("data-save", saveKey);
    rowSave.title = "שמור את התוצאה ועדכן את הטבלה";
    rowSave.setAttribute("aria-label", "שמור את תוצאת משחק " + (idx + 1));
    rowSave.onclick = async () => {
      clearTimeout(typing);
      rowSave.className = "rowsave busy";
      step("reconcile", () => reconcileScores(LIVE[t.i] || t));
      const wrote = step("write", () => writeScoreForce());
      /* the table first, from the record, before anything that might fail */
      step("paint", () => { if (wrote) quickPaint(wrote); });
      step("rebuild", () => { rebuild(); refreshChrome(); });
      step("redraw", () => refreshLive());
      let r = { ok: false, why: "לא בוצעה שמירה" };
      try { r = await Store.forceSave(LIVE[t.i]); }
      catch (err) { showFatal("save → " + (err && err.message ? err.message : err)); }
      const back = document.querySelector('[data-save="' + saveKey + '"]');
      if (back) {
        back.className = "rowsave " + (r.ok ? "done" : "bad");
        back.textContent = r.ok ? "✓" : "!";
        setTimeout(() => {
          const z = document.querySelector('[data-save="' + saveKey + '"]');
          if (z) { z.className = "rowsave"; z.textContent = "✓"; }
        }, 1900);
      }
      flash(r.ok ? "התוצאה נקלטה והטבלה עודכנה" : "השמירה בענן נכשלה: " + r.why, !r.ok);
      if (r.ok) [3000, 8000].forEach(ms => setTimeout(() => Social.load(true), ms));
    };
    mid.append(iA, el("span", "mut", "–"), iH, rowSave);
    row.appendChild(mid);
    row.insertAdjacentHTML("beforeend",
      '<div class="side away"><div class="duo">' + plateFace(a1) + plateFace(a2) + "</div>" + clubTag(at) + "</div>");
    tapToOpen(row, t.i, idx);            // tap a pair to open the match page
    fx.appendChild(row);
    stateLine();
    mc.appendChild(fx);
  });
  mb.appendChild(mc);
  add(mb, "games");

  /* the final */
  const fb = el("section", "block");
  fb.innerHTML = '<div class="bhead"><h2>הגמר</h2><span class="note">צמד 1–2 מול צמד 3–4. בוחרים מי הרים את הגביע.</span></div>';
  const fHost = el("div"); fHost.id = "liveFinal";
  renderFinal(t, fHost);
  fb.appendChild(fHost);
  add(fb, "final");
  if (pane === "manage") add(clubManager(), "manage");

  setTimeout(() => step("gravity", () => paintGravity(LIVE[t.i] || t)), 90);

  /* the boxes may be filled by the platform after this returns */
  [80, 700].forEach(ms => setTimeout(() => {
    const cur = LIVE[t.i];
    if (cur && reconcileScores(cur)) {
      flash("נמצאו תוצאות שהיו על המסך אך לא נשמרו — הן נקלטו ונשמרו עכשיו.");
      refreshLive();
    }
  }, ms));

  return box;
}

/* which finals the viewer has already walked into, so the intro plays once */
const finalOpened = {};

function renderFinal(t, host) {
  host.innerHTML = "";
  const filled = t.m.filter(m => m[6] != null && m[7] != null).length;
  if (filled < t.m.length) {
    host.appendChild(el("div", "notice",
      "הגמר ייפתח אחרי שכל " + t.m.length + " משחקי הליגה יוזנו. נותרו " + (t.m.length - filled) + "."));
    return;
  }
  const out = finalOutcome(t);
  if (!out) return;

  if (!finalOpened[t.i]) {
    host.appendChild(finalGate(t));
    return;
  }
  host.appendChild(finalStage(t, out, finalOpened[t.i] === "intro"));
  /* crowned: the night's card, straight to WhatsApp */
  if (t.done) { const sb = shareButton(t); sb.classList.add("final-share"); host.appendChild(sb); }
  if (finalOpened[t.i] === "intro") finalOpened[t.i] = true;   // only once
}

function finalGate(t) {
  const tb = t.table;
  const g = el("div", "finalgate turf");
  g.innerHTML = '<div class="kicker">שלב הליגה הסתיים</div>' +
    "<h3>הגמר של טורניר " + t.num + "</h3>" +
    '<div class="four">' + tb.slice(0, 4).map(p => {
      const f = photoOf(p);
      return '<i style="--c:' + PC(p) + (f ? ";background-image:url(" + f + ")" : "") + '"></i>';
    }).join("") + "</div>" +
    '<div class="kicker">' + esc(P[tb[0]]) + " ו" + esc(P[tb[1]]) + " נגד " +
    esc(P[tb[2]]) + " ו" + esc(P[tb[3]]) + "</div>";
  const b = el("button", "btn enter", "כניסה למשחק הגמר");
  b.onclick = () => {
    finalOpened[t.i] = "intro";
    const fh = document.getElementById("liveFinal");
    if (fh) renderFinal(t, fh);
  };
  g.appendChild(b);
  return g;
}

function finalStage(t, out, intro) {
  const tb = t.table;
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (calm) intro = false;
  const st = el("div", "finalstage turf" + (intro ? " intro" : ""));
  st.innerHTML = '<div class="bloom"></div><div class="midline"></div><div class="arc"></div>' +
    '<div class="sweep"></div><div class="curtain"></div>';

  const walk = el("div", "walkout");
  const file = (cls, duo, delayBase) => {
    const f = el("div", "file " + cls);
    duo.forEach((p, i) => {
      const ph = photoOf(p);
      const w = el("div", "walker");
      const d = delayBase + i * 0.55;
      w.style.cssText = "--c:" + PC(p) + (intro ? ";animation-delay:" + d + "s" : "");
      if (intro) w.dataset.d = d;
      w.innerHTML = '<i class="ph" style="' + (ph ? "background-image:url(" + ph + ")" : "") + '"></i>' +
        '<span class="nm">' + esc(P[p]) + '</span><span class="cl">' + esc(CLUBS[t.teamOf[p]]) + "</span>";
      f.appendChild(w);
      if (intro) {
        const dd = delayBase + i * 0.55;
        w.querySelector(".ph").style.animationDelay = dd + "s";
        w.querySelector(".nm").style.animationDelay = (dd + 0.5) + "s";
        w.querySelector(".cl").style.animationDelay = (dd + 0.62) + "s";
      }
    });
    return f;
  };
  /* the lights take the first 1.6s; then one player at a time */
  walk.appendChild(file("home", [tb[0], tb[1]], 1.65));
  walk.appendChild(el("div", "vs", "הגמר"));
  walk.appendChild(file("away", [tb[2], tb[3]], 2.75));
  st.appendChild(walk);

  const board = el("div", "stageboard");
  const br = bracketEl(t, out);
  br.classList.add("onpitch");
  board.appendChild(br);
  st.appendChild(board);

  if (intro) {
    board.classList.add("pending");
    const skip = el("button", "skipintro", "דלג");
    let timer = setTimeout(finish, 5900);
    function finish() {
      clearTimeout(timer);
      st.classList.remove("intro");
      board.classList.remove("pending");
      skip.remove();
    }
    skip.onclick = finish;
    st.appendChild(skip);
  }

  const again = el("button", "replay", "הצג שוב את הכניסה");
  again.onclick = () => {
    finalOpened[t.i] = "intro";
    const fh = document.getElementById("liveFinal");
    if (fh) renderFinal(t, fh);
  };
  st.appendChild(again);
  return st;
}

function bracketEl(t, out) {
  const tb = t.table;
  const topPair = [tb[0], tb[1]], botPair = [tb[2], tb[3]];
  const champTop = t.c.length === 2 && topPair.every(p => t.c.includes(p));
  const champBot = t.c.length === 2 && botPair.every(p => t.c.includes(p));
  const wrap = el("div", "bracket");

  wrap.appendChild(sideCard("מקומות 1–2", topPair, t, champTop, out.played ? out.top : null));

  const core = el("div", "bcore");
  out.L.forEach((L, li) => {
    const m = legMatch(L);
    const has = L.s[0] != null && L.s[1] != null;
    const leg = el("div", "bleg");
    leg.appendChild(el("div", "lbl2", (li === 0 ? "משחק א׳" : "משחק ב׳") + " · מארחים " +
      (li === 0 ? "מקומות 3–4" : "מקומות 1–2")));
    const row = el("div", "blegrow");
    row.innerHTML = "<div>" + clubTag(m[2]) + "</div>";
    const mid = el("div", "entry");
    const mk = which => {
      const n = el("input");
      n.type = "number"; n.min = "0"; n.max = "30"; n.autocomplete = "off";
      n.setAttribute("data-k", "fn-" + t.i + "-" + li + "-" + which);
      n.setAttribute("aria-label", (which === "h" ? "שערי הבית" : "שערי החוץ") + " במשחק גמר " + (li + 1));
      return n;
    };
    const iA = mk("a"), iH = mk("h");
    iA.value = L.s[1] == null ? "" : L.s[1];
    iH.value = L.s[0] == null ? "" : L.s[0];
    iA.classList.toggle("filled", has); iH.classList.toggle("filled", has);
    const commit = () => {
      writable(t);
      const av = iA.value === "" ? null : Math.max(0, parseInt(iA.value, 10) || 0);
      const hv = iH.value === "" ? null : Math.max(0, parseInt(iH.value, 10) || 0);
      if (!t.rec.final) t.rec.final = [[null, null], [null, null]];
      const was = t.rec.final[li] || [null, null];
      if (was[0] === hv && was[1] === av) return;
      t.rec.final[li] = [hv, av];
      t.rec.gg = false;          // a new score retires any golden-goal pick
      const fresh = hydrate(t.rec);
      LIVE[t.i] = fresh;
      rebuild(); refreshChrome();
      Store.saveT(fresh); publishBulletin(LIVE[t.i]);
      const fh = document.getElementById("liveFinal");
      if (fh) renderFinal(LIVE[t.i], fh);
      const sh = document.getElementById("liveStandings");
      if (sh) { sh.innerHTML = ""; sh.appendChild(standingsTable(LIVE[t.i])); }
    };
    let typing = null;
    iA.oninput = iH.oninput = () => { clearTimeout(typing); typing = setTimeout(commit, 350); };
    iA.onchange = iH.onchange = () => { clearTimeout(typing); commit(); };
    const legSave = el("button", "rowsave", "✓");
    legSave.title = "שמור את תוצאת משחק הגמר";
    legSave.onclick = async () => {
      commit();
      legSave.className = "rowsave busy";
      const r = await Store.forceSave(LIVE[t.i] || t);
      legSave.className = "rowsave " + (r.ok ? "done" : "bad");
      if (!r.ok) flash("השמירה בענן נכשלה: " + r.why, true);
      setTimeout(() => { legSave.className = "rowsave"; }, 1800);
    };
    mid.append(iA, el("span", "mut", "–"), iH, legSave);
    row.appendChild(mid);
    row.insertAdjacentHTML("beforeend", '<div class="away">' + clubTag(m[5]) + "</div>");
    leg.appendChild(row);
    if (!has) { const o = oddsRow(m); if (o) leg.appendChild(o); }
    core.appendChild(leg);
  });

  const agg = el("div", "bagg");
  agg.innerHTML = out.played
    ? '<span class="lbl2">סך שני המשחקים</span><span class="v">' + out.bot + " – " + out.top + "</span>"
    : '<span class="lbl2">הזן את שתי התוצאות כדי להכריע</span>';
  core.appendChild(agg);

  if (out.played && !out.winner) {
    const pk = el("div", "notice warn");
    pk.innerHTML = "<b>שוויון בסך שני המשחקים</b> מי ניצח בשער הזהב?";
    [topPair, botPair].forEach(duo => {
      const b2 = el("button", "btn ghost sm", P[duo[0]] + " ו" + P[duo[1]]);
      b2.onclick = () => {
        writable(t);
        t.rec.champs = duo.slice().sort((x, y) => x - y);
        t.rec.gg = true;
        const fresh = hydrate(t.rec);
        LIVE[t.i] = fresh;
        rebuild(); refreshChrome();
        Store.saveT(fresh); publishBulletin(LIVE[t.i]);
        const fh = document.getElementById("liveFinal");
        if (fh) renderFinal(LIVE[t.i], fh);
      };
      pk.appendChild(b2);
    });
    core.appendChild(pk);
  }
  wrap.appendChild(core);
  wrap.appendChild(sideCard("מקומות 3–4", botPair, t, champBot, out.played ? out.bot : null));
  wrap.appendChild(dugout(t));

  if (t.done) wrap.appendChild(podiumScene(t));
  return wrap;
}

/* the champions on the rostrum, under fireworks */
const FW_SPARKS = (() => {
  const cols = ["#F5C542", "#FF8A3D", "#6EE7FF", "#FF5FA2", "#9BE564", "#FFFFFF"];
  const out = [];
  for (let c = 0; c < cols.length; c++) {
    const parts = [];
    for (let k = 0; k < 16; k++) {
      const ang = (k / 16) * Math.PI * 2;
      parts.push(Math.round(Math.cos(ang) * 58) + "px " + Math.round(Math.sin(ang) * 58) + "px 0 -1px " + cols[c]);
    }
    out.push(parts.join(","));
  }
  return out;
})();

/* The platform restores form values after a republish without firing any
   event, so a score can sit in a box that the record knows nothing about.
   Adopt anything on screen that the record disagrees with. */
function reconcileScores(t) {
  if (!t || !t.rec) return false;
  writable(t);
  let changed = false;
  const pick = k => {
    const n = document.querySelector('[data-k="' + k + '"]');
    if (!n) return undefined;
    return n.value === "" ? null : Math.max(0, parseInt(n.value, 10) || 0);
  };
  for (let i = 0; i < t.m.length; i++) {
    const h = pick("sc-" + t.i + "-" + i + "-h"), a = pick("sc-" + t.i + "-" + i + "-a");
    if (h === undefined || a === undefined) continue;
    const was = t.rec.scores[i] || [null, null];
    if (was[0] !== h || was[1] !== a) { t.rec.scores[i] = [h, a]; changed = true; }
  }
  for (let li = 0; li < 2; li++) {
    const h = pick("fn-" + t.i + "-" + li + "-h"), a = pick("fn-" + t.i + "-" + li + "-a");
    if (h === undefined || a === undefined) continue;
    if (!t.rec.final) t.rec.final = [[null, null], [null, null]];
    const was = t.rec.final[li] || [null, null];
    if (was[0] !== h || was[1] !== a) { t.rec.final[li] = [h, a]; t.rec.gg = false; changed = true; }
  }
  if (!changed) return false;
  LIVE[t.i] = decorate(hydrate(t.rec));
  Store.dirty[t.i] = true;
  Store.localFlush();
  rebuild(); refreshChrome();
  Store.saveT(LIVE[t.i]);
  publishBulletin(LIVE[t.i]);
  return true;
}

/* ==========================================================================
   The standings — a scores-app table, dressed up.
   --------------------------------------------------------------------------
   Every row: place (and how it moved since the last result), the player's
   face on his colour, name and club, form over his last five games, then
   games · goal difference · points. While the league is running, a thin bar
   under each row is his chance of reaching the final (the same 4,000-run
   simulation the newsroom uses, so it is usually cached). The final format
   is 1+2 against 3+4, so the zones say exactly that: gold for the 1–2 pair,
   blue for the 3–4 pair, and a "קו הגמר" line under the fourth place.
   opts.hl — a Set of players to mark (the match page marks its four).
   ========================================================================== */
function standOrder(t, skip) {
  const acc = {};
  t.players.forEach(p => { acc[p] = { pts: 0, gf: 0, ga: 0 }; });
  t.m.forEach((m, k) => {
    if (k === skip || m[6] == null || m[7] == null) return;
    const hp = m[6] > m[7] ? 3 : m[6] === m[7] ? 1 : 0, ap = m[7] > m[6] ? 3 : m[6] === m[7] ? 1 : 0;
    [m[0], m[1]].forEach(p => { acc[p].pts += hp; acc[p].gf += m[6]; acc[p].ga += m[7]; });
    [m[3], m[4]].forEach(p => { acc[p].pts += ap; acc[p].gf += m[7]; acc[p].ga += m[6]; });
  });
  return t.players.slice().sort((a, b) => acc[b].pts - acc[a].pts ||
    (acc[b].gf - acc[b].ga) - (acc[a].gf - acc[a].ga) || acc[b].gf - acc[a].gf);
}
function formOf(t, p) {
  const out = [];
  t.m.forEach(m => {
    if (m[6] == null || m[7] == null) return;
    const home = m[0] === p || m[1] === p, away = m[3] === p || m[4] === p;
    if (!home && !away) return;
    const gf = home ? m[6] : m[7], ga = home ? m[7] : m[6];
    out.push({ r: gf > ga ? "w" : gf < ga ? "l" : "d", s: gf + ":" + ga });
  });
  return out.slice(-5);
}

/* Three looks for the same standings, picked with the switch on top and
   remembered on this phone: the dressed-up cards, the plain table it
   replaced, and charts (the points race and the goals). */
const TABLE_MODES = [["fancy", "מפוארת"], ["classic", "קלאסית"], ["charts", "גרפים"]];
const tableMode = () => { try { const v = localStorage.getItem("fifa-table-mode"); return TABLE_MODES.some(m => m[0] === v) ? v : "fancy"; } catch (e) { return "fancy"; } };
function standingsTable(t, opts) {
  const host = el("div", "ltwrap");
  const draw = () => {
    const mode = tableMode();
    host.innerHTML = "";
    const sw = el("div", "ltmodes");
    sw.setAttribute("role", "tablist");
    TABLE_MODES.forEach(([k, label]) => {
      const b = el("button", "ltmode" + (k === mode ? " on" : ""), label);
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(k === mode));
      b.onclick = () => { try { localStorage.setItem("fifa-table-mode", k); } catch (e) {} draw(); };
      sw.appendChild(b);
    });
    host.appendChild(sw);
    host.appendChild(mode === "classic" ? classicTable(t, opts) : mode === "charts" ? chartTable(t, opts) : fancyTable(t, opts));
  };
  draw();
  return host;
}

/* the plain table, as it was before the redesign */
function classicTable(t, opts) {
  opts = opts || {};
  const box = el("div", "tscroll fit");
  const tbl = el("table", "sttbl");
  tbl.innerHTML = "<thead><tr>" +
    "<th>#</th><th>שחקן</th><th>קבוצה</th>" +
    '<th class="c-num">מאזן</th><th class="c-num">שערים</th>' +
    '<th class="c-num">הפרש</th><th class="c-num">נק׳</th></tr></thead>';
  const body = el("tbody");
  t.table.forEach((p, i) => {
    const a = t.acc[p], gd = a.gf - a.ga, champ = t.c.includes(p), adv = i < 4;
    const tr = el("tr", (adv ? "qual" : "") + (opts.hl && opts.hl.has(p) ? " hl" : ""));
    const club = CLUBS[t.teamOf[p]] || "—";
    tr.innerHTML =
      '<td class="rank">' + (i + 1) + "</td>" +
      '<td><span class="who">' + plate(p) +
        (champ ? '<span class="crown" title="אלוף הטורניר">★</span>' : "") + "</span></td>" +
      '<td><span class="club" style="--c:' + clubCol(club) + '" title="' + esc(club) +
        '"><i class="cdot"></i><span class="cn">' + esc(club) + "</span></span></td>" +
      '<td class="c-num"><span class="ltr">' + a.w + "-" + a.dr + "-" + a.l + "</span></td>" +
      '<td class="c-num">' + scoreTxt(a.gf, a.ga) + "</td>" +
      '<td class="c-num ' + (gd > 0 ? "pos" : gd < 0 ? "neg" : "") + '">' + sgn(gd) + "</td>" +
      '<td class="c-num strong">' + a.pts + "</td>";
    body.appendChild(tr);
  });
  tbl.appendChild(body);
  box.appendChild(tbl);
  const wrap = el("div");
  wrap.appendChild(box);
  wrap.appendChild(el("div", "stlegend",
    '<span><b>מאזן</b> נצחונות · תיקו · הפסדים</span>' +
    '<span><b>שערים</b> זכות · חובה</span>' +
    '<span><b style="color:var(--gold)">מספר מקום בזהב</b> עלה לגמר</span>' +
    '<span><b style="color:var(--gold)">★</b> אלוף</span>'));
  return wrap;
}

/* charts: the points race match by match, then the points and goals of each
   player as bars. Drawn as plain SVG so it works offline. */
function chartTable(t, opts) {
  opts = opts || {};
  const wrap = el("div", "ltcharts");
  const order = t.m.map((m, k) => k).filter(k => t.m[k][6] != null && t.m[k][7] != null);
  const pts = {}; t.players.forEach(p => { pts[p] = [0]; });
  order.forEach(k => {
    const m = t.m[k], hp = m[6] > m[7] ? 3 : m[6] === m[7] ? 1 : 0, ap = m[7] > m[6] ? 3 : m[6] === m[7] ? 1 : 0;
    t.players.forEach(p => {
      const last = pts[p][pts[p].length - 1];
      const add = (m[0] === p || m[1] === p) ? hp : (m[3] === p || m[4] === p) ? ap : 0;
      pts[p].push(last + add);
    });
  });

  /* 1 — the points race */
  const race = el("section", "ltc");
  race.appendChild(el("div", "ltc-h", "<b>מרוץ הנקודות</b><span>נקודות מצטברות אחרי כל משחק</span>"));
  if (!order.length) {
    race.appendChild(el("div", "mut", "הגרף יתחיל אחרי התוצאה הראשונה."));
  } else {
    const W = 360, H = 220, L = 26, R = 62, T = 12, B = 24;
    const n = order.length, maxP = Math.max(3, ...t.players.map(p => pts[p][n]));
    const x = i => L + (W - L - R) * (i / n), y = v => T + (H - T - B) * (1 - v / maxP);
    let g = "";
    for (let v = 0; v <= maxP; v += maxP > 12 ? 6 : 3) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/>' +
           '<text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" class="ax" text-anchor="end">' + v + "</text>";
    }
    for (let i = 1; i <= n; i++) {
      if (n <= 12 || i % 2 === 0 || i === n)
        g += '<text x="' + x(i) + '" y="' + (H - 8) + '" class="ax" text-anchor="middle">' + (order[i - 1] + 1) + "</text>";
    }
    /* end labels, nudged apart so names do not sit on each other */
    const ends = t.table.map(p => ({ p, y: y(pts[p][n]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    const lines = t.table.slice().reverse().map(p => {
      const d = pts[p].map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
      const on = opts.hl ? opts.hl.has(p) : true;
      return '<path d="' + d + '" class="ln' + (on ? "" : " dim") + '" style="stroke:' + PC(p) + '"/>' +
        '<circle cx="' + x(n) + '" cy="' + y(pts[p][n]) + '" r="3.5" style="fill:' + PC(p) + '"/>';
    }).join("");
    const labels = ends.map(e => '<text x="' + (x(n) + 8) + '" y="' + (e.y + 4) + '" class="lb" style="fill:' + PC(e.p) + '">' +
      esc(P[e.p]) + " " + pts[e.p][n] + "</text>").join("");
    race.appendChild(el("div", "ltc-svg",
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="מרוץ הנקודות">' + g + lines + labels + "</svg>"));
    race.appendChild(el("div", "ltc-note", "הציר התחתון: מספר המשחק בטורניר."));
  }
  wrap.appendChild(race);

  /* 2 — points, as bars split into wins and draws */
  const maxPts = Math.max(1, ...t.players.map(p => t.acc[p].pts));
  const bars = el("section", "ltc");
  bars.appendChild(el("div", "ltc-h", "<b>נקודות</b><span>ירוק מנצחונות, אפור מתיקו</span>"));
  t.table.forEach((p, i) => {
    const a = t.acc[p];
    bars.appendChild(el("div", "ltc-row" + (opts.hl && opts.hl.has(p) ? " hl" : "") + (i === 3 && t.table.length > 4 ? " cut" : ""),
      '<span class="ltc-n">' + (i + 1) + "</span><span>" + plate(p) + "</span>" +
      '<span class="ltc-bar"><i class="w" style="width:' + (100 * 3 * a.w / maxPts) + '%"></i><i class="d" style="width:' + (100 * a.dr / maxPts) + '%"></i></span>' +
      '<b class="ltc-v">' + a.pts + "</b>"));
  });
  wrap.appendChild(bars);

  /* 3 — goals: scored to one side, conceded to the other */
  const maxG = Math.max(1, ...t.players.map(p => Math.max(t.acc[p].gf, t.acc[p].ga)));
  const goals = el("section", "ltc");
  goals.appendChild(el("div", "ltc-h", '<b>שערים</b><span><b style="color:var(--pos)">זכות</b> מול <b style="color:var(--neg)">חובה</b></span>'));
  t.table.forEach(p => {
    const a = t.acc[p], gd = a.gf - a.ga;
    goals.appendChild(el("div", "ltc-grow" + (opts.hl && opts.hl.has(p) ? " hl" : ""),
      "<span>" + plate(p) + "</span>" +
      '<span class="ltc-dual"><span class="ga"><i style="width:' + (100 * a.ga / maxG) + '%"></i><em>' + a.ga + "</em></span>" +
      '<span class="gf"><i style="width:' + (100 * a.gf / maxG) + '%"></i><em>' + a.gf + "</em></span></span>" +
      '<b class="ltc-v ' + (gd > 0 ? "pos" : gd < 0 ? "neg" : "") + '">' + sgn(gd) + "</b>"));
  });
  wrap.appendChild(goals);
  return wrap;
}

function fancyTable(t, opts) {
  opts = opts || {};
  const played = t.m.filter(m => m[6] != null && m[7] != null).length, total = t.m.length;
  const league = played < total;
  const sim = league ? simulate(t, 4000) : null;
  /* how each place moved since the last result — only where the order is
     derived here too (archive tournaments keep their recorded tie-breaks) */
  const lp = lastPlayed(t);
  const prev = t.live && lp && played >= 2 ? standOrder(t, lp.i) : null;

  const wrap = el("div", "lt");
  wrap.appendChild(el("div", "lt-top",
    '<span>' + (played ? "אחרי " + played + " מתוך " + total + " משחקים" : "לפני המשחק הראשון") +
    (t.done ? " · הטורניר הסתיים" : !league ? " · שלב הליגה הסתיים" : "") + "</span>" +
    '<span class="lt-prog"><i style="width:' + Math.round(100 * played / Math.max(1, total)) + '%"></i></span>'));
  wrap.appendChild(el("div", "lt-head",
    '<span>#</span><span></span><span>שחקן</span><span>מש׳</span><span>הפרש</span><span>נק׳</span>'));

  t.table.forEach((p, i) => {
    const a = t.acc[p], gd = a.gf - a.ga, champ = t.c.includes(p);
    const zone = i < 2 ? "z12" : i < 4 ? "z34" : "out";
    const row = el("div", "lt-row " + zone + (i === 0 && played ? " lead" : "") +
      (opts.hl && opts.hl.has(p) ? " hl" : ""));
    row.style.setProperty("--c", PC(p));
    row.style.animationDelay = (i * 45) + "ms";
    let mv = "";
    if (prev) {
      const d = prev.indexOf(p) - i;
      mv = d > 0 ? '<i class="mv up">▲' + d + "</i>" : d < 0 ? '<i class="mv dn">▼' + (-d) + "</i>" : '<i class="mv eq">•</i>';
    }
    const fm = formOf(t, p);
    const form = fm.length ? '<span class="lt-form">' + fm.map(f =>
      '<i class="f-' + f.r + '" title="' + f.s + '">' + (f.r === "w" ? "נ" : f.r === "d" ? "ת" : "ה") + "</i>").join("") + "</span>" : "";
    const face = photoOf(p) ? '<i class="pface pf' + p + '"></i>' : "<b>" + esc(P[p].slice(0, 1)) + "</b>";
    let odds = "";
    if (sim && sim[p]) {
      const v = Math.round(sim[p].top4 * 100);
      odds = '<div class="lt-odds"><span class="lt-obar"><i style="width:' + Math.max(2, v) + '%"></i></span>' +
        '<span class="lt-oval">לגמר <b class="ltr">' + v + "%</b></span></div>";
    } else if (!league && !t.done && i < 4) {
      odds = '<div class="lt-odds done"><span class="lt-oval">בגמר ✓</span></div>';
    }
    row.innerHTML =
      '<div class="lt-pos"><b>' + (i + 1) + "</b>" + mv + "</div>" +
      '<div class="lt-face">' + face + "</div>" +
      '<div class="lt-main"><div class="lt-name">' + esc(P[p]) +
        (champ ? '<span class="lt-crown" title="אלוף הטורניר">👑</span>' : "") + "</div>" +
        '<div class="lt-sub">' + clubTag(t.teamOf[p]) +
          '<span class="lt-rec ltr">' + a.w + "-" + a.dr + "-" + a.l + " · " + a.gf + ":" + a.ga + "</span></div>" +
        form + "</div>" +
      '<div class="lt-n">' + a.g + "</div>" +
      '<div class="lt-n ' + (gd > 0 ? "pos" : gd < 0 ? "neg" : "") + '">' + sgn(gd) + "</div>" +
      '<div class="lt-pts">' + a.pts + "</div>" + odds;
    wrap.appendChild(row);
    if (i === 3 && t.table.length > 4) wrap.appendChild(el("div", "lt-cut", "<span>קו הגמר</span>"));
  });

  wrap.appendChild(el("div", "stlegend lt-legend",
    '<span><i class="lt-key z12"></i>צמד 1–2 בגמר</span>' +
    '<span><i class="lt-key z34"></i>צמד 3–4 בגמר</span>' +
    '<span><b>נ·ת·ה</b> חמשת המשחקים האחרונים</span>' +
    (prev ? '<span><b style="color:var(--pos)">▲</b><b style="color:var(--neg)">▼</b> שינוי מאז התוצאה האחרונה</span>' : "")));
  return wrap;
}

/* ---------- seasons ---------- */
function seasonManager() {
  const b = el("section", "block");
  b.innerHTML = '<div class="bhead"><h2>עונות</h2><span class="note">' +
    'עונה חדשה מתחילה את מספור הטורנירים מ־1. העונות הקודמות נשמרות במלואן, ומעבר ביניהן נעשה בבורר שלמעלה. ' +
    'חוק ההגרלה ממשיך לחצות עונות — הקבוצה החסומה היא זו שהייתה לשחקן בטורניר הקודם באותו פורמט, גם אם הוא בעונה שעברה.' +
    "</span></div>";
  const box = el("div", "panel");
  box.style.padding = "13px 15px";
  const list = el("div");
  list.style.cssText = "display:flex;flex-direction:column;gap:9px";
  SEASONS.slice().sort((a, b) => a.id - b.id).forEach(sn => {
    const row = el("div");
    row.style.cssText = "display:flex;align-items:center;gap:10px;flex-wrap:wrap";
    const mine = TS.filter(t => t.season === sn.id);
    const inp = textInput(sn.name);
    inp.id = "season-name-" + sn.id;
    inp.style.cssText = "font-weight:700;min-width:150px";
    inp.onchange = async () => {
      const v = inp.value.trim();
      if (!v) { inp.value = sn.name; return; }
      sn.name = v; await Store.saveConfig(); refreshChrome(); viewLive(document.getElementById("v-live"));
    };
    row.appendChild(inp);
    row.appendChild(el("span", "mut", mine.length + " טורנירים" + (SCOPE === sn.id ? " · מוצגת כעת" : "")));
    if (SCOPE !== sn.id) {
      const go2 = el("button", "btn ghost sm", "הצג");
      go2.onclick = () => setScope(sn.id);
      row.appendChild(go2);
    }
    if (!mine.length && SEASONS.length > 1) {
      const del = el("button", "btn ghost sm danger", "מחק");
      del.onclick = async () => {
        SEASONS = SEASONS.filter(x => x.id !== sn.id);
        if (SCOPE === sn.id) SCOPE = latestSeason();
        await Store.saveConfig(); rebuild(); refreshChrome(); viewLive(document.getElementById("v-live"));
      };
      row.appendChild(del);
    }
    list.appendChild(row);
  });
  box.appendChild(list);

  const add = el("div");
  add.style.cssText = "display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center";
  const name = textInput("", "שם העונה החדשה…");
  name.id = "new-season-name";
  name.style.minWidth = "190px";
  const btn = el("button", "btn", "התחל עונה חדשה");
  const create = async () => {
    const v = name.value.trim();
    if (!v) return flash("צריך לתת שם לעונה");
    if (SEASONS.some(x => x.name === v)) return flash("כבר יש עונה בשם הזה");
    const id = Math.max.apply(null, SEASONS.map(x => x.id)) + 1;
    SEASONS.push({ id, name: v });
    draft = null; liveId = null;
    setScope(id);
    Store.saveConfig();
    flash("העונה «" + v + "» נפתחה — הטורניר הבא יהיה מספר 1");
  };
  btn.onclick = create;
  name.onkeydown = e => { if (e.key === "Enter") create(); };
  add.append(name, btn);
  box.appendChild(add);
  b.appendChild(box);
  return b;
}

    '<span class="note">בחר לכל תמונה את השחקן שבה — התמונות ייכנסו לקלפים.</span></div>';

    slot.append(el("div", "num", "תמונה " + k), th);
    const sel = el("select");
    sel.appendChild(el("option", null, "— ללא שיוך —"));
    sel.lastChild.value = "";
    P.forEach((name, i) => {
      const o = el("option", null, esc(name));
      o.value = String(i);
      if (PHOTOMAP[k] === i) o.selected = true;
      sel.appendChild(o);
    });

}

/* ==========================================================================
   Season awards — every one read straight off the recorded results
   ========================================================================== */
function awardCard(lbl, who, big, sub, gold) {
  return el("div", "award" + (gold ? " gold" : ""),
    '<div class="lbl">' + lbl + '</div><div class="who">' + who + "</div>" +
    '<div class="big">' + big + '</div><div class="sub">' + sub + "</div>" +
    (gold ? '<span class="cup2">🏆</span>' : ""));
}

function awardsBlock() {
  const done = TSS.filter(t => t.done);
  if (!done.length) return null;
  const sec = el("section", "block");
  sec.innerHTML = '<div class="bhead"><h2>פרסי העונה</h2><span class="note">' +
    esc(SCOPE === "all" ? "כל העונות" : seasonById(SCOPE).name) + " · " + done.length +
    " טורנירים. כל פרס מחושב מהתוצאות הגולמיות.</span></div>";
  const g = el("div", "awards");
  const cand = S.filter(s => s.g);
  if (!cand.length) return null;
  const best = (a, f) => a.reduce((x, y) => f(y) > f(x) ? y : x);

  const sc = best(cand, s => s.gf);
  g.appendChild(awardCard("מלך השערים", plate(sc.i, "lg"), nf(sc.gf),
    f2(sc.gf / sc.g) + " שערים למשחק, ב־" + sc.g + " משחקים", true));

  const wall = cand.reduce((x, y) => (y.ga / y.g) < (x.ga / x.g) ? y : x);
  g.appendChild(awardCard("חומת ההגנה", plate(wall.i, "lg"), f2(wall.ga / wall.g),
    "ספיגות למשחק · " + nf(wall.ga) + " בסך הכל", true));

  const king = best(cand, s => s.titles);
  g.appendChild(awardCard("מלך האליפויות", plate(king.i, "lg"), king.titles,
    "מתוך " + king.app + " טורנירים · " + Math.round(100 * king.titles / king.app) + "% מהם", true));

  const prs = Object.keys(PAIR).map(k => PAIR[k]).filter(x => x.g >= 8);
  if (prs.length) {
    const bp = prs.reduce((x, y) => (y.titles - x.titles || y.ppg - x.ppg) > 0 ? y : x);
    g.appendChild(awardCard("הצמד של העונה",
      plate(bp.a) + '<span class="mut">+</span>' + plate(bp.b),
      bp.titles + " אליפויות", f2(bp.ppg) + " נק׳ למשחק ב־" + bp.g + " משחקים יחד", true));
  }

  /* the two halves of the season, so a turnaround has something to turn from */
  if (done.length >= 6 && LOG) {
    const cut = Math.floor(done.length / 2);
    const A = {}, B = {};
    done.slice(0, cut).forEach(t => { A[t.i] = 1; });
    done.slice(cut).forEach(t => { B[t.i] = 1; });
    const rate = (p, ids) => {
      let n = 0, pts = 0;
      LOG[p].forEach(e => { if (ids[e.ti]) { n++; pts += e.pts; } });
      return { n, ppg: n ? pts / n : 0 };
    };
    const moves = cand.map(s => {
      const a = rate(s.i, A), b = rate(s.i, B);
      return { p: s.i, a, b, d: b.ppg - a.ppg };
    }).filter(m => m.a.n >= 8 && m.b.n >= 8);
    if (moves.length) {
      const up = moves.reduce((x, y) => y.d > x.d ? y : x);
      const dn = moves.reduce((x, y) => y.d < x.d ? y : x);
      const half = (m, k) => f2(m[k].ppg) + " נק׳ למשחק";
      g.appendChild(awardCard("המהפך של העונה", plate(up.p, "lg"), sgnF2(up.d),
        "מחצית ראשונה " + half(up, "a") + " ← מחצית שנייה " + half(up, "b")));
      g.appendChild(awardCard("האכזבה של העונה", plate(dn.p, "lg"), sgnF2(dn.d),
        "מחצית ראשונה " + half(dn, "a") + " ← מחצית שנייה " + half(dn, "b")));
    }
  }

  const iron = best(cand, s => s.app);
  g.appendChild(awardCard("איש הברזל", plate(iron.i, "lg"), iron.app + " הופעות",
    "מתוך " + done.length + " טורנירים בעונה"));

  const clubs = TEAM.map((x, i) => ({ i, x })).filter(o => o.x.g >= 20);
  if (clubs.length) {
    const bc = clubs.reduce((x, y) => y.x.ppg > x.x.ppg ? y : x);
    g.appendChild(awardCard("הקבוצה של העונה", clubTag(bc.i), f2(bc.x.ppg),
      "נק׳ למשחק ב־" + bc.x.g + " הופעות על המגרש"));
  }

  sec.appendChild(g);
  return sec;
}

/* ==========================================================================
   The forecast made before a ball was kicked
   ========================================================================== */
const PRE = {};
const preKey = t => t.i + ":" + t.d.map(x => x.join(".")).join(",");
function preForecast(t) {
  if (!MODEL || !MODEL.matches || !t.m.length) return null;
  const k = preKey(t);
  if (PRE[k]) return PRE[k];
  const sim = simulate(snapshotAt(t, 0), 2500, null, (Math.imul(t.i, 2654435761) ^ 0x5f3a) >>> 0);
  if (!sim) return null;
  /* one per tournament, and the season forecast walks all of them — the cap
     must sit well above the archive or it would wipe itself mid-walk */
  if (Object.keys(PRE).length > 400) for (const x in PRE) delete PRE[x];
  PRE[k] = sim;
  return sim;
}

/* How good is that forecast, measured against every tournament that ended. */
function modelScoreBlock() {
  const sec = el("section", "block");
  sec.innerHTML = '<div class="bhead"><h2>כמה המודל צדק</h2><span class="note">' +
    'התחזית שלפני כל טורניר, מול מי שבאמת הרים. שימו לב: המודל מכויל על כל המשחקים שנרשמו, ' +
    'כולל אלה של אותו טורניר — ולכן זו בחינה בדיעבד. רק הטורניר החי הוא תחזית אמיתית.</span></div>';
  const host = el("div");
  const wait = el("div", "mut", "מריץ את התחזיות…");
  host.appendChild(wait);
  sec.appendChild(host);
  /* One forecast per tournament, ~35ms each on a laptop and several times
     that on a phone. Run them one per step, yielding between them, and only
     once this block is actually scrolled into view. */
  const go = async () => {
    const done = TSS.filter(t => t.done && t.c && t.c.length === 2);
    const rows = [], buckets = [[0, .15], [.15, .3], [.3, .45], [.45, 1.01]];
    const acc = buckets.map(() => ({ n: 0, sum: 0, hit: 0 }));
    let favHit = 0, champSum = 0, baseSum = 0, n = 0;
    for (let k = 0; k < done.length; k++) {
      const t = done[k];
      if (!PRE[preKey(t)]) {
        preForecast(t);
        await yieldNow();
        if (!host.isConnected) return;                     // the user left the tab
        wait.textContent = "מריץ את התחזיות… " + (k + 1) + " מתוך " + done.length;
      }
      const sim = preForecast(t);
      if (!sim) continue;
      n++;
      const ranked = t.players.slice().sort((a, b) => sim[b].title - sim[a].title);
      if (t.c.indexOf(ranked[0]) >= 0) favHit++;
      champSum += (sim[t.c[0]].title + sim[t.c[1]].title) / 2;
      baseSum += 2 / t.size;
      t.players.forEach(p => {
        const v = sim[p].title, bi = buckets.findIndex(b => v >= b[0] && v < b[1]);
        if (bi < 0) return;
        acc[bi].n++; acc[bi].sum += v; acc[bi].hit += t.c.indexOf(p) >= 0 ? 1 : 0;
      });
      rows.push({ t, fav: ranked[0], hit: t.c.indexOf(ranked[0]) >= 0 });
    }
    host.innerHTML = "";
    if (!n) { host.appendChild(el("div", "mut", "אין עדיין טורנירים שהסתיימו.")); return; }
    /* how far the buckets sit from what actually happened, weighted by size */
    let calErr = 0, calN = 0;
    acc.forEach(a => { if (a.n) { calErr += a.n * Math.abs(a.sum / a.n - a.hit / a.n); calN += a.n; } });
    calErr = calN ? calErr / calN : 0;
    const strip = el("div", "strip4");
    [["הפייבוריט הרים", Math.round(100 * favHit / n) + "%", favHit + " מתוך " + n + " טורנירים"],
     ["הסיכוי שניתן לאלופים", Math.round(100 * champSum / n) + "%",
      "מול " + Math.round(100 * baseSum / n) + "% אם היה מנחש באקראי"],
     ["דיוק הכיול", Math.round(100 * calErr) + " נק׳ אחוז",
      "פער ממוצע בין מה שנחזה למה שקרה — נמוך יותר, מכויל טוב יותר"]
    ].forEach(([k, v, s]) => strip.appendChild(el("div", "stat",
      '<div class="lbl">' + k + '</div><div class="v">' + v + '</div><div class="s">' + esc(s) + "</div>")));
    host.appendChild(strip);

    const box = el("div", "tscroll fit");
    const tb = el("table", "calib");
    tb.innerHTML = '<thead><tr><th>טווח התחזית</th><th>מקרים</th><th>ממוצע שנחזה</th>' +
      "<th>קרה בפועל</th></tr></thead>";
    const bd = el("tbody");
    const lbl = ["עד 15%", "15–30%", "30–45%", "מעל 45%"];
    acc.forEach((a, i) => {
      if (!a.n) return;
      const predicted = a.sum / a.n, actual = a.hit / a.n;
      const tr = el("tr");
      tr.innerHTML = "<td>" + lbl[i] + '</td><td class="c-num">' + a.n +
        '</td><td class="c-num">' + Math.round(100 * predicted) + "%</td>" +
        '<td class="c-num strong"><span class="bar" style="width:' +
        Math.round(70 * actual) + 'px"></span>' + Math.round(100 * actual) + "%</td>";
      bd.appendChild(tr);
    });
    tb.appendChild(bd); box.appendChild(tb);
    host.appendChild(box);
    host.appendChild(el("div", "stlegend",
      '<span>כל שורה: כל המקרים שבהם המודל נתן לשחקן סיכוי בטווח הזה, ' +
      'וכמה מהם באמת הסתיימו באליפות. ככל ששתי העמודות האחרונות קרובות, הכיול טוב יותר.</span>'));
  };
  /* Start when the block comes into view, or after a moment regardless: a
     page that is not being displayed never reports intersections, and the
     work is stepped now, so running it unseen costs battery, not taps. */
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    go().catch(err => showFatal("modelscore → " + (err && err.message ? err.message : err)));
  };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => {
      if (es.some(e => e.isIntersecting)) { io.disconnect(); start(); }
    }, { rootMargin: "400px" });
    io.observe(sec);
  }
  setTimeout(start, 1500);
  return sec;
}

function titleRace() {
  const done = TSS.filter(t => t.done);
  const n = done.length;
  const W = 980, H = 330, mT = 16, mB = 30, mL = 122, mR = 42;
  const cum = Array.from({ length: NP }, () => [0]);
  done.forEach(t => { for (let p = 0; p < NP; p++) cum[p].push(cum[p][cum[p].length - 1] + (t.c.includes(p) ? 1 : 0)); });
  const maxY = Math.max(1, ...cum.map(a => a[a.length - 1]));
  const x = i => W - mR - (i / n) * (W - mL - mR);
  const y = v => H - mB - (v / maxY) * (H - mT - mB);

  const card = el("div", "chart-card");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "אליפויות מצטברות לכל שחקן");
  let g = "";
  const step = maxY > 20 ? 5 : maxY > 8 ? 3 : 1;
  for (let v = 0; v <= maxY; v += step) {
    g += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1E2937" stroke-width="1"/>';
    g += '<text x="' + (W - mR + 9) + '" y="' + (y(v) + 4) + '" fill="#6B7C8F" font-size="12" font-weight="700">' + v + "</text>";
  }
  [1, 10, 20, 30, 40, n].filter((v, i, a) => v <= n && v >= 1 && a.indexOf(v) === i).forEach(t =>
    g += '<text x="' + x(t) + '" y="' + (H - 9) + '" fill="#6B7C8F" font-size="12" text-anchor="middle">' + t + "</text>");
  g += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + (H - mB) + '" y2="' + (H - mB) + '" stroke="#2B3948"/>';
  ORDER.slice().sort((a, b) => cum[a][n] - cum[b][n]).forEach(p => {
    const d = cum[p].map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    g += '<path d="' + d + '" fill="none" stroke="' + PC(p) + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  const lab = ORDER.map(p => ({ p, v: cum[p][n], y: y(cum[p][n]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 18) lab[i].y = lab[i - 1].y + 18;
  lab.forEach(o => {
    g += '<circle cx="' + x(n) + '" cy="' + y(o.v) + '" r="3.4" fill="' + PC(o.p) + '"/>';
    g += '<text x="' + (mL - 10) + '" y="' + (o.y + 4) + '" fill="' + PC(o.p) + '" font-size="13" font-weight="800" text-anchor="end">' + esc(P[o.p]) + " " + o.v + "</text>";
  });
  g += '<line class="cross" x1="0" x2="0" y1="' + mT + '" y2="' + (H - mB) + '" stroke="#6B7C8F" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  svg.innerHTML = g;
  card.appendChild(svg);
  const cross = svg.querySelector(".cross");
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    let i = Math.max(0, Math.min(n, Math.round(((W - mR - px) / (W - mL - mR)) * n)));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", "1");
    showTip('<div class="th">' + (i === 0 ? "לפני טורניר 1" : "אחרי טורניר " + done[i - 1].num) + "</div>" +
      ORDER.map(p => ({ p, v: cum[p][i] })).sort((a, b) => b.v - a.v)
        .map(o => '<div class="tr"><span>' + plate(o.p) + "</span><b>" + o.v + "</b></div>").join(""), ev.clientX, r.top + 10);
  });

let curPlayer = null;
function viewPlayers(root) {
  if (CARRY) { root.innerHTML = ""; root.appendChild(carryNotice()); withAgg(CARRY.agg, squadPage, root); return; }

function carryNotice() {
  const n = el("div", "notice warn");
  n.innerHTML = "<b>" + esc(seasonById(SCOPE).name) + " טרם התחילה</b> " +
    "הקלפים מציגים בינתיים את נתוני " + esc(CARRY.name) +

function squadPage(root) {

function futCard(p) {
  const s = S[p], t = TIER[s.tier];
  const lastClub = (() => { for (let i = TSS.length - 1; i >= 0; i--) { const x = TSS[i]; if (x.done && x.teamOf[p] != null) return CLUBS[x.teamOf[p]]; } return "—"; })();
  const face = photoOf(p);
  const c = el("div", "fcard");
  c.setAttribute("role", "button");
  c.tabIndex = 0;
  c.setAttribute("aria-pressed", String(p === curPlayer));
  c.style.cssText = "--t1:" + t.t1 + ";--t2:" + t.t2 + ";--tink:" + t.ink + ";--c:" + clubCol(lastClub);
  /* redraw in place (no jump to the top) and glide down to the profile of
     the card that was tapped */
  const pick = () => {
    curPlayer = p;
    const root = document.getElementById("v-players");
    viewPlayers(root);
    const pf = document.getElementById("playerProfile");
    if (!pf) return;
    /* land just below whatever is pinned at the top (the bar, and the tabs row
       when this screen has one) */
    const pinned = ["header.appbar", "#subtabs"].map(q => document.querySelector(q))
      .filter(e => e && getComputedStyle(e).position === "sticky")
      .reduce((m, e) => Math.max(m, e.getBoundingClientRect().bottom), 0);
    const y = pf.getBoundingClientRect().top + scrollY - pinned - 8;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => scrollTo({ top: Math.max(0, y), behavior: still ? "auto" : "smooth" }), 0);
  };
  c.onclick = pick;
  c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };

  const inner = el("div", "inner");

  const pic = el("div", "pic");
  if (face) {
    const f = el("span", "face");
    f.style.backgroundImage = "url(" + face + ")";
    pic.appendChild(f);
  } else {
    pic.appendChild(el("span", "ghost", esc(P[p].slice(0, 1))));
  }
  pic.appendChild(formPips(p));
  inner.appendChild(pic);

  const body = el("div", "body");
  const top = el("div", "top");
  const ovr = el("button", "ovr", "<b>" + s.ovr + "</b><span>" + esc(s.role) + "</span>");
  ovr.onclick = e => pinTip(
    '<div class="th">דירוג ' + s.ovr + " · " + esc(P[p]) + "</div>" + OVR_WHY +
    '<div class="hint">' + esc(s.role) + " — " + (s.role === "התקפה"
      ? "כובש יותר משהוא סופג." : "סופג יותר משהוא כובש.") + "</div>", e);
  top.appendChild(ovr);
  top.insertAdjacentHTML("beforeend",
    '<div class="badge"><i class="shield"></i><span class="cname">' + esc(lastClub) + "</span></div>");
  body.appendChild(top);
  body.appendChild(el("div", "pname", esc(P[p])));

  const grid = el("div", "grid6");
  CARD_STATS.forEach(st => {
    const cell = el("button", "s6", "<span>" + esc(st.label) + "</span><b>" + st.val(s) + "</b>");
    cell.onclick = e => pinTip('<div class="th">' + esc(st.label) + " · " + esc(P[p]) + "</div>" +
      esc(st.why) + '<div class="hint">הערך שלו: ' + st.val(s) + "</div>", e);
    grid.appendChild(cell);
  });
  body.appendChild(grid);

  inner.appendChild(body);
  c.appendChild(inner);
  return c;
}

/* Full names, not abbreviations — and each one explains itself when tapped. */
const CARD_STATS = [

  { label: "נקודות למשחק", val: s => f2(s.ppg),
    why: "ממוצע הנקודות שאסף במשחק ליגה בודד: ניצחון 3, תיקו 1, הפסד 0." },
  { label: "מקום ממוצע", val: s => f1(s.avgPlace),
    why: "ממוצע המקום שבו סיים את טבלת הטורניר, על פני כל הופעותיו. נמוך יותר — טוב יותר." },
  { label: "שערים למשחק", val: s => f2(s.gf / Math.max(1, s.g)),

  { label: "ספיגות למשחק", val: s => f2(s.ga / Math.max(1, s.g)),

];
const OVR_WHY = "הדירוג הכולל. נבנה מארבעה מדדי קריירה, שכל אחד מהם מנורמל בין ששת השחקנים " +
  "ואז משוקלל: נקודות למשחק 34%, אחוז אליפויות 30%, הפרש שערים למשחק 20% ואחוז עלייה לגמר 16%. " +
  "התוצאה נפרסת על סולם 62 עד 93.";

/* the last eight tournaments this player took part in, newest on the left */
function formPips(p) {
  const wrap = el("span", "form");

      '<div class="tr"><span>מאזן</span><b>' + l.w + " נצחונות, " + l.dr + " תיקו, " + l.l + " הפסדים</b></div>" +

      "המספר הוא המקום שבו סיים, ומסגרת זהב מסמנת אליפות.</div>", e);
    wrap.appendChild(b);

}

/* Points per match over a rolling window, so form reads rather than the
   career average that barely moves after fifty tournaments. */
function formChart(p) {
  const log = LOG[p];
  const WIN = 20;
  if (log.length < WIN + 4) return null;
  const W = 980, H = 220, mT = 16, mB = 30, mL = 54, mR = 46;
  const pts = [];
  let run = 0;
  for (let i = 0; i < log.length; i++) {
    run += log[i].pts;
    if (i >= WIN) run -= log[i - WIN].pts;
    if (i >= WIN - 1) pts.push({ i, v: run / WIN, e: log[i] });
  }
  const all = LOG.reduce((a, l) => a + l.reduce((x, e) => x + e.pts, 0), 0) /
              Math.max(1, LOG.reduce((a, l) => a + l.length, 0));
  const lo = Math.min(all, ...pts.map(o => o.v)) - 0.12;
  const hi = Math.max(all, ...pts.map(o => o.v)) + 0.12;
  const n = pts.length;
  const x = j => W - mR - (j / Math.max(1, n - 1)) * (W - mL - mR);
  const y = v => H - mB - ((v - lo) / (hi - lo || 1)) * (H - mT - mB);

  const card = el("div", "chart-card");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "כושר של " + P[p] + " לאורך הקריירה");
  let g = "";
  for (let v = Math.ceil(lo * 4) / 4; v <= hi; v += 0.25) {
    g += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + y(v) + '" y2="' + y(v) +
         '" stroke="#1E2937" stroke-width="1"/>' +
         '<text x="' + (W - mR + 9) + '" y="' + (y(v) + 4) + '" fill="#6B7C8F" font-size="12" font-weight="700">' +
         f2(v) + "</text>";
  }
  g += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + y(all) + '" y2="' + y(all) +
       '" stroke="#6B7C8F" stroke-width="1.4" stroke-dasharray="6 4"/>' +
       '<text x="' + (mL - 8) + '" y="' + (y(all) + 4) + '" fill="#6B7C8F" font-size="12" ' +
       'font-weight="700" text-anchor="end">ממוצע הליגה</text>';
  const d = pts.map((o, j) => (j ? "L" : "M") + x(j).toFixed(1) + " " + y(o.v).toFixed(1)).join(" ");
  g += '<path d="' + d + '" fill="none" stroke="' + PC(p) + '" stroke-width="2.6" ' +
       'stroke-linejoin="round" stroke-linecap="round"/>';
  g += '<circle cx="' + x(n - 1) + '" cy="' + y(pts[n - 1].v) + '" r="4" fill="' + PC(p) + '"/>';
  [0, Math.floor(n / 3), Math.floor(2 * n / 3), n - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(j =>
    g += '<text x="' + x(j) + '" y="' + (H - 9) + '" fill="#6B7C8F" font-size="12" text-anchor="middle">' +
         pts[j].e.num + "</text>");
  g += '<line class="cross" x1="0" x2="0" y1="' + mT + '" y2="' + (H - mB) +
       '" stroke="#6B7C8F" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  svg.innerHTML = g;
  card.appendChild(svg);
  const cross = svg.querySelector(".cross");
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    const j = Math.max(0, Math.min(n - 1, Math.round(((W - mR - px) / (W - mL - mR)) * (n - 1))));
    cross.setAttribute("x1", x(j)); cross.setAttribute("x2", x(j)); cross.setAttribute("opacity", "1");
    showTip('<div class="th">טורניר ' + pts[j].e.num + " · משחק " + (pts[j].e.mi + 1) + "</div>" +
      '<div class="tr"><span>ב־20 המשחקים האחרונים</span><b>' + f2(pts[j].v) + " נק׳ למשחק</b></div>" +
      '<div class="tr"><span>ממוצע הליגה</span><b>' + f2(all) + "</b></div>",
      ev.clientX, r.top + 10);
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("opacity", "0"); hideTip(); });
  card.appendChild(el("div", "legend",
    '<span class="li mut">כל נקודה על הקו היא ממוצע הנקודות ב־20 המשחקים שקדמו לה. ' +
    'מימין לשמאל: מהטורניר הראשון ועד האחרון.</span>'));
  return card;
}

/* Hebrew does not take a bare numeral for one. */
function runWord(kind, n) {
  if (!n) return "";
  if (kind === "w") return n === 1 ? "ניצחון אחד" : n + " נצחונות";
  if (kind === "l") return n === 1 ? "הפסד אחד" : n + " הפסדים";
  return n === 1 ? "משחק אחד ללא הפסד" : n + " משחקים ללא הפסד";
}
/* A run that began and ended inside one tournament is one tournament. */
function runSpan(r, short) {
  if (!r.span) return "";
  const a = r.span.from.num, b = r.span.to.num;
  const lbl = short ? "ט׳ " : "טורניר ";
  return a === b ? lbl + a : (short ? "ט׳ " : "טורנירים ") + a + "–" + b;
}

function splitCard(ttl, l) {
  const w = l.filter(e => e.res === "w").length, d = l.filter(e => e.res === "d").length;
  const ppg = l.length ? l.reduce((a, e) => a + e.pts, 0) / l.length : 0;
  return el("div", "rec",
    '<div class="lbl">' + ttl + '</div><div class="v">' + f2(ppg) + "</div>" +
    '<div class="d mut">' + l.length + " משחקים · <span class=\"ltr\">" +
    w + "-" + d + "-" + (l.length - w - d) + "</span></div>");
}

function profile(p) {
  const s = S[p];
  const box = el("div", "view");

  const head = el("div", "prof-head");
  head.innerHTML = '<div><div class="prof-name" style="--c:' + PC(p) + '"><i></i>' + esc(P[p]) + "</div>" +
    '<div class="lbl" style="margin-top:4px">מקום ' + (ORDER.indexOf(p) + 1) + " בטבלה ההיסטורית · " + s.app + " הופעות</div></div>";
  const k = el("div", "kpis");
  [["אליפויות", s.titles], ["גמרים", s.finals], ["מקום ממוצע", f1(s.avgPlace)], ["נק׳/משחק", f2(s.ppg)],
   ["אחוז נצחון", Math.round(100 * s.w / Math.max(1, s.g)) + "%"], ["דירוג קלף", s.ovr]
  ].forEach(([a, v]) => k.appendChild(el("div", "kpi", '<div class="lbl">' + a + '</div><div class="v">' + v + "</div>")));
  head.appendChild(k);
  const wr = el("button", "btn sm wr-open", "✨ ה־Wrapped של " + (SCOPE === "all" ? "כל העונות" : esc(seasonById(SCOPE).name)));
  wr.onclick = () => openWrapped(p);
  head.appendChild(wr);
  box.appendChild(head);
  box.appendChild(trophyCabinet(p));
  box.appendChild(achievementsBlock(p));

  const strip = el("section", "block");
  strip.innerHTML = '<div class="bhead"><h2>טורניר אחר טורניר</h2><span class="note">הצבע הוא המקום בטבלה, מסגרת זהב מסמנת אליפות, משבצת דהויה היא טורניר שהוחמץ.</span></div>';
  const sc = el("div", "chart-card");
  const row = el("div", "hstrip");
  TSS.filter(t => t.done).forEach(t => {
    const line = perT[p][t.i];
    const c = el("div", "cell" + (line ? (line.champ ? " win" : "") : " miss"));
    if (line) {
      c.style.cssText = "background:var(--o" + line.place + ");color:var(--o" + line.place + "t);cursor:pointer";
      c.textContent = line.place;
      c.addEventListener("pointerenter", e => showTip('<div class="th">טורניר ' + t.num + (line.champ ? " · אלוף" : "") + "</div>" +
        '<div class="tr"><span>מקום</span><b>' + line.place + " מתוך " + line.size + "</b></div>" +
        '<div class="tr"><span>קבוצה</span><b>' + esc(CLUBS[line.club]) + "</b></div>" +
        '<div class="tr"><span>נקודות</span><b>' + line.pts + "</b></div>" +
        '<div class="tr"><span>שערים</span><b>' + scoreTxt(line.gf, line.ga) + "</b></div>", e.clientX, e.clientY));
      c.addEventListener("click", () => { curT = t.i; go("tournaments"); });
    } else {
      c.textContent = "–";
      c.addEventListener("pointerenter", e => showTip("טורניר " + t.num + " · לא השתתף", e.clientX, e.clientY));
    }
    c.addEventListener("pointerleave", hideTip);
    row.appendChild(c);
  });
  sc.appendChild(row);
  sc.appendChild(el("div", "legend",
    [1,2,3,4,5,6].map(j => '<span class="li"><i class="dot" style="background:var(--o' + j + ')"></i>' + j + "</span>").join("") +
    '<span class="li"><i class="dot" style="background:transparent;box-shadow:0 0 0 2px var(--gold)"></i>אליפות</span>' +
    '<span class="li mut">מימין לשמאל: טורניר 1 ואילך</span>'));
  strip.appendChild(sc);
  box.appendChild(strip);

  const fc = formChart(p);
  if (fc) {
    const fb = el("section", "block");
    fb.innerHTML = '<div class="bhead"><h2>עקומת כושר</h2><span class="note">' +
      'נקודות למשחק בחלון נע של 20 משחקים, מול הממוצע של כל השחקנים יחד.</span></div>';
    fb.appendChild(fc);
    box.appendChild(fb);
  }

  /* home and away, runs, and the bottom of the table */
  const log = LOG[p] || [];
  if (log.length) {
    const sb = el("section", "block");
    sb.innerHTML = '<div class="bhead"><h2>בית, חוץ ורצפים</h2><span class="note">' +
      'בכל משחק צמד אחד מארח: הוא משחק עם הקבוצה של אחד משני שחקניו, והצמד השני הוא האורח.</span></div>';
    const g = el("div", "recs");
    g.appendChild(splitCard("בבית", log.filter(e => e.home)));
    g.appendChild(splitCard("בחוץ", log.filter(e => !e.home)));
    const rw = longestRun(log, isW), ru = longestRun(log, isNL), rl = longestRun(log, isL);
    const span = r => runSpan(r, false);
    g.appendChild(el("div", "rec", '<div class="lbl">רצף נצחונות</div><div class="v">' + rw.n +
      '</div><div class="d mut">' + span(rw) + "</div>"));
    g.appendChild(el("div", "rec", '<div class="lbl">רצף ללא הפסד</div><div class="v">' + ru.n +
      '</div><div class="d mut">' + span(ru) + "</div>"));
    g.appendChild(el("div", "rec", '<div class="lbl">רצף הפסדים</div><div class="v">' + rl.n +
      '</div><div class="d mut">' + span(rl) + "</div>"));
    const cw = currentRun(log, isW), cu = currentRun(log, isNL), cl2 = currentRun(log, isL);
    g.appendChild(el("div", "rec", '<div class="lbl">הרצף עכשיו</div><div class="v">' +
      (cw ? runWord("w", cw) : cl2 ? runWord("l", cl2) : cu ? runWord("u", cu) : "—") +
      '</div><div class="d mut">מאז המשחק האחרון שקטע אותו</div>'));
    g.appendChild(el("div", "rec", '<div class="lbl">סיים אחרון</div><div class="v">' + s.last +
      '</div><div class="d mut">מתוך ' + s.app + " טורנירים</div>"));
    sb.appendChild(g);
    box.appendChild(sb);
  }

  /* the partners he is worth most and least beside */
  const myChem = Object.keys(CHEM).map(k => CHEM[k]).filter(c => (c.a === p || c.b === p) && c.g)
    .sort((x, y) => y.d - x.d);
  if (myChem.length) {
    const cb = el("section", "block");
    cb.innerHTML = '<div class="bhead"><h2>עם מי הוא עובד הכי טוב</h2><span class="note">' +
      'ההפרש בין הנקודות למשחק של הצמד לבין מה ששני השחקנים מביאים כשהם לא יחד. ★ מעבר לרעש.</span></div>';
    const g = el("div", "recs");
    const card = (ttl, c) => {
      const o = c.a === p ? c.b : c.a;
      return el("div", "rec",
        '<div class="lbl">' + ttl + '</div>' +
        '<div class="d" style="font-size:15px">' + plate(o, "lg") + "</div>" +
        '<div class="v ' + (c.d >= 0 ? "pos" : "neg") + '">' + sgnF2(c.d) + (c.solid ? " ★" : "") + "</div>" +
        '<div class="d mut">' + f2(c.act) + " יחד מול " + f2(c.exp) + " לחוד · " + c.g + " משחקים</div>");
    };
    g.appendChild(card("השותף הכי מוצלח", myChem[0]));
    g.appendChild(card("השותף הכי פחות מוצלח", myChem[myChem.length - 1]));
    cb.appendChild(g);
    box.appendChild(cb);
  }

  const cols = el("div", "cols2");
  const pa = el("section", "block");
  pa.innerHTML = '<div class="bhead"><h2>שותפים</h2><span class="note">כשהם באותה קבוצה</span></div>';
  makeTable(pa, [
    { label: "שותף", key: "n", val: r => P[r.o], render: r => plate(r.o) },
    { label: "משחקים", key: "g", val: r => r.r.g },
    { label: "נצ׳", key: "w", val: r => r.r.w },
    { label: "תיקו", key: "d", val: r => r.r.dr },
    { label: "הפ׳", key: "l", val: r => r.r.l },
    { label: "נק׳/משחק", key: "ppg", val: r => r.r.ppg, cls: () => "strong", render: r => f2(r.r.ppg) },
    { label: "כימיה", key: "ch", val: r => (CHEM[pairKey(r.r.a, r.r.b)] || { d: 0 }).d,
      cls: r => ((CHEM[pairKey(r.r.a, r.r.b)] || { d: 0 }).d >= 0 ? "pos" : "neg"),
      render: r => { const c = CHEM[pairKey(r.r.a, r.r.b)]; return c ? sgnF2(c.d) + (c.solid ? " ★" : "") : "—"; } },
    { label: "אליפויות", key: "t", val: r => r.r.titles, render: r => r.r.titles ? '<span class="g">' + r.r.titles + "</span>" : '<span class="mut">0</span>' }
  ], Object.values(PAIR).filter(x => x.a === p || x.b === p).map(x => ({ o: x.a === p ? x.b : x.a, r: x })), { sort: "ppg" });
  cols.appendChild(pa);

  const ri = el("section", "block");
  ri.innerHTML = '<div class="bhead"><h2>יריבים</h2><span class="note">כשהם בצדדים מנוגדים</span></div>';
  makeTable(ri, [
    { label: "יריב", key: "n", val: r => P[r.o], render: r => plate(r.o) },
    { label: "משחקים", key: "g", val: r => r.r.g },
    { label: "נצ׳", key: "w", val: r => r.r.w },
    { label: "תיקו", key: "d", val: r => r.r.dr },
    { label: "הפ׳", key: "l", val: r => r.r.l },
    { label: "אחוז נצחון", key: "pc", val: r => r.r.w / r.r.g, cls: () => "strong", render: r => Math.round(100 * r.r.w / r.r.g) + "%" },
    { label: "שערים", key: "gd", val: r => r.r.gf - r.r.ga, cls: r => (r.r.gf - r.r.ga) > 0 ? "pos" : (r.r.gf - r.r.ga) < 0 ? "neg" : "", render: r => scoreTxt(r.r.gf, r.r.ga) }
  ], P.map((_, o) => o).filter(o => o !== p && H2H[p][o].g).map(o => ({ o, r: H2H[p][o] })), { sort: "pc" });
  cols.appendChild(ri);
  box.appendChild(cols);

  const cl = el("section", "block");
  cl.innerHTML = '<div class="bhead"><h2>הקבוצות שהוגרלו לו</h2></div>';
  const byClub = {};
  TSS.filter(t => t.done).forEach(t => {
    const line = perT[p][t.i]; if (!line) return;
    const c = byClub[line.club] || (byClub[line.club] = { c: line.club, n: 0, titles: 0, pts: 0, g: 0, places: 0 });
    c.n++; c.pts += line.pts; c.g += line.g; c.places += line.place; if (line.champ) c.titles++;
  });
  makeTable(cl, [
    { label: "קבוצה", key: "n", val: r => CLUBS[r.c], render: r => clubTag(r.c) },
    { label: "טורנירים", key: "cnt", val: r => r.n },
    { label: "אליפויות", key: "t", val: r => r.titles, render: r => r.titles ? '<span class="g">' + r.titles + "</span>" : '<span class="mut">0</span>' },
    { label: "מקום ממוצע", key: "ap", val: r => r.places / r.n, render: r => f1(r.places / r.n) },
    { label: "נק׳/משחק", key: "ppg", val: r => r.pts / r.g, cls: () => "strong", render: r => f2(r.pts / r.g) }
  ], Object.values(byClub), { sort: "cnt" });
  box.appendChild(cl);
  return box;
}
