.wr-s{font-size:17px; color:rgba(255,255,255,.85); max-width:300px; line-height:1.5}
.wr-pill{margin-top:8px; background:rgba(255,255,255,.14); padding:8px 16px; border-radius:999px; font-weight:800}
.wr-face{width:110px; height:110px; border-radius:50%; border:4px solid var(--c); overflow:hidden; margin-bottom:8px; box-shadow:0 0 40px rgba(255,255,255,.2)}
.wr-face .pface{width:100%; height:100%}
.final-share{display:block; margin:14px auto 0; padding:12px 22px; font-size:15px}
/* ---------- the ניחושים tab ---------- */
.predpanel{display:flex; flex-direction:column; gap:4px}
.pn-match{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; background:#1B2129; border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:13px}
.pn-k{font-weight:800; color:#9DB7E0}
.pn-body{display:flex; flex-direction:column; gap:12px}
.pn-row{display:grid; grid-template-columns:1fr auto; grid-template-areas:"where pts" "pairs pts" "guess pts"; gap:2px 10px; text-align:start;
  width:100%; border:0; background:#1B2129; color:var(--ink); font:inherit; border-radius:12px; padding:10px 12px; margin-top:6px; cursor:pointer}
.pn-row.exact{box-shadow:0 0 0 1px var(--gold) inset} .pn-row.hit{box-shadow:0 0 0 1px #2FB86F inset} .pn-row.miss{opacity:.75}
.pn-where{grid-area:where; font-size:11.5px; color:#9AA4B2} .pn-pairs{grid-area:pairs; font-size:13px; font-weight:700}
.pn-guess{grid-area:guess; font-size:12.5px; color:#C9D1DB} .pn-pts{grid-area:pts; align-self:center; font-weight:800; font-size:15px}
.pn-rules div{font-size:13.5px; line-height:1.8; color:#C9D1DB}

/* ---------- standalone on a phone ---------- */
html{background:var(--pitch)}
body{min-height:100svh;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  padding-inline-start:env(safe-area-inset-left); padding-inline-end:env(safe-area-inset-right);
  overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent}
@media (display-mode:standalone){ body{ user-select:none } input,select,textarea{ user-select:text } }
.updatebar{position:fixed; inset-inline:10px; bottom:10px; z-index:130; max-width:520px;
  margin-inline:auto; display:flex; gap:10px; align-items:center; padding:11px 14px;
  background:#121A10; border:1px solid #3E6B2E; color:#DDF2CF; font-size:13px;
  box-shadow:0 14px 40px rgba(0,0,0,.7)}
</style>

<script id="introjs">
(function () {
  var box = document.getElementById("intro");
  if (!box) return;
  var skip = false;
  try {
    /* not after the "רענן" bar's reload, and not when a test asks */
    if (sessionStorage.getItem("fifa-nointro")) { sessionStorage.removeItem("fifa-nointro"); skip = true; }
  } catch (e) {}
  if (/[?&]nointro\b/.test(location.search)) skip = true;
  if (skip) { box.remove(); return; }

  var gone = false;
  function end() {
    if (gone) return; gone = true;
    box.classList.add("i-out");
    setTimeout(function () { box.remove(); }, 380);
    try { if (ctx) setTimeout(function () { ctx.close(); }, 1500); } catch (e) {}
  }
  box.addEventListener("pointerdown", end);
  setTimeout(end, 4100);

  /* ---- the sound, made on the spot (no files): a kick, the crowd, the whistle.
     An installed app may play sound at launch; a plain browser tab may not,
     and then the intro simply runs silent. */
  var ctx = null;
  try {
    if (localStorage.getItem("fifa-sound") === "0") return;   // sounds switched off
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    var play = function () {
      if (gone || ctx.state !== "running") return;
      var t0 = ctx.currentTime, out = ctx.createGain();
      out.gain.value = 0.9; out.connect(ctx.destination);
      var noise = function (sec) {
        var n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
        for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        var s = ctx.createBufferSource(); s.buffer = b; return s;
      };
      /* the kick at 0.85 s: a falling thump and a leather slap */
      var kt = t0 + 0.85;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(160, kt); o.frequency.exponentialRampToValueAtTime(45, kt + 0.16);
      g.gain.setValueAtTime(0.0001, kt); g.gain.exponentialRampToValueAtTime(0.9, kt + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, kt + 0.22);
      o.connect(g); g.connect(out); o.start(kt); o.stop(kt + 0.25);
      var slap = noise(0.06), sf = ctx.createBiquadFilter(), sg = ctx.createGain();
      sf.type = "bandpass"; sf.frequency.value = 1800; sf.Q.value = 0.8;
      sg.gain.setValueAtTime(0.5, kt); sg.gain.exponentialRampToValueAtTime(0.0001, kt + 0.05);
      slap.connect(sf); sf.connect(sg); sg.connect(out); slap.start(kt);
      /* the crowd: filtered noise that swells after the strike, with a slow sway */
      var crowd = noise(3.9), cf = ctx.createBiquadFilter(), cl = ctx.createBiquadFilter(), cg = ctx.createGain();
      cf.type = "bandpass"; cf.frequency.value = 700; cf.Q.value = 0.6;
      cl.type = "lowpass"; cl.frequency.value = 2400;
      cg.gain.setValueAtTime(0.0001, t0 + 0.2);
      cg.gain.exponentialRampToValueAtTime(0.06, kt);
      cg.gain.exponentialRampToValueAtTime(0.42, kt + 0.45);
      cg.gain.setValueAtTime(0.42, t0 + 2.2);
      cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.05);
      var sway = ctx.createOscillator(), sw = ctx.createGain();
      sway.frequency.value = 3.2; sw.gain.value = 0.07; sway.connect(sw); sw.connect(cg.gain);
      crowd.connect(cf); cf.connect(cl); cl.connect(cg); cg.connect(out);
      crowd.start(t0 + 0.2); sway.start(t0 + 0.2); sway.stop(t0 + 4.1);
      /* the referee's whistle as the name lands: two close tones and the pea's trill */
      var wt = t0 + 1.2, wg = ctx.createGain();
      wg.gain.setValueAtTime(0.0001, wt); wg.gain.exponentialRampToValueAtTime(0.13, wt + 0.03);
      wg.gain.setValueAtTime(0.13, wt + 0.42); wg.gain.exponentialRampToValueAtTime(0.0001, wt + 0.55);
      wg.connect(out);
      var trill = ctx.createOscillator(), tg = ctx.createGain();
      trill.frequency.value = 34; tg.gain.value = 90; trill.connect(tg);
      [2850, 3120].forEach(function (f) {
        var w = ctx.createOscillator(); w.type = "sine"; w.frequency.value = f;
        tg.connect(w.frequency); w.connect(wg); w.start(wt); w.stop(wt + 0.58);
      });
      trill.start(wt); trill.stop(wt + 0.58);
    };
    if (ctx.state === "running") play();
    else if (ctx.resume) ctx.resume().then(play, function () {});
  } catch (e) {}
})();
</script>

<script>
"use strict";
/* ==========================================================================
   Data model
   --------------------------------------------------------------------------
   History (51 tournaments) ships with the page. New tournaments live in the
   artifact's shared store, and everything on every screen is recomputed from
   the merged set of raw match results.
   ========================================================================== */
const SEED = JSON.parse(document.getElementById("seed").textContent);
const PHOTOS = JSON.parse(document.getElementById("faces").textContent);
/* photo id -> player index. Seeded with the pairing the user gave for the six
   uploaded files; the store overrides it once anyone changes a face. */
const PHOTOMAP_DEFAULT = { "1": 1, "2": 0, "3": 4, "4": 2, "5": 3, "6": 5 };
let PHOTOMAP = Object.assign({}, PHOTOMAP_DEFAULT);
const photoOf = p => { const k = Object.keys(PHOTOMAP).find(k2 => PHOTOMAP[k2] === p); return k ? PHOTOS[k] : null; };
const P = SEED.P, TPL = SEED.TPL, POOL0 = SEED.POOL, YEARS = SEED.Y;
const NP = P.length;
const HIST_COUNT = SEED.T.length;
let CLUBS = SEED.C.slice();
const PC = i => "var(--p" + i + ")";

const CLUBCOL = {
  "באיירן":"#DC052D", "ברצלונה":"#A50044", "פסז":"#1D4E96", "ליברפול":"#C8102E",
  "ריאל":"#E8CE6A", "סיטי":"#6CABDD", "ארסנל":"#EF0107", "אתלטיקו":"#CB3524",
  "צרפת":"#3D6BB5", "פורטוגל":"#0B8A4A", "ברזיל":"#E5CE00", "אנגליה":"#E0424F",
  "ספרד":"#D4232F", "ארגנטינה":"#7EBBE8", "גרמניה":"#9AA3AC"
};
/* a stable fallback hue for a club the user adds later */
function clubCol(name) {
  if (CLUBCOL[name]) return CLUBCOL[name];
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return "hsl(" + h + " 52% 58%)";
}
function clubIdx(name) {
  name = (name || "").trim();
  let i = CLUBS.indexOf(name);
  if (i < 0) { CLUBS.push(name); i = CLUBS.length - 1; }
  return i;
}

/* ---------- helpers ---------- */
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f2 = n => (Math.round(n * 100) / 100).toFixed(2);
const nf = n => n.toLocaleString("he-IL");
const sgnTxt = n => (n > 0 ? "+" : "") + n;
const sgn = n => '<span class="ltr">' + sgnTxt(n) + "</span>";
const sgn1 = v => '<span class="ltr">' + (v > 0 ? "+" : "") + f1(v) + "</span>";
const sgnF2 = v => '<span class="ltr">' + (v > 0 ? "+" : "") + f2(v) + "</span>";
const scoreTxt = (a, b) => '<span class="ltr">' + a + ":" + b + "</span>";
const plate = (i, cls) => '<span class="plate ' + (cls || "") + '" style="--c:' + PC(i) + '"><i class="dot"></i>' + esc(P[i]) + "</span>";
const plateFace = (i, cls) => '<span class="plate ' + (cls || "") + '" style="--c:' + PC(i) + '">' +
  (photoOf(i) ? '<i class="pface pf' + i + '"></i>' : '<i class="dot"></i>') + esc(P[i]) + "</span>";
function installFaceStyles() {
  let st = document.getElementById("faceCss");
  if (!st) { st = el("style"); st.id = "faceCss"; document.head.appendChild(st); }
  st.textContent = P.map((_, i) => {
    const f = photoOf(i);
    return f ? ".pf" + i + "{background-image:url(" + f + ")}" : "";
  }).filter(Boolean).join("\n");
}
const clubTag = ci => { const n = CLUBS[ci] || "—"; return '<span class="club" style="--c:' + clubCol(n) + '"><i class="cdot"></i>' + esc(n) + "</span>"; };
function textInput(value, ph) {
  const i = el("input");
  i.type = "text";
  i.autocomplete = "off";
  i.spellcheck = false;
  i.setAttribute("autocorrect", "off");
  i.setAttribute("autocapitalize", "off");
  i.setAttribute("data-1p-ignore", "true");
  i.setAttribute("data-lpignore", "true");
  if (value != null) i.value = value;
  if (ph) i.placeholder = ph;
  return i;
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- the live set of tournaments ---------- */
let LIVE = {};            // id -> tournament record kept in the store
let CLUB_POOL = POOL0.slice();
let TS = [];              // every tournament, all seasons, chronological
let TSS = [];             // the ones in the season now on screen
let SEASONS = [{ id: 0, name: "עונה 1" }];
let SCOPE = 0;            // season id, or "all"
let CARRY = null;         // last season's aggregate, shown while a new season is empty
let S, PAIR, H2H, TEAM, perT, ORDER, MAXAPP, totGoals, totMatches, drawnMatches, LAST;
let DUEL, LOG, CHEM;      // pair-vs-pair, the per-player match log, chemistry
const seasonById = id => SEASONS.find(s => s.id === id) || SEASONS[0];
const latestSeason = () => SEASONS.reduce((a, b) => (b.id > a.id ? b : a), SEASONS[0]).id;
const activeSeason = () => (SCOPE === "all" ? latestSeason() : SCOPE);
const uid = (season, num) => (season === 0 ? num : season * 1000 + num);
function nextNum(season) {
  const ns = TS.filter(t => t.season === season).map(t => t.num);
  return ns.length ? Math.max.apply(null, ns) + 1 : 1;
}

function decorate(t) {
  t.teamOf = {}; t.d.forEach(([p, c]) => { t.teamOf[p] = c; });
  t.players = t.d.map(x => x[0]);
  t.size = t.players.length;
  /* standings are always derived from the results, never stored */
  const acc = {}; t.players.forEach(p => { acc[p] = { p, g:0, w:0, dr:0, l:0, pts:0, gf:0, ga:0 }; });
  t.m.forEach(m => {
    const [h1, h2, ht, a1, a2, at, hg, ag] = m;
    if (hg == null || ag == null) return;
    const dw = hg === ag, hp = dw ? 1 : hg > ag ? 3 : 0, ap = dw ? 1 : ag > hg ? 3 : 0;
    [[[h1,h2], hg, ag, hp], [[a1,a2], ag, hg, ap]].forEach(([duo, gf, ga, pts]) => {
      duo.forEach(p => { const a = acc[p]; a.g++; a.pts += pts; a.gf += gf; a.ga += ga;
        if (dw) a.dr++; else if (gf > ga) a.w++; else a.l++; });
    });
  });
  t.acc = acc;
  if (t.t && t.t.length === t.size) {
    t.table = t.t.slice();                        // recorded order keeps the original tie-breaks
  } else {
    t.table = t.players.slice().sort((a, b) =>
      acc[b].pts - acc[a].pts || (acc[b].gf - acc[b].ga) - (acc[a].gf - acc[a].ga) || acc[b].gf - acc[a].gf);
  }
  t.place = {}; t.table.forEach((p, i) => { t.place[p] = i + 1; });
  t.legs = finalLegs(t);
  applyFinal(t);
  t.done = t.m.length > 0 && t.m.every(m => m[6] != null && m[7] != null) && t.c && t.c.length === 2;
  t.top2 = t.c && t.c.length === 2 &&
    ((t.c[0] === t.table[0] && t.c[1] === t.table[1]) || (t.c[0] === t.table[1] && t.c[1] === t.table[0]));
  return t;
}

function aggregate(list) {
  const S = Array.from({ length: NP }, () => ({ app:0, g:0, w:0, dr:0, l:0, pts:0, gf:0, ga:0, titles:0, finals:0, last:0, places:[0,0,0,0,0,0] }));
  const PAIR = {};
  /* every match a player played, in order — the raw material for streaks,
     form, the home-and-away split and the chemistry baseline */
  const LOG = Array.from({ length: NP }, () => []);
  const DUEL = {};          // pair against pair
  const H2H = Array.from({ length: NP }, () => Array.from({ length: NP }, () => ({ g:0, w:0, dr:0, l:0, gf:0, ga:0 })));
  const TEAM = CLUBS.map(() => ({ drawn:0, titles:0, finals:0, g:0, w:0, dr:0, l:0, gf:0, ga:0 }));
  const perT = Array.from({ length: NP }, () => ({}));
  let goals = 0, matches = 0, draws = 0;
  const pairRec = (a, b) => {
    const k = Math.min(a, b) + "-" + Math.max(a, b);
    return PAIR[k] || (PAIR[k] = { a:Math.min(a,b), b:Math.max(a,b), g:0, w:0, dr:0, l:0, gf:0, ga:0, titles:0 });
  };

  list.forEach(t => {
    t.players.forEach(p => { S[p].app++; TEAM[t.teamOf[p]].drawn++; });
    t.table.forEach((p, i) => { if (i < 6) S[p].places[i]++; if (i === t.size - 1) S[p].last++; });
    t.table.slice(0, 4).forEach(p => { S[p].finals++; TEAM[t.teamOf[p]].finals++; });
    t.c.forEach(p => { S[p].titles++; TEAM[t.teamOf[p]].titles++; });
    pairRec(t.c[0], t.c[1]).titles++;

    t.m.forEach((m, mi) => {
      const [h1, h2, ht, a1, a2, at, hg, ag] = m;
      goals += hg + ag; matches++;
      const dw = hg === ag; if (dw) draws++;
      const hp = dw ? 1 : hg > ag ? 3 : 0, ap = dw ? 1 : ag > hg ? 3 : 0;
      [[[h1,h2], ht, hg, ag, hp, true,  [a1,a2], at],
       [[a1,a2], at, ag, hg, ap, false, [h1,h2], ht]].forEach(([duo, club, gf, ga, pts, home, opp, oclub]) => {
        const won = gf > ga;
        duo.forEach(p => { const s = S[p]; s.g++; s.pts += pts; s.gf += gf; s.ga += ga;
          if (dw) s.dr++; else if (won) s.w++; else s.l++; });
        const pr = pairRec(duo[0], duo[1]);
        pr.g++; pr.gf += gf; pr.ga += ga; if (dw) pr.dr++; else if (won) pr.w++; else pr.l++;
        const T_ = TEAM[club]; T_.g++; T_.gf += gf; T_.ga += ga;
        if (dw) T_.dr++; else if (won) T_.w++; else T_.l++;
        duo.forEach((p, ix) => LOG[p].push({
          ti: t.i, num: t.num, mi, club, oclub, gf, ga, pts, home,
          res: dw ? "d" : won ? "w" : "l", mate: duo[1 - ix], opp: opp.slice()
        }));
      });
      /* the two pairs met: record it from both sides */
      const kh = pairKey(h1, h2), ka = pairKey(a1, a2);
      const dRec = (x, y) => DUEL[x + "|" + y] ||
        (DUEL[x + "|" + y] = { x, y, xa: Math.min(h1, h2), g: 0, w: 0, dr: 0, l: 0, gf: 0, ga: 0 });
      const DA = dRec(kh, ka), DB = dRec(ka, kh);
      DA.g++; DB.g++; DA.gf += hg; DA.ga += ag; DB.gf += ag; DB.ga += hg;
      if (dw) { DA.dr++; DB.dr++; } else if (hg > ag) { DA.w++; DB.l++; } else { DA.l++; DB.w++; }
      [h1, h2].forEach(x => [a1, a2].forEach(y => {
        const A = H2H[x][y], B = H2H[y][x];
        A.g++; B.g++; A.gf += hg; A.ga += ag; B.gf += ag; B.ga += hg;
        if (dw) { A.dr++; B.dr++; } else if (hg > ag) { A.w++; B.l++; } else { A.l++; B.w++; }
      }));
    });
    t.players.forEach(p => {
      perT[p][t.i] = Object.assign({}, t.acc[p], { place: t.place[p], champ: t.c.includes(p), club: t.teamOf[p], size: t.size });
    });
  });

  const MAXAPP = Math.max(1, ...S.map(s => s.app));
  S.forEach((s, i) => {
    s.i = i; s.gd = s.gf - s.ga; s.ppg = s.g ? s.pts / s.g : 0; s.k = s.app ? MAXAPP / s.app : 1;
    s.avgPlace = s.app ? s.places.reduce((a, c, j) => a + c * (j + 1), 0) / s.app : 0;
    s.titleRate = s.app ? s.titles / s.app : 0;
  });
  Object.values(PAIR).forEach(p => { p.pts = p.w * 3 + p.dr; p.ppg = p.g ? p.pts / p.g : 0; p.gd = p.gf - p.ga; });

  /* Chemistry: a pair's points per match against what those same two manage
     when they are NOT together. Excluding their shared matches from each
     player's own rate keeps the comparison from measuring itself. */
  const CHEM = {};
  const apartRate = (p, q) => {
    let g = 0, pts = 0;
    LOG[p].forEach(e => { if (e.mate !== q) { g++; pts += e.pts; } });
    return g ? pts / g : 0;
  };
  Object.keys(PAIR).forEach(k => {
    const pr = PAIR[k];
    const exp = (apartRate(pr.a, pr.b) + apartRate(pr.b, pr.a)) / 2;
    let s2 = 0;
    LOG[pr.a].forEach(e => { if (e.mate === pr.b) s2 += (e.pts - pr.ppg) * (e.pts - pr.ppg); });
    const se = pr.g > 1 ? Math.sqrt(s2 / (pr.g - 1) / pr.g) : 0;
    const d = pr.ppg - exp;
    CHEM[k] = { a: pr.a, b: pr.b, g: pr.g, act: pr.ppg, exp, d, se, solid: se > 0 && Math.abs(d) > 1.5 * se };
  });
  TEAM.forEach((t, i) => { t.name = CLUBS[i]; t.gd = t.gf - t.ga; t.pts = t.w * 3 + t.dr; t.ppg = t.g ? t.pts / t.g : 0; });
  const ORDER = S.map(s => s.i).sort((a, b) => S[b].pts - S[a].pts || S[b].titles - S[a].titles);
  computeOVR(S);
  return { S, PAIR, H2H, TEAM, perT, ORDER, MAXAPP, goals, matches, draws, list, LOG, DUEL, CHEM };
}

function rebuild() {
  const seen = {};
  SEED.T.forEach(t => {
    seen[t.i] = { i: t.i, num: t.i, season: 0, d: t.d.map(x => x.slice()), t: t.t.slice(),
                  m: t.m.map(x => x.slice()), c: t.c.slice(), seed: true };
  });
  Object.values(LIVE).forEach(t => { seen[t.i] = t; });
  TS = Object.values(seen).sort((a, b) => a.i - b.i).map(decorate);
  if (SCOPE !== "all" && !SEASONS.some(s => s.id === SCOPE)) SCOPE = latestSeason();
  TSS = SCOPE === "all" ? TS : TS.filter(t => t.season === SCOPE);

  const A = aggregate(TSS.filter(t => t.done));
  S = A.S; PAIR = A.PAIR; H2H = A.H2H; TEAM = A.TEAM; perT = A.perT; ORDER = A.ORDER; MAXAPP = A.MAXAPP;
  LOG = A.LOG; DUEL = A.DUEL; CHEM = A.CHEM;
  totGoals = A.goals; totMatches = A.matches; drawnMatches = A.draws;
  LAST = A.list[A.list.length - 1] || null;

  /* a season that has not started yet borrows the previous one's cards */
  buildModel();

  CARRY = null;
  if (SCOPE !== "all" && !A.list.length) {
    const earlier = TS.filter(t => t.done && t.season < SCOPE);
    if (earlier.length) {
      const pid = Math.max.apply(null, earlier.map(t => t.season));
      CARRY = { name: seasonById(pid).name, agg: aggregate(earlier.filter(t => t.season === pid)) };
    }
  }
}
const pairKey = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);

/* The two legs of the final, derived from the league table.
   Leg 1: places 3+4 host with the club of place 4, against places 1+2 with the
   club of place 2. Leg 2: places 1+2 host with the club of place 1, against
   places 3+4 with the club of place 3. */
function finalLegs(t) {
  const tb = t.table;
  if (!tb || tb.length < 4) return null;
  const sc = (t.rec && t.rec.final) || [[null, null], [null, null]];
  const g = i => (sc[i] && sc[i].length === 2) ? sc[i] : [null, null];
  return [
    { n: 1, home: [tb[2], tb[3]], hc: t.teamOf[tb[3]], away: [tb[0], tb[1]], ac: t.teamOf[tb[1]], s: g(0) },
    { n: 2, home: [tb[0], tb[1]], hc: t.teamOf[tb[0]], away: [tb[2], tb[3]], ac: t.teamOf[tb[2]], s: g(1) }
  ];
}
/* The winners follow from the aggregate. Level on aggregate, the golden-goal
   pick stored on the record decides. Tournaments with no `final` field at all
   keep whatever champions they were recorded with. */
/* A deep, writable copy. Records hold nothing but numbers, strings and
   arrays, so a JSON round-trip is both sufficient and exact. */
function thaw(o) {
  try { return JSON.parse(JSON.stringify(o)); } catch (e) { return o; }
}
function frozenRec(r) {
  return !!r && (Object.isFrozen(r) ||
    (r.scores && Object.isFrozen(r.scores)) ||
    (r.clubs && Object.isFrozen(r.clubs)) ||
    (r.final && Object.isFrozen(r.final)));
}
/* Every edit writes into t.rec in place. If that record is frozen the write
   throws and the edit is lost, so swap in a writable copy first — and point
   the live object at the same copy, so the two can never drift apart. */
function writable(t) {
  if (!t || !frozenRec(t.rec)) return t;
  const cp = thaw(t.rec);
  t.rec = cp;
  try { if (LIVE[t.i] && LIVE[t.i] !== t) LIVE[t.i].rec = cp; } catch (e) {}
  return t;
}

function applyFinal(t) {
  if (!t.rec || !t.rec.final || !t.legs) return;
  writable(t);
  const L = t.legs;
  if (!L.every(l => l.s[0] != null && l.s[1] != null)) { t.c = []; t.rec.champs = []; return; }
  const top = L[0].s[1] + L[1].s[0], bot = L[0].s[0] + L[1].s[1];
  if (top > bot) t.c = [t.table[0], t.table[1]].slice().sort((a, b) => a - b);
  else if (bot > top) t.c = [t.table[2], t.table[3]].slice().sort((a, b) => a - b);
  else t.c = t.rec.gg ? (t.rec.champs || []).slice().sort((a, b) => a - b) : [];
  t.rec.champs = t.c.slice();
}

const legMatch = L => [L.home[0], L.home[1], L.hc, L.away[0], L.away[1], L.ac, L.s[0], L.s[1]];

/* Aggregate over the two legs. Pair 1-2 is away in leg 1 and home in leg 2. */
function finalOutcome(t) {
  const L = t.legs;
  if (!L) return null;
  const played = L.every(l => l.s[0] != null && l.s[1] != null);
  if (!played) return { L: L, played: false };
  const top = L[0].s[1] + L[1].s[0];
  const bot = L[0].s[0] + L[1].s[1];
  const tb = t.table;
  return { L: L, played: true, top: top, bot: bot,
           winner: top > bot ? [tb[0], tb[1]] : bot > top ? [tb[2], tb[3]] : null };
}

/* render one view against a different season's aggregate */
function withAgg(agg, fn, host) {
  const keep = { S, PAIR, H2H, TEAM, perT, ORDER, MAXAPP, TSS, LOG, DUEL, CHEM };
  S = agg.S; PAIR = agg.PAIR; H2H = agg.H2H; TEAM = agg.TEAM;
  perT = agg.perT; ORDER = agg.ORDER; MAXAPP = agg.MAXAPP; TSS = agg.list;
  LOG = agg.LOG; DUEL = agg.DUEL; CHEM = agg.CHEM;
  try { fn(host); } finally {
    S = keep.S; PAIR = keep.PAIR; H2H = keep.H2H; TEAM = keep.TEAM;
    perT = keep.perT; ORDER = keep.ORDER; MAXAPP = keep.MAXAPP; TSS = keep.TSS;
    LOG = keep.LOG; DUEL = keep.DUEL; CHEM = keep.CHEM;
  }
}

/* ---------- the card rating ----------
   Four career measures, each scaled 0-1 across the six players, then blended
   and mapped onto 62-93 so the cards read like a squad list. Every input is
   shown on the card, so the number can always be traced back. */
/* ---------- achievements ----------
   Unlocked by walking every tournament in order, match by match: streaks,
   clean sheets, big wins, milestones, titles. Each one remembers the
   tournament where it was first earned. Also run by the push server, which
   compares before and after a result to announce new ones. */
const ACH = [

  { id: "tt2", icon: "✌️", name: "פעמיים ברצף", desc: "אלוף בשני טורנירים רצופים" },
  { id: "tt3", icon: "🔱", name: "שלוש ברצף", desc: "אלוף בשלושה טורנירים רצופים" }
];
function achievements() {
  const got = {};
  for (let p = 0; p < NP; p++) got[p] = {};
  const st = {};
  for (let p = 0; p < NP; p++) st[p] = { g: 0, w: 0, u: 0, cs: 0, titles: 0, lastTitle: -9, run: 0 };
  const give = (p, id, t) => { if (!got[p][id]) got[p][id] = { t: t.num, season: t.season }; };
  let doneIdx = 0;
  TS.forEach(t => {
    t.m.forEach(m => {
      if (m[6] == null || m[7] == null) return;
      [[[m[0], m[1]], m[6], m[7]], [[m[3], m[4]], m[7], m[6]]].forEach(([duo, gf, ga]) => duo.forEach(p => {
        const s = st[p]; if (!s) return;
        s.g++;
        if (gf > ga) { s.w++; s.u++; } else if (gf === ga) { s.w = 0; s.u++; } else { s.w = 0; s.u = 0; }
        if (ga === 0) s.cs++;
        if (s.g >= 100) give(p, "g100", t); if (s.g >= 250) give(p, "g250", t); if (s.g >= 500) give(p, "g500", t);
        if (s.w >= 3) give(p, "w3", t); if (s.w >= 5) give(p, "w5", t); if (s.w >= 8) give(p, "w8", t);
        if (s.u >= 10) give(p, "u10", t);
        if (s.cs >= 1) give(p, "cs1", t); if (s.cs >= 25) give(p, "cs25", t);
        if (gf - ga >= 4) give(p, "big4", t); if (gf - ga >= 6) give(p, "big6", t);
        if (gf >= 6) give(p, "gf6", t);
      }));
    });
    if (!t.done) return;
    const idx = doneIdx++;
    if (t.table && t.table.length) give(t.table[0], "top", t);
    t.players.forEach(p => {
      const a = t.acc[p]; if (!a || !a.g) return;
      if (a.l === 0) give(p, "unb", t);
      if (a.w === a.g) give(p, "perf", t);
    });
    const best = Math.max.apply(null, t.players.map(p => t.acc[p].gf));
    const kings = t.players.filter(p => t.acc[p].gf === best);
    if (kings.length === 1) give(kings[0], "gk", t);
    (t.c || []).forEach(p => {
      const s = st[p]; if (!s) return;
      s.titles++;
      s.run = s.lastTitle === idx - 1 ? s.run + 1 : 1;
      s.lastTitle = idx;
      give(p, "t1", t);
      if (s.titles >= 5) give(p, "t5", t); if (s.titles >= 10) give(p, "t10", t);
      if (s.run >= 2) give(p, "tt2", t); if (s.run >= 3) give(p, "tt3", t);
    });
  });
  return got;
}

function computeOVR(S) {
  const ax = [
    { k: "ppg",  w: .34, v: s => s.ppg },
    { k: "ttl",  w: .30, v: s => s.titleRate },
    { k: "fin",  w: .16, v: s => (s.app ? s.finals / s.app : 0) },
    { k: "gd",   w: .20, v: s => (s.g ? (s.gf - s.ga) / s.g : 0) }
  ];
  ax.forEach(a => { a.lo = Math.min(...S.map(a.v)); a.hi = Math.max(...S.map(a.v)); });
  S.forEach(s => {
    let z = 0;
    ax.forEach(a => { z += a.w * (a.hi > a.lo ? (a.v(s) - a.lo) / (a.hi - a.lo) : .5); });
    s.ovr = Math.round(62 + 31 * z);
    s.tier = s.ovr >= 84 ? "gold" : s.ovr >= 74 ? "silver" : "bronze";
    s.role = s.gf / Math.max(1, s.g) >= s.ga / Math.max(1, s.g) ? "התקפה" : "הגנה";
  });
}
const TIER = {
  gold:   { t1:"#B8860B", t2:"#FFE9A3", ink:"#2A2004" },
  silver: { t1:"#6E7A85", t2:"#D6DEE6", ink:"#1B2127" },
  bronze: { t1:"#7A4A22", t2:"#D8A273", ink:"#2A1608" }
};

/* ---------- tooltip ---------- */
const tip = el("div", "tip"); tip.hidden = true; document.body.appendChild(tip);
function showTip(html, x, y) {
  if (tipPinned) return;
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = Math.max(8, Math.min(x - r.width / 2, innerWidth - r.width - 8));
  let top = y - r.height - 14; if (top < 8) top = y + 18;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
/* Anything that goes wrong becomes visible — a silent failure is what made
   the save bug so hard to pin down. */
let lastFatal = "";
function showFatal(msg) {
  msg = String(msg || "").slice(0, 400);
  if (msg === lastFatal) return;
  lastFatal = msg;
  const old = document.getElementById("errBar");
  if (old) old.remove();
  const bar = el("div", "errbar");
  bar.id = "errBar";
  bar.innerHTML = "<div><b>משהו נכשל</b><br><code>" + esc(msg) + "</code></div>";
  const cp = el("button", "btn ghost sm", "העתק");
  cp.onclick = () => copyText(msg, cp);
  const x = el("button", "x", "✕");
  x.onclick = () => { bar.remove(); lastFatal = ""; };
  bar.append(cp, x);
  document.body.appendChild(bar);
}
addEventListener("error", e => showFatal((e.message || "error") + "  @" + (e.lineno || "?") + ":" + (e.colno || "?")));
addEventListener("unhandledrejection", e => {
  const r = e.reason;
  showFatal("Promise: " + ((r && (r.message || r.code)) || r));
});
/* run a step and report it by name if it throws, without stopping the rest */
function step(name, fn) {
  try { return fn(); } catch (err) { showFatal(name + " → " + (err && err.message ? err.message : err)); return null; }
}

/* window.confirm is blocked in the artifact frame — it returns false without
   ever showing — so anything irreversible asks here instead. Resolves true
   only on a deliberate click; Escape, the backdrop and Cancel all say no. */
function askConfirm(o) {
  return new Promise(resolve => {
    const back = el("div", "modalback");
    const card = el("div", "modalcard");
    card.innerHTML = "<h3>" + esc(o.title) + "</h3><p>" + esc(o.body) + "</p>" +
      (o.warn ? '<div class="warnstrip">' + esc(o.warn) + "</div>" : "");
    const row = el("div", "modalrow");
    const yes = el("button", "btn ghost sm danger", o.ok || "כן, מחק");
    const no = el("button", "btn sm", o.cancel || "לא, השאר");
    const done = v => {
      document.removeEventListener("keydown", onKey);
      back.remove();
      resolve(v);
    };
    const onKey = e => { if (e.key === "Escape") done(false); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    back.onclick = e => { if (e.target === back) done(false); };
    document.addEventListener("keydown", onKey);
    row.append(yes, no);
    card.appendChild(row);
    back.appendChild(card);
    document.body.appendChild(back);
    no.focus();                       // the safe option is the one under the finger
  });
}

let tipPinned = false;
const hideTip = force => { if (tipPinned && !force) return; tip.hidden = true; tip.classList.remove("pinned"); };
/* a tapped explanation stays up until the next click anywhere */
function pinTip(html, ev) {
  ev.stopPropagation();
  tipPinned = false;
  const x = ev.clientX || 0, y = ev.clientY || 0;
  if (x || y) showTip(html, x, y);
  else { const r = ev.currentTarget.getBoundingClientRect(); showTip(html, r.left + r.width / 2, r.top); }

function refreshLive() {

             : key ? document.querySelector('[data-k="' + key + '"]') : null;

/* ---------- sortable table ---------- */
/* The longest run of matches satisfying `ok`, and where it ended. */
function longestRun(log, ok) {
  let best = 0, cur = 0, from = null, span = null;
  log.forEach(e => {
    if (ok(e)) {
      cur++; if (cur === 1) from = e;
      if (cur > best) { best = cur; span = { from, to: e }; }
    } else { cur = 0; from = null; }
  });
  return { n: best, span };
}
/* The run still going at the end of the log. */
function currentRun(log, ok) {
  let n = 0;
  for (let i = log.length - 1; i >= 0; i--) { if (ok(log[i])) n++; else break; }
  return n;
}
const isW = e => e.res === "w";
const isNL = e => e.res !== "l";
const isL = e => e.res === "l";

function makeTable(host, cols, rows, opts) {
  opts = opts || {};
  const st = { key: opts.sort || null, dir: opts.dir || -1 };
  const box = el("div", "tscroll" + (opts.fit ? " fit" : "")), tbl = el("table");
  const thead = el("thead"), trh = el("tr");
  cols.forEach(c => {
    const th = el("th", c.sortable === false ? "" : "sortable");
    th.innerHTML = esc(c.label) + '<span class="car"></span>';
    if (c.sortable !== false) th.onclick = () => {
      if (st.key === c.key) st.dir = -st.dir; else { st.key = c.key; st.dir = -1; }
      render();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); tbl.appendChild(thead);
  const tbody = el("tbody"); tbl.appendChild(tbody); box.appendChild(tbl); host.appendChild(box);
  function render() {
    const list = rows.slice();
    if (st.key) {
      const col = cols.find(c => c.key === st.key);
      list.sort((a, b) => {
        const va = col.sortVal ? col.sortVal(a) : col.val(a), vb = col.sortVal ? col.sortVal(b) : col.val(b);
        return typeof va === "string" ? st.dir * va.localeCompare(vb, "he") : st.dir * (va - vb);
      });
    }
    trh.querySelectorAll("th").forEach((th, i) => {
      const on = cols[i].key === st.key;
      th.querySelector(".car").textContent = on ? (st.dir === -1 ? " ↓" : " ↑") : "";
      if (on) th.setAttribute("aria-sort", st.dir === -1 ? "descending" : "ascending"); else th.removeAttribute("aria-sort");
    });
    tbody.innerHTML = "";
    list.forEach((r, i) => {
      const tr = el("tr", opts.rowCls ? opts.rowCls(r, i) : "");
      cols.forEach(c => {
        const td = el("td", c.cls ? c.cls(r) : "");
        td.innerHTML = c.render ? c.render(r, i) : String(c.val(r));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  render();
  return { render };
}

/* ==========================================================================
   Storage — the artifact's shared store, with a per-browser fallback
   ========================================================================== */
const Store = {
  db: null,
  mode: "loading",      // loading | cloud | local
  ready: null,
  lastError: null,
  lastSaveAt: null,
  dirty: {},            // tournament ids edited before the store answered

  /* Whichever host we are running in, and never waiting on it forever.
     window.APP_DB is the standalone build (Firestore); window.claude.use is
     the artifact runtime. Both expose the same doc/collection surface. */
  provider() {
    if (window.APP_DB && window.APP_DB.open) return window.APP_DB.open();
    if (window.claude && window.claude.use) return window.claude.use("db");
    return Promise.resolve(null);
  },
  async connect(ms) {
    let got = null;
    try {
      got = await Promise.race([
        this.provider(),
        new Promise(r => setTimeout(() => r("timeout"), ms || 9000))
      ]);
    } catch (e) { got = null; }
    if (got === "timeout") { this.db = null; this.lastError = "החיבור לאחסון לא ענה"; }
    else { this.db = got || null; }
    this.mode = this.db ? "cloud" : "local";
    return this.db;
  },

  /* the browser's own copy, read synchronously so the page is usable at once */
  initLocal() {
    this.mode = "loading";
    try {
      const raw = localStorage.getItem("fifa-live");
      if (raw) {
        const o = JSON.parse(raw);
        (o.tournaments || []).forEach(r => { if (r && r.i) LIVE[r.i] = hydrate(r); });
        if (o.pool && o.pool.length) CLUB_POOL = o.pool;
        if (o.photos) PHOTOMAP = Object.assign({}, o.photos);
        if (Array.isArray(o.seasons) && o.seasons.length) SEASONS = o.seasons.map(x => ({ id: x.id, name: x.name }));
      }
    } catch (e) {}
  },

  initCloud() {
    this.ready = (async () => {
      await this.connect(9000);
      if (this.db) await this.loadCloud();
      await this.flushDirty(null);
      this.paint();
    })();
    return this.ready;
  },

  async loadCloud() {
    try {
      const snap = await this.db.collection("tournaments").get();
      snap.docs.forEach(d => {
        const r = d.data();
        /* d.data() is frozen — copy before anything tries to edit it */
        if (r && r.i && !this.dirty[r.i]) LIVE[r.i] = hydrate(thaw(r));
      });
      const cfg = await this.db.doc("meta/config").get();
      if (cfg.exists) {
        const c = cfg.data();
        if (Array.isArray(c.pool) && c.pool.length) CLUB_POOL = c.pool.slice();
        if (c.photos && typeof c.photos === "object") PHOTOMAP = Object.assign({}, c.photos);
        if (Array.isArray(c.seasons) && c.seasons.length) SEASONS = c.seasons.map(x => ({ id: x.id, name: x.name }));
      }
    } catch (e) {
      this.lastError = (e && (e.code || e.message)) || "load failed";
    }
  },

  localFlush() {
    try {
      localStorage.setItem("fifa-live", JSON.stringify({
        pool: CLUB_POOL, photos: PHOTOMAP, seasons: SEASONS,
        tournaments: Object.values(LIVE).map(t => t.rec)
      }));
      return true;
    } catch (e) { return false; }
  },

  /* one attempt at the cloud, always a local copy, never a permanent give-up */
  async write(t) {
    let ok = false;
    if (this.db) {
      try {
        await this.db.doc("tournaments/t" + t.i).set(t.rec);
        ok = true; this.mode = "cloud"; this.lastError = null;
      } catch (e) {
        this.lastError = (e && (e.code || e.message)) || "save failed";
      }
    }
    const local = this.localFlush();
    if (!ok && !this.db) this.mode = "local";
    if (ok || local) this.lastSaveAt = Date.now();
    /* only a cloud write clears the flag — a local copy still owes the cloud */
    if (ok || !this.db) delete this.dirty[t.i];
    if (ok) await this.flushDirty(t.i);
    this.paint();
    return ok;
  },

  /* carry anything the cloud still owes, once it answers again */
  async flushDirty(skip) {
    if (!this.db) return;
    for (const k of Object.keys(this.dirty)) {
      if (String(k) === String(skip)) continue;
      const o = LIVE[k];
      if (!o) { delete this.dirty[k]; continue; }
      try { await this.db.doc("tournaments/t" + o.i).set(o.rec); delete this.dirty[k]; }
      catch (e) { this.lastError = (e && (e.code || e.message)) || "save failed"; break; }
    }
  },

  async saveT(t) {
    this.dirty[t.i] = true;
    this.localFlush();              // the result is safe before the cloud is tried
    this.paint();
    if (this.ready) {
      try { await Promise.race([this.ready, new Promise(r => setTimeout(r, 9500))]); } catch (e) {}
    }
    return this.write(t);
  },

  async delT(id) {
    delete LIVE[id];
    delete this.dirty[id];
    if (this.db) { try { await this.db.doc("tournaments/t" + id).delete(); } catch (e) {} }
    this.localFlush();
    this.paint();
  },

  async saveConfig() {
    if (this.ready) { try { await this.ready; } catch (e) {} }
    if (this.db) {
      try {
        await this.db.doc("meta/config").set({ pool: CLUB_POOL, photos: PHOTOMAP, seasons: SEASONS });
        this.lastError = null; this.lastSaveAt = Date.now(); this.paint(); return;
      } catch (e) { this.lastError = (e && (e.code || e.message)) || "save failed"; }
    }
    this.localFlush(); this.lastSaveAt = Date.now(); this.paint();
  },

  /* try the connection again after a failure, without reloading the page */
  async retry() {
    this.mode = "loading"; this.lastError = null; this.paint();
    await this.connect(9000);
    await this.flushDirty(null);
    this.paint();
  },

  /* write this tournament right now and report exactly what happened */
  async forceSave(t) {
    this.dirty[t.i] = true;
    const local = this.localFlush();
    /* a short probe: the button must answer quickly, not sit on "saving" */
    if (!this.db) await this.connect(4000);
    if (!this.db) {
      this.paint();
      return { ok: false, why: this.lastError || "אין חיבור לאחסון המשותף", local: local };
    }
    try {
      await this.db.doc("tournaments/t" + t.i).set(t.rec);
      delete this.dirty[t.i];
      this.lastError = null; this.lastSaveAt = Date.now(); this.mode = "cloud";
      await this.flushDirty(t.i);
      this.paint();
      return { ok: true, local: local };
    } catch (e) {
      this.lastError = (e && (e.code || e.message)) || "save failed";
      this.paint();
      return { ok: false, why: this.lastError, local: local };
    }
  },

  /* everything the page holds, as text the user can keep */
  backup() {
    return JSON.stringify({
      savedAt: new Date().toISOString(),
      pool: CLUB_POOL, photos: PHOTOMAP, seasons: SEASONS,
      tournaments: Object.values(LIVE).map(t => t.rec)
    }, null, 2);
  },

  status() {
    const pend = Object.keys(this.dirty).length;
    if (this.mode === "loading") return { cls: "", text: "מתחבר לאחסון…" };
    if (this.lastError) return { cls: " warn", text: "⚠ השמירה בענן נכשלה (" + esc(String(this.lastError)) +
      "). הנתונים נשמרו בדפדפן הזה.", retry: true };
    if (this.mode === "local") return { cls: " warn", text: "⚠ אין חיבור לאחסון המשותף — נשמר בדפדפן הזה בלבד.", retry: true };
    if (pend) return { cls: "", text: "שומר… (" + pend + " ממתין לענן)" };
    const at = this.lastSaveAt ? new Date(this.lastSaveAt).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }) : null;
    return { cls: "", text: "✓ נשמר בענן" + (at ? " · " + at : "") };
  },

  paint() {
    paintRows();
    const n = document.getElementById("saveStatus");
    if (!n) return;
    const s = this.status();
    n.className = "notice savebar" + s.cls;
    n.innerHTML = "<span>" + s.text + "</span>";
    if (s.retry) {
      const b = el("button", "btn ghost sm", "נסה שוב");
      b.onclick = () => this.retry();
      n.appendChild(b);
    }
  }
};

/* on-disk record -> in-memory tournament */
function hydrate(rec) {
  const season = rec.s || 0;
  const num = rec.n || rec.i;
  const tpl = TPL[rec.tpl] || TPL[String(rec.slots.length)];
  const slots = rec.slots, clubs = rec.clubs;
  const d = slots.map((p, i) => [p, clubIdx(clubs[i])]);
  const m = tpl.map((f, k) => {
    const sc = (rec.scores && rec.scores[k]) || [null, null];
    return [slots[f.h[0] - 1], slots[f.h[1] - 1], clubIdx(clubs[f.hc - 1]),
            slots[f.a[0] - 1], slots[f.a[1] - 1], clubIdx(clubs[f.ac - 1]),
            sc[0], sc[1]];
  });
  return { i: uid(season, num), num, season, d, t: null, m,
           c: (rec.champs || []).slice().sort((a, b) => a - b), rec, live: true };
}
/* keep each match row's cloud label in step with the store */
function paintRows() {
  document.querySelectorAll(".doneline[data-t]").forEach(n => {
    const lbl = n.querySelector(".ok");
    if (!lbl) return;
    const pend = !!Store.dirty[n.getAttribute("data-t")];
    lbl.textContent = pend ? "⏳ ממתין לענן" : "✓ נשמר בענן";
    lbl.classList.toggle("pend", pend);
  });
}

function flash(msg, warn) {
  const n = el("div", "notice" + (warn ? " warn" : ""), esc(msg));
  n.style.cssText = "position:fixed;inset-inline:16px;bottom:16px;z-index:90;max-width:520px;margin-inline:auto;box-shadow:0 14px 40px rgba(0,0,0,.7)";
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 4200);
}

/* ==========================================================================
   The draw
   --------------------------------------------------------------------------
   Player order is drawn at random — that is what sets the fixture pairings.
   The clubs are not drawn at all: each player steps one place along a fixed
   ring every tournament.

       ריאל → באיירן → ליברפול → סיטי → פסז → ברצלונה → ריאל

   The first tournament of a season is set by hand, and from there the app
   fills the rest in. Because the ring is a bijection, two players can never
   land on the same club — as long as both stepped from the same tournament.
   A player who missed it, or who held a club outside the ring, is placed from
   what the ring left over, and the screen says so.
   ========================================================================== */
const CLUB_RING = ["ריאל", "באיירן", "ליברפול", "סיטי", "פסז", "ברצלונה"];
const ringNext = name => {
  const i = CLUB_RING.indexOf(name);
  return i < 0 ? null : CLUB_RING[(i + 1) % CLUB_RING.length];
};

/* the tournament this one follows, within its own season */
function prevInSeason(season, excludeId) {
  const seq = TS.filter(t => t.season === season && t.i !== excludeId)
                .slice().sort((a, b) => a.num - b.num);
  return seq[seq.length - 1] || null;
}

/* Step everyone along the ring. Returns the club per player plus, for each,
   where it came from — the briefing on screen is built straight from this. */
function rotateClubs(players, pool, prev) {
  const got = {}, taken = {}, note = {};
  players.forEach(p => {
    const from = prev && prev.teamOf[p] != null ? CLUBS[prev.teamOf[p]] : null;
    const to = from ? ringNext(from) : null;
    note[p] = { from, to, why: null };
    if (!from) note[p].why = "לא שיחק בטורניר הקודם";
    else if (!to) note[p].why = "הקבוצה הקודמת אינה במחזור";
    else if (pool.indexOf(to) < 0) note[p].why = "הקבוצה שבתור אינה ברשימת המשחק";
    else if (taken[to]) note[p].why = "הקבוצה שבתור כבר נתפסה";
    else { got[p] = to; taken[to] = 1; }
  });
  const left = pool.filter(c => !taken[c]);
  players.filter(p => !got[p]).forEach(p => {
    let k = left.findIndex(c => c !== note[p].from);
    if (k < 0) k = 0;
    const c = left[k];
    if (c) { got[p] = c; left.splice(k, 1); note[p].fallback = true; }
  });
  return { got, note };
}


/* ==========================================================================
   Match odds — a Poisson goals model fitted on the whole archive
   --------------------------------------------------------------------------
   Each pair has an attack rate (goals scored per match) and a defence rate
   (goals conceded), both expressed relative to the league average and shrunk
   toward it so a pair with few games is not over-trusted. The club a pair
   picks nudges those rates. Expected goals for a side = league average x its
   attack x the opponent's defence; the win/draw/loss split then falls out of
   the Poisson score grid.
   ========================================================================== */
let MODEL = null;
const SHRINK = 25;      // matches of league-average evidence mixed into every rate
const CLUB_W = 0.25;    // how much the club counts next to the pair

function buildModel() {
  const done = TS.filter(t => t.done);
  const all = aggregate(done);
  const mu = all.matches ? all.goals / (2 * all.matches) : 2.2;
  const rate = (v, g) => (v + SHRINK * mu) / (g + SHRINK) / mu;
  const pf = {}, cf = {}, vs = {};
  Object.values(all.PAIR).forEach(p => {
    pf[p.a + "-" + p.b] = { att: rate(p.gf, p.g), def: rate(p.ga, p.g), g: p.g, ppg: p.ppg,
                            w: p.w, d: p.dr, l: p.l, gf: p.gf, ga: p.ga };
  });
  all.TEAM.forEach((t, i) => {
    if (t.g) cf[i] = { att: rate(t.gf, t.g), def: rate(t.ga, t.g), g: t.g, name: CLUBS[i] };
  });
  /* how these two exact pairs have fared against each other before */
  const side = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
  done.forEach(t => t.m.forEach(m => {
    const A = side(m[0], m[1]), B = side(m[3], m[4]);
    const put = (x, y, gf, ga) => {
      const k = x + "|" + y;
      const r = vs[k] || (vs[k] = { g: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
      r.g++; r.gf += gf; r.ga += ga;
      if (gf > ga) r.w++; else if (gf === ga) r.d++; else r.l++;
    };
    put(A, B, m[6], m[7]);
    put(B, A, m[7], m[6]);
  }));
  MODEL = { mu, pf, cf, vs, matches: all.matches, rho: 1 };
  MODEL.rho = calibrateDraw(done);
}

function poissonRow(lambda, n) {
  const out = []; let p = Math.exp(-lambda);
  for (let k = 0; k <= n; k++) { out.push(p); p = p * lambda / (k + 1); }
  return out;
}

/* expected goals for both sides of any pairing, clubs included */
function lambdasFor(h1, h2, hc, a1, a2, ac) {
  if (!MODEL || !MODEL.matches) return null;
  const key = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
  const ph = MODEL.pf[key(h1, h2)], pa = MODEL.pf[key(a1, a2)];
  if (!ph || !pa) return null;
  const one = { att: 1, def: 1, g: 0 };
  const ch = MODEL.cf[hc] || one, ca = MODEL.cf[ac] || one;
  const mix = (x, c) => Math.pow(x, 1 - CLUB_W) * Math.pow(c, CLUB_W);
  return [MODEL.mu * mix(ph.att, ch.att) * mix(pa.def, ca.def),
          MODEL.mu * mix(pa.att, ca.att) * mix(ph.def, ch.def), ph, pa, ch, ca];
}

function rawForecast(m) {
  const L = lambdasFor(m[0], m[1], m[2], m[3], m[4], m[5]);
  if (!L) return null;
  const key = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
  const kh = key(m[0], m[1]), ka = key(m[3], m[4]);
  const lh = L[0], la = L[1], ph = L[2], pa = L[3], ch = L[4], ca = L[5];
  const N = 12, A = poissonRow(lh, N), B = poissonRow(la, N);
  let w = 0, d = 0, l = 0;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const q = A[i] * B[j];
    if (i > j) w += q; else if (i === j) d += q; else l += q;
  }
  return { w, d, l, lh, la, ph, pa, ch, ca, kh, ka };
}

function forecast(m) {
  const r = rawForecast(m);
  if (!r) return null;
  const rho = MODEL.rho || 1;
  const den = r.w + rho * r.d + r.l;
  return { w: r.w / den, d: rho * r.d / den, l: r.l / den,
           lh: r.lh, la: r.la, ph: r.ph, pa: r.pa, ch: r.ch, ca: r.ca,
           h2h: MODEL.vs[r.kh + "|" + r.ka] || null };
}

/* one shared factor on the drawn-score diagonal, solved so the model's mean
   draw probability equals the rate the archive actually shows */
function calibrateDraw(done) {
  const cells = [];
  let draws = 0, n = 0;
  done.forEach(t => t.m.forEach(m => {
    n++; if (m[6] === m[7]) draws++;
    const r = rawForecast(m);
    if (r) cells.push([r.d, r.w + r.l]);
  }));
  if (!n || !cells.length) return 1;
  const target = draws / n;
  const mean = rho => cells.reduce((s, c) => s + rho * c[0] / (rho * c[0] + c[1]), 0) / cells.length;
  let lo = 0.25, hi = 6;
  for (let k = 0; k < 40; k++) {
    const mid = (lo + hi) / 2;
    if (mean(mid) < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* ==========================================================================
   Tournament simulation — who reaches the final four, and who lifts it
   ========================================================================== */

/* seeded xorshift: the same tournament state always yields the same numbers */
function rng(seed) {
  let x = seed | 0 || 123456789;
  return () => {
    x ^= x << 13; x |= 0; x ^= x >>> 17; x ^= x << 5; x |= 0;
    return ((x >>> 0) % 100000) / 100000;
  };
}
function seedOf(t) {
  let h = 2166136261 ^ t.i;
  t.m.forEach(m => { h = Math.imul(h ^ ((m[6] == null ? 99 : m[6]) * 31 + (m[7] == null ? 99 : m[7])), 16777619); });
  return h >>> 0;
}
function samplePoisson(lambda, rnd) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L && k < 40);
  return k - 1;
}

/* the final's two legs, as expected goals, for the newsroom preview */
function finalLegLambdas(t, tb) {
  const A = lambdasFor(tb[2], tb[3], t.teamOf[tb[3]], tb[0], tb[1], t.teamOf[tb[1]]);
  const B = lambdasFor(tb[0], tb[1], t.teamOf[tb[0]], tb[2], tb[3], t.teamOf[tb[2]]);
  return [A, B];
}

/* `force` optionally pins the first unplayed fixture to an outcome
   ("h" | "d" | "a") so we can ask what one result would be worth */
/* The same tournament state always simulates to the same numbers (the
   stream is seeded from it), so the answer is kept: reopening the newsroom
   or a tournament costs nothing the second time. The key covers everything
   the result depends on — scores, clubs, the model, and the options. */
const SIMC = { model: null, map: {}, n: 0 };
function simulate(t, iters, force, seed) {
  if (!MODEL || !MODEL.matches) return null;
  if (SIMC.model !== MODEL || SIMC.n > 600) { SIMC.model = MODEL; SIMC.map = {}; SIMC.n = 0; }
  const key = scoreSig(t) + "|" + t.d.map(x => x[1]).join(".") + "|" + iters + "|" +
              (force ? (typeof force === "string" ? force : force.o + "@" + force.at) : "-") + "|" +
              (seed != null ? seed : "s");
  if (SIMC.map[key]) return SIMC.map[key];
  const out = simulateRun(t, iters, force, seed);
  if (out) { SIMC.map[key] = out; SIMC.n++; }
  return out;
}
function simulateRun(t, iters, force, seed) {
  if (!MODEL || !MODEL.matches) return null;
  /* `force` is "h"|"d"|"a" for the next open fixture, or {o, at} to pin one
     particular fixture. `seed` pins the stream, so two runs of neighbouring
     states differ because of the football and not because of the dice. */
  const fo = typeof force === "string" ? { o: force, at: -1 } : (force || null);
  const players = t.players;
  const base = {};
  players.forEach(p => { base[p] = { pts: 0, gf: 0, ga: 0 }; });
  const open = [];
  t.m.forEach((m, mi) => {
    if (m[6] != null && m[7] != null) {
      addResult(base, m, m[6], m[7]);
    } else {
      const f = rawForecast(m);
      open.push({ m, at: mi, lh: f ? f.lh : MODEL.mu, la: f ? f.la : MODEL.mu });
    }
  });
  if (fo && fo.at >= 0 && !open.some(o => o.at === fo.at)) return null;   // already played
  const out = {};
  players.forEach(p => { out[p] = { place: [0,0,0,0,0,0], top4: 0, title: 0, first: 0 }; });
  const rnd = rng((seed != null ? seed : seedOf(t)) +
                  (fo ? fo.o.charCodeAt(0) * 7919 + (fo.at + 2) * 104729 : 0));
  for (let it = 0; it < iters; it++) {
    const acc = {};
    players.forEach(p => { acc[p] = { pts: base[p].pts, gf: base[p].gf, ga: base[p].ga }; });
    open.forEach((o, oi) => {
      let hg, ag;
      if (fo && (fo.at < 0 ? oi === 0 : o.at === fo.at)) {
        do { hg = samplePoisson(o.lh, rnd); ag = samplePoisson(o.la, rnd); }
        while (!((fo.o === "h" && hg > ag) || (fo.o === "d" && hg === ag) || (fo.o === "a" && ag > hg)));
      } else {
        hg = samplePoisson(o.lh, rnd); ag = samplePoisson(o.la, rnd);
      }
      addResult(acc, o.m, hg, ag);
    });
    const order = players.slice().sort((a, b) =>
      acc[b].pts - acc[a].pts ||
      (acc[b].gf - acc[b].ga) - (acc[a].gf - acc[a].ga) ||
      acc[b].gf - acc[a].gf);
    order.forEach((p, i) => { if (i < 6) out[p].place[i]++; if (i < 4) out[p].top4++; });
    out[order[0]].first++;
    if (order.length >= 4) {
      const A = lambdasFor(order[2], order[3], t.teamOf[order[3]],
                           order[0], order[1], t.teamOf[order[1]]);
      const B = lambdasFor(order[0], order[1], t.teamOf[order[0]],
                           order[2], order[3], t.teamOf[order[2]]);
      let topG, botG;
      if (A && B) {
        const l1h = samplePoisson(A[0], rnd), l1a = samplePoisson(A[1], rnd);
        const l2h = samplePoisson(B[0], rnd), l2a = samplePoisson(B[1], rnd);
        topG = l1a + l2h; botG = l1h + l2a;
      } else { topG = 0; botG = 0; }
      const top = topG > botG || (topG === botG && rnd() < 0.5);
      const win = top ? [order[0], order[1]] : [order[2], order[3]];
      win.forEach(p => out[p].title++);
    }
  }
  players.forEach(p => {
    const o = out[p];
    o.top4 /= iters; o.title /= iters; o.first /= iters;
    o.place = o.place.map(c => c / iters);
  });
  return out;
}

function addResult(acc, m, hg, ag) {
  const dw = hg === ag, hp = dw ? 1 : hg > ag ? 3 : 0, ap = dw ? 1 : ag > hg ? 3 : 0;
  [[[m[0], m[1]], hg, ag, hp], [[m[3], m[4]], ag, hg, ap]].forEach(([duo, gf, ga, pts]) => {
    duo.forEach(p => { const a = acc[p]; a.pts += pts; a.gf += gf; a.ga += ga; });
  });
}

/* ==========================================================================
   The timeline: the tournament at every stage it passed through
   --------------------------------------------------------------------------
   Standings are derived and never stored, so the tournament after N matches
   is simply the same tournament with the later results blanked out. Running
   the simulation at each stage, all from one pinned seed, gives the road to
   the final as it looked at that moment — and the difference between two
   consecutive stages is exactly what that one result was worth.
   ========================================================================== */
const scoreSig = t => t.i + ":" + t.m.map(m =>
  (m[6] == null ? "-" : m[6]) + "." + (m[7] == null ? "-" : m[7])).join(",");

function snapshotAt(t, k) {
  return decorate({
    i: t.i, num: t.num, season: t.season,
    d: t.d.map(x => x.slice()), t: null,
    m: t.m.map((row, i) => i < k ? row.slice() : row.slice(0, 6).concat([null, null])),
    c: [], rec: { i: t.i, scores: [] }, snap: true
  });
}

/* ==========================================================================
   Heavy work, a step at a time
   --------------------------------------------------------------------------
   A phone runs these simulations 4-8x slower than a laptop. Run as one block,
   the season-long forecast froze a phone for ten seconds and the tabs looked
   dead. So every job that runs many simulations is done one unit at a time,
   handing the browser back between units: a tap waits for one unit, never
   for the whole job. Callers that cannot wait read only what is cached.
   ========================================================================== */
const yieldNow = () => new Promise(r => setTimeout(r, 0));
const INFLIGHT = {};
function once(key, make) {
  if (!INFLIGHT[key]) INFLIGHT[key] = make().finally(() => { delete INFLIGHT[key]; });
  return INFLIGHT[key];
}

const TLC = {};
const timelineCached = t => TLC[scoreSig(t)] || null;
function timelineAsync(t) {
  const sig = scoreSig(t);
  if (TLC[sig]) return Promise.resolve(TLC[sig]);
  return once("tl:" + sig, async () => {
    const played = t.m.filter(m => m[6] != null && m[7] != null).length;
    const seed = (Math.imul(t.i, 2654435761) ^ 0x5f3a) >>> 0;
    const stages = [];
    for (let k = 0; k <= played; k++) {
      const s = snapshotAt(t, k);
      stages.push({ k, t: s, sim: simulate(s, 2500, null, seed), swing: 0, mover: null, moved: 0 });
      await yieldNow();
    }
    return finishTimeline(t, sig, stages, played);
  });
}
/* synchronous form, kept for tests and anything that already holds the cache */
function timelineOf(t) {
  const sig = scoreSig(t);
  if (TLC[sig]) return TLC[sig];
  const played = t.m.filter(m => m[6] != null && m[7] != null).length;
  const seed = (Math.imul(t.i, 2654435761) ^ 0x5f3a) >>> 0;
  const stages = [];
  for (let k = 0; k <= played; k++) {
    const s = snapshotAt(t, k);
    stages.push({ k, t: s, sim: simulate(s, 2500, null, seed), swing: 0, mover: null, moved: 0 });
  }
  return finishTimeline(t, sig, stages, played);
}
function finishTimeline(t, sig, stages, played) {
  for (let k = 1; k < stages.length; k++) {
    const a = stages[k - 1].sim, b = stages[k].sim;
    if (!a || !b) continue;
    let tv = 0, best = null, bestD = 0;
    t.players.forEach(p => {
      const dd = b[p].top4 - a[p].top4;
      tv += Math.abs(dd);
      if (Math.abs(dd) > Math.abs(bestD)) { bestD = dd; best = p; }
    });
    stages[k].swing = tv / 2; stages[k].mover = best; stages[k].moved = bestD;
  }
  const peak = stages.slice(1).sort((x, y) => y.swing - x.swing)[0] || null;
  const out = { stages, peak, played };
  if (Object.keys(TLC).length > 24) for (const k in TLC) delete TLC[k];
  TLC[sig] = out;
  return out;
}

/* What one result is worth: how far the road to the final moves between the
   three possible outcomes of a single fixture, everything else simulated. */
const GRV = {};
const gravityCached = t => GRV[scoreSig(t)] || null;
function gravityOpen(t) {
  const openIdx = [];
  t.m.forEach((m, i) => { if (m[6] == null || m[7] == null) openIdx.push(i); });
  return (MODEL && MODEL.matches && openIdx.length && openIdx.length <= 8) ? openIdx : [];
}
function gravityOne(t, i, seed) {
  const m = t.m[i];
  const H = simulate(t, 1500, { o: "h", at: i }, seed);
  const D = simulate(t, 1500, { o: "d", at: i }, seed);
  const A = simulate(t, 1500, { o: "a", at: i }, seed);
  if (!H || !D || !A) return null;
  const inv = [m[0], m[1], m[3], m[4]];
  let top = null;
  inv.forEach(p => {
    const v = [H[p].top4, D[p].top4, A[p].top4];
    const spread = Math.max.apply(null, v) - Math.min.apply(null, v);
    if (!top || spread > top.spread) top = { p, spread, v };
  });
  return { i, p: top.p, v: top.v, spread: top.spread,

  const sig = scoreSig(t);
  if (GRV[sig]) return Promise.resolve(GRV[sig]);
  return once("gv:" + sig, async () => {
    const map = {}, seed = (Math.imul(t.i, 40503) + 7) >>> 0;
    for (const i of gravityOpen(t)) {
      const g = gravityOne(t, i, seed);

function gravityOf(t) {

  const map = {}, seed = (Math.imul(t.i, 40503) + 7) >>> 0;
  gravityOpen(t).forEach(i => { const g = gravityOne(t, i, seed); if (g) map[i] = g; });
  return finishGravity(sig, map);
}

  const list = Object.keys(map).map(k => map[k]).sort((a, b) => b.spread - a.spread);
  const out = { map, top: list[0] || null };
  if (Object.keys(GRV).length > 24) for (const k in GRV) delete GRV[k];
  GRV[sig] = out;
  return out;
}

function gravityWhy(t, g) {
  const m = t.m[g.i];
  let h = '<div class="th">מה כל תוצאה שווה</div><table>';
  h += "<tr><td></td><td>" + esc(P[m[0]]) + "+" + esc(P[m[1]]) + "</td><td>תיקו</td><td>" +

       "ולעלות לגמר, בהינתן כל אחת משלוש התוצאות. שאר המשחקים שטרם נוצחו מוגרלים " +
       "לפי המודל, " + nf(MODEL ? MODEL.matches : 0) + " משחקים.</div>";

/* Which of the three outcomes is best and worst for the player who has the
   most riding on the match, named by the pair rather than by screen side. */
function outcomeName(t, i, o) {
  const m = t.m[i];

}

    .sort((a, b) => b.v - a.v);

function gravityLine(t, g) {

async function paintGravity(t) {

  Object.keys(g.map).forEach(k => {

    const fx = document.querySelector('[data-fx="' + t.i + "-" + k + '"]');
    if (!fx) return;

  return sec;
}

async function fillTimeline(t, host) {
  const tl = timelineCached(t) || await timelineAsync(t);
  if (!host.isConnected) return;                           // the user moved on meanwhile
  host.innerHTML = "";
  if (tl.played < 1) { host.appendChild(el("div", "mut", "הציר ייפתח אחרי המשחק הראשון.")); return; }
  const maxSw = Math.max(0.02, ...tl.stages.slice(1).map(s => s.swing));
  const strip = el("div", "tline");
  const detail = el("div", "tldetail");
  const select = k => {
    strip.querySelectorAll(".tnode").forEach(n =>
      n.setAttribute("aria-pressed", String(Number(n.getAttribute("data-k")) === k)));
    tlStage(t, tl, k, detail);
  };
  tl.stages.forEach((s, k) => {
    const m = k > 0 ? t.m[k - 1] : null;
    const b = el("button", "tnode" + (k === 0 ? " zero" : ""));
    b.setAttribute("data-k", String(k));
    b.innerHTML = '<i class="sw" style="height:' + Math.round(3 + 25 * (s.swing || 0) / maxSw) + 'px"></i>' +
      "<b>" + (m ? scoreTxt(m[6], m[7]) : "—") + "</b>" +
      '<span class="n">' + (k === 0 ? "פתיחה" : k) + "</span>";
    b.title = k === 0 ? "לפני המשחק הראשון"
                      : "משחק " + k + " · הזיז " + pct(s.swing) + " נקודות אחוז";
    b.onclick = () => select(k);
    strip.appendChild(b);
  });
  for (let k = tl.played; k < t.m.length; k++) {
    strip.appendChild(el("div", "tnode future",
      '<i class="sw" style="height:3px"></i><b>—</b><span class="n">' + (k + 1) + "</span>"));
  }
  host.appendChild(strip);
  if (tl.peak && tl.peak.swing >= 0.05 && tl.peak.mover != null) host.appendChild(peakCard(t, tl, select));
  host.appendChild(detail);
  select(tl.played);
}

function peakCard(t, tl, select) {
  const s = tl.peak, m = t.m[s.k - 1], p = s.mover;
  const before = tl.stages[s.k - 1].sim[p].top4, after = s.sim[p].top4;
  const card = el("button", "peakcard");
  card.innerHTML = '<span class="lbl">רגע השיא</span>' +
    "<div><b>משחק " + s.k + "</b> · " + esc(P[m[0]]) + " ו" + esc(P[m[1]]) + " " +
      scoreTxt(m[6], m[7]) + " " + esc(P[m[3]]) + " ו" + esc(P[m[4]]) + "</div>" +
    "<div>" + plate(p) + " " + (after >= before ? "קפץ" : "צנח") + ' מ־<b class="ltr">' + pct(before) +
      '%</b> ל־<b class="ltr">' + pct(after) + "%</b> סיכוי לעלות לגמר — התזוזה הגדולה בטורניר.</div>";
  card.title = "לחץ כדי לראות את הטבלה מיד אחרי המשחק הזה";
  card.onclick = () => select(s.k);
  return card;
}

const ordHe = ["הראשון", "השני", "השלישי", "הרביעי", "החמישי", "השישי"];

function nextFixture(t) {
  for (let i = 0; i < t.m.length; i++) if (t.m[i][6] == null || t.m[i][7] == null) return { m: t.m[i], i };
  return null;
}
function lastPlayed(t) {
  for (let i = t.m.length - 1; i >= 0; i--) if (t.m[i][6] != null && t.m[i][7] != null) return { m: t.m[i], i };
  return null;
}
/* The draw card says "points per game the club has brought, all time" — so it
   reads every finished tournament, not the chosen season's (a new season has
   none yet, and every club showed 0.00). Cached until a tournament finishes. */
let ALLTEAM = null, ALLTEAM_KEY = "";
function allTimeTeams() {
  const done = TS.filter(x => x.done);
  const key = done.length + ":" + (done.length ? done[done.length - 1].i : "");
  if (key !== ALLTEAM_KEY) { ALLTEAM = aggregate(done).TEAM; ALLTEAM_KEY = key; }
  return ALLTEAM;
}
function clubQuality(t) {
  const ALL = allTimeTeams();
  return t.players.map(p => {
    const ci = t.teamOf[p], T = ALL[ci] || { g: 0, ppg: 0 };
    const f = MODEL.cf[ci] || { att: 1, def: 1, g: 0 };
    return { p, ci, name: CLUBS[ci], ppg: T.ppg || 0, g: T.g || 0, att: f.att, def: f.def,
             index: f.att / f.def };
  }).sort((a, b) => b.ppg - a.ppg || b.index - a.index);   // sort by the number shown
}

/* ==========================================================================
   Draw luck — did the draw hand this player an easy road or a hard one?
   --------------------------------------------------------------------------
   For every league match the player is in, the odds model gives expected
   points (3·win + draw) from everything the draw decided: his club, his
   partner, the pair across and that pair's club. Summed over his fixtures
   that is his expected haul. The same player in an average RANDOM draw of
   this tournament (players and clubs shuffled over the same fixture list)
   is the baseline, so a strong player is not called lucky for being strong.
   luck = expected points with this draw − expected points in a random one.
   The parts behind it — his club, the pairs and clubs he meets, his hardest
   match — are shown so the number can be read, not just trusted.
   ========================================================================== */
const DRAWLUCK = {};
function drawLuck(t) {
  if (!MODEL || !MODEL.matches || !t || !t.m.length) return null;
  const ck = t.i + ":" + MODEL.matches + ":" + t.d.map(x => x.join(".")).join(",");
  if (DRAWLUCK[t.i] && DRAWLUCK[t.i].ck === ck) return DRAWLUCK[t.i].v;

  const xp = (h1, h2, hc, a1, a2, ac) => {
    const f = forecast([h1, h2, hc, a1, a2, ac]);
    return f ? [3 * f.w + f.d, 3 * f.l + f.d, f.w, f.l] : null;
  };
  const key = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
  /* a pair's strength as points per game, pulled toward the average so a
     pair with three games does not read as a monster or a walkover */
  let pg = 0, pp = 0;
  Object.values(MODEL.pf).forEach(p => { pg += p.g; pp += 3 * p.w + p.d; });
  const avg = pg ? pp / pg : 1.35, K = 6;
  const pairPpg = (a, b) => { const p = MODEL.pf[key(a, b)]; return p ? (3 * p.w + p.d + K * avg) / (p.g + K) : avg; };
  const TEAMS = allTimeTeams();
  const clubPpg = ci => (TEAMS[ci] && TEAMS[ci].g ? TEAMS[ci].ppg : avg);

  const out = {};
  t.players.forEach(p => { out[p] = { p, ci: t.teamOf[p], xp: 0, g: 0, opp: 0, oppClub: 0, mate: 0, hard: null }; });
  let ok = true;
  t.m.forEach((m, k) => {
    const e = xp(m[0], m[1], m[2], m[3], m[4], m[5]);
    if (!e) { ok = false; return; }
    [[m[0], m[1], m[3], m[4], m[5], e[0], e[2]], [m[1], m[0], m[3], m[4], m[5], e[0], e[2]],
     [m[3], m[4], m[0], m[1], m[2], e[1], e[3]], [m[4], m[3], m[0], m[1], m[2], e[1], e[3]]].forEach(r => {
      const o = out[r[0]]; if (!o) return;
      o.xp += r[5]; o.g++;
      o.opp += pairPpg(r[2], r[3]); o.oppClub += clubPpg(r[4]); o.mate += pairPpg(r[0], r[1]);
      if (!o.hard || r[6] < o.hard.win) o.hard = { k, win: r[6], a: r[2], b: r[3], c: r[4] };
    });
  });
  if (!ok) return null;

  /* the baseline: the same fixture list, players and clubs shuffled */
  const tpl = (t.rec && TPL[t.rec.tpl]) || TPL[String(t.size)];
  const base = {}; t.players.forEach(p => { base[p] = 0; });
  let runs = 0;
  if (tpl) {
    const clubs = t.d.map(x => x[1]);
    let seed = 7 + t.i;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; };
    for (let r = 0; r < 300; r++) {
      const sl = shuffle(t.players.slice()), cl = shuffle(clubs.slice());
      let bad = false;
      tpl.forEach(f => {
        if (bad) return;
        const h1 = sl[f.h[0] - 1], h2 = sl[f.h[1] - 1], a1 = sl[f.a[0] - 1], a2 = sl[f.a[1] - 1];
        const e = xp(h1, h2, cl[f.hc - 1], a1, a2, cl[f.ac - 1]);
        if (!e) { bad = true; return; }
        base[h1] += e[0]; base[h2] += e[0]; base[a1] += e[1]; base[a2] += e[1];
      });
      if (bad) break;
      runs++;
    }
  }
  const v = t.players.map(p => {
    const o = out[p], n = o.g || 1;
    return { p, ci: o.ci, name: CLUBS[o.ci], club: clubPpg(o.ci), xp: o.xp, g: o.g,
             luck: runs ? o.xp - base[p] / runs : null,
             opp: o.opp / n, oppClub: o.oppClub / n, mate: o.mate / n, hard: o.hard };
  }).sort((a, b) => (b.luck != null ? b.luck - a.luck : b.xp - a.xp));
  DRAWLUCK[t.i] = { ck, v };
  return v;
}

function copyText(txt, btn) {
  const done = ok => {
    btn.textContent = ok ? "הועתק ✓" : "לא ניתן להעתיק";
    setTimeout(() => { btn.textContent = "העתק"; }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => done(true), () => fallback());
  } else fallback();
  function fallback() {
    const ta = el("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    done(ok);
  }
}

  }
  return c;
}

let draft = null;   // {size, players:[], clubs:[], slots:[]}  before it is saved

/* Which of the control room's four tabs is showing: games · table · final ·
   manage. Set by the router (go("live:table")); the new-tournament flow
   switches it to games so the draw appears where the fixtures will be. */
let LIVE_PANE = "games";

function viewLive(root) {
  root.innerHTML = "";
  const pane = LIVE_PANE;
  const inScope = Object.values(LIVE).filter(t => SCOPE === "all" || t.season === SCOPE)
    .sort((a, b) => b.i - a.i);
  /* open straight onto a tournament, like a scores app: the running one if
     there is one, otherwise the latest */
  if (!draft && (liveId == null || !LIVE[liveId] || inScope.indexOf(LIVE[liveId]) < 0)) {
    const pick = inScope.find(t => !t.done) || inScope[0];
    liveId = pick ? pick.i : null;
  }
  const open = liveId != null ? LIVE[liveId] : null;

  if (pane === "manage") { root.appendChild(managePanel(open, inScope)); return; }
  if (pane === "games") root.appendChild(pollCard());
  if (pane === "pred" && !draft) {
    const cur = liveId != null ? LIVE[liveId] : null;
    root.appendChild(predPanel(cur && !cur.done ? cur : (cur || null)));
    return;
  }

  /* several tournaments in this season: a compact picker, like a date strip */
  if (inScope.length > 1 && !draft) {
    const row = el("div", "picker");
    inScope.forEach(t => {
      const c = el("button", "pick", "טורניר " + t.num + (t.done ? " ✓" : ""));
      c.setAttribute("aria-pressed", String(liveId === t.i));
      c.onclick = () => { liveId = t.i; viewLive(root); };
      row.appendChild(c);
    });
    root.appendChild(row);
  }

  if (draft) {
    if (pane === "games") root.appendChild(draftPanel());
    else root.appendChild(el("div", "notice", "יש הגרלה פתוחה — היא בלשונית <b>משחקים</b>."));
    return;
  }
  if (!open) {
    const n = el("section", "block empty");
    n.innerHTML = '<div class="bhead"><h2>אין טורניר פתוח</h2>' +
      '<span class="note">פותחים טורניר חדש מהלשונית ניהול.</span></div>';
    const b = el("button", "btn", "＋ טורניר חדש");
    b.onclick = () => { draft = null; liveId = null; startDraft(6); };
    n.appendChild(b);
    root.appendChild(n);
    return;
  }
  root.appendChild(livePanel(open, pane));
}
