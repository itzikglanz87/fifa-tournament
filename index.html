<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A0E">
<meta name="description" content="הארכיון והניהול של טורניר הפיפא — טבלאות, הגרלה, סיכויים וגמר.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="טורניר פיפא">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ארכיון טורניר פיפא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Secular+One&display=swap">
<style>
/* ============================================================
   A committed single-world design: a night-match broadcast desk.
   Every colour is painted explicitly, so the page holds on any host.
   ============================================================ */
:root{
  --pitch:#070A0E; --panel:#0E141C; --panel2:#141C27; --panel3:#1C2633;
  --line:#1E2937; --line2:#2B3948;
  --ink:#EDF2F7; --ink2:#A3B2C2; --muted:#6B7C8F;
  --gold:#F5C542; --gold2:#C9971F; --gold-dim:#3A2E12;
  --pos:#4ADE80; --neg:#F87171;
  --p0:#4B86FA; --p1:#689E2D; --p2:#169EAF; --p3:#CD711D; --p4:#AE61E9; --p5:#E54C7A;
  --o1:#F0C55E; --o2:#CFA950; --o3:#AD8B42; --o4:#8A6E36; --o5:#65522B; --o6:#453A22;
  --o1t:#2A1F05; --o2t:#2A1F05; --o3t:#221A05; --o4t:#F2E7D2; --o5t:#F2E7D2; --o6t:#E6DCC8;
  --cut:10px;
}
*{box-sizing:border-box}
body{
  direction:rtl; margin:0; color:var(--ink);
  background:
    radial-gradient(1100px 520px at 70% -8%, #16222F 0%, rgba(22,34,47,0) 70%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.014) 0 38px, rgba(0,0,0,0) 38px 76px),
    var(--pitch);
  background-attachment:fixed;
  font-family:"Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{margin:0; font-weight:400; text-wrap:balance}
p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.wrap{max-width:1240px; margin-inline:auto; padding-inline:16px}
.disp{font-family:"Secular One","Heebo",sans-serif; font-weight:400; letter-spacing:-.005em}
.lbl{font-size:10.5px; letter-spacing:.18em; color:var(--muted); font-weight:700}

/* ---------- broadcast rail ---------- */
.rail{background:linear-gradient(180deg,#0C131B 0%,#0A1017 100%); border-bottom:1px solid var(--line)}
.rail::before{content:""; display:block; height:2px;
  background:linear-gradient(to left,var(--p0),var(--p1),var(--p2),var(--p3),var(--p4),var(--p5))}
.rail-in{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-block:14px 13px; justify-content:space-between}
.mark{display:flex; align-items:center; gap:11px}
.mark .glyph{width:38px; height:38px; flex:none; display:grid; place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold2)); color:#1A1305;
  clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);
  font-family:"Secular One",sans-serif; font-size:17px; line-height:1}
.mark h1{font-family:"Secular One",sans-serif; font-size:21px; line-height:1.1}
.mark .sub{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-top:1px}
.reign{display:flex; align-items:center; gap:12px; border:1px solid var(--gold-dim); background:#120E04;
  padding:7px 13px 8px; clip-path:polygon(0 0,100% 0,100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.reign .lbl{color:var(--gold)}
.reign .row{display:flex; gap:12px; align-items:center; margin-top:3px; flex-wrap:wrap}

.seasonbar{display:flex; align-items:center; gap:9px}
.seasonbar select{background:var(--panel2); border:1px solid var(--line2); color:var(--ink);
  padding:7px 11px; font-weight:700; font-size:13.5px; max-width:210px}

/* ---------- tabs ---------- */
.tabbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:rgba(7,10,14,.93); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.tabbar-in{display:flex; gap:0; overflow-x:auto; scrollbar-width:none}
.tabbar-in::-webkit-scrollbar{display:none}
.tab{padding:13px 16px 12px; font-weight:700; font-size:13.5px; letter-spacing:.02em; color:var(--muted);
  white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,background .15s}
.tab:hover{color:var(--ink2); background:rgba(255,255,255,.03)}
.tab[aria-selected="true"]{color:var(--pitch); background:var(--gold); border-bottom-color:var(--gold)}
.tab .badge{display:inline-block; margin-inline-start:6px; font-size:10px; font-weight:800; padding:1px 6px;
  border-radius:9px; background:var(--p2); color:#03181C; vertical-align:1px}

main{padding-block:24px 60px}
.view{display:flex; flex-direction:column; gap:28px}
/* `hidden` is only a user-agent display:none, and any author display rule
   beats it — so .view{display:flex} left every tab's view on screen, stacked
   one under another. Tapping a tab filled its view far below the fold and the
   phone appeared to do nothing. Hidden has to mean hidden. */
[hidden]{display:none !important}
section.block{display:flex; flex-direction:column; gap:12px}
.bhead{display:flex; align-items:baseline; justify-content:space-between; gap:12px 18px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:8px}
.bhead h2{font-family:"Secular One",sans-serif; font-size:19px}
.bhead .note{font-size:12.5px; color:var(--muted); max-width:66ch; line-height:1.5}

/* ---------- panels ---------- */
.panel{background:var(--panel); border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%)}
.panel.key{border-top:2px solid var(--gold)}

/* ---------- stat strip ---------- */
.strip4{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line)}
.stat{background:var(--panel); padding:13px 15px 14px}
.stat .v{font-family:"Secular One",sans-serif; font-size:29px; line-height:1.05; margin-top:5px}
.stat .s{font-size:12px; color:var(--ink2); margin-top:3px}

/* ---------- plates ---------- */
.plate{display:inline-flex; align-items:center; gap:6px; font-weight:700; white-space:nowrap}
.dot{width:9px; height:9px; flex:none; background:var(--c); transform:skewX(-14deg)}
.plate.lg{font-size:16px} .plate.lg .dot{width:11px; height:11px}
.pface{width:21px; height:21px; border-radius:50%; flex:none; background-size:cover;
  background-position:50% 45%; box-shadow:0 0 0 1.5px var(--c), 0 0 0 2.5px var(--panel)}
.plate.big .pface{width:26px; height:26px}
.club{display:inline-flex; align-items:center; gap:5px; color:var(--ink2); font-size:12px; font-weight:500; white-space:nowrap}
.club .cdot{width:8px; height:8px; flex:none; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto; border:1px solid var(--line); background:var(--panel)}
.tscroll.fit table{min-width:0; width:100%}
table{border-collapse:collapse; width:100%; min-width:max-content; font-size:14px}
th,td{padding:9px 12px; text-align:right; white-space:nowrap}
thead th{font-size:10.5px; letter-spacing:.1em; color:var(--muted); font-weight:700;
  background:var(--panel2); border-bottom:1px solid var(--line2)}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th .car{color:var(--gold)}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
td.rank{color:var(--muted); font-weight:800; width:1%}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.g{color:var(--gold); font-weight:800}
.mut{color:var(--muted)}
td.strong{font-weight:800}
tr.qual td.rank{color:var(--gold)}
.ltr{direction:ltr; unicode-bidi:isolate; display:inline-block}

/* ---------- squad cards ----------
   A square portrait on top, then the rating, the name and six named stats.
   Every number on the card can be tapped for a plain-language explanation. */
.deck{display:grid; grid-template-columns:repeat(auto-fit,minmax(188px,1fr)); gap:14px}
.fcard{position:relative; padding:2px; cursor:pointer; transition:transform .18s;
  clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px));
  background:linear-gradient(168deg,var(--t1) 0%,var(--t2) 46%,var(--t1) 100%)}
.fcard:hover,.fcard:focus-visible{transform:translateY(-4px)}
.fcard[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold)}
.fcard .inner{height:100%; display:flex; flex-direction:column;
  background:linear-gradient(168deg,rgba(255,255,255,.16) 0%,rgba(0,0,0,.05) 44%,rgba(0,0,0,.20) 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,13px 100%,0 calc(100% - 13px))}
.fcard .pic{position:relative; aspect-ratio:1/1; overflow:hidden; background:rgba(0,0,0,.22)}
.fcard .face{position:absolute; inset:0; background-size:cover; background-position:50% 50%}
.fcard .ghost{position:absolute; inset:0; display:grid; place-items:center;
  font-family:"Secular One",sans-serif; font-size:74px; color:var(--tink); opacity:.20}
.fcard .pic::after{content:""; position:absolute; inset-inline:0; bottom:0; height:40%;
  background:linear-gradient(to top,rgba(0,0,0,.66),rgba(0,0,0,0)); pointer-events:none}
.fcard .form{position:absolute; bottom:5px; inset-inline:0; display:flex; justify-content:center; gap:3px; z-index:2}
.fcard .form button{width:17px; height:17px; display:grid; place-items:center; padding:0; line-height:1;
  font-size:9.5px; font-weight:800; background:rgba(0,0,0,.58); color:#F2F6FA; cursor:pointer}
.fcard .form button:hover{background:rgba(0,0,0,.9); box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.fcard .form button.t{box-shadow:inset 0 0 0 1.5px var(--gold)}
.fcard .body{padding:9px 11px 11px; display:flex; flex-direction:column; gap:7px}
.fcard .top{display:flex; gap:9px; align-items:flex-start}
.fcard .ovr{background:none; border:0; padding:0; text-align:start; cursor:pointer; color:var(--tink)}
.fcard .ovr b{font-family:"Secular One",sans-serif; font-size:30px; font-weight:400; line-height:.95; display:block}
.fcard .ovr span{font-size:10px; font-weight:800; letter-spacing:.08em; opacity:.85}
.fcard .ovr:hover{opacity:.78}
.fcard .badge{margin-inline-start:auto; display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.fcard .shield{width:21px; height:21px; border-radius:50%; background:var(--c);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.fcard .cname{font-size:10px; color:var(--tink); opacity:.9; font-weight:700; letter-spacing:.03em}
.fcard .pname{font-family:"Secular One",sans-serif; font-size:19px; text-align:center; color:var(--tink);
  padding-top:6px; border-top:1px solid rgba(0,0,0,.3)}
.fcard .grid6{display:grid; grid-template-columns:1fr 1fr; gap:5px}
.fcard .s6{display:flex; flex-direction:column; align-items:flex-start; gap:1px; cursor:pointer;
  background:rgba(0,0,0,.15); padding:4px 7px 5px; border:0; color:var(--tink); text-align:start}
.fcard .s6:hover{background:rgba(0,0,0,.32)}
.fcard .s6 span{font-size:9.5px; font-weight:700; opacity:.86; line-height:1.2}
.fcard .s6 b{font-size:14.5px; font-weight:800; line-height:1.15}
/* a pinned explanation never swallows the next click — it passes through and dismisses */
.tip.pinned{pointer-events:none}
.tip .hint{margin-top:6px; font-size:11px; color:var(--muted)}

/* ---------- photo board ---------- */
.pboard{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px}
.pslot{border:1px solid var(--line); background:var(--panel); padding:8px; display:flex;
  flex-direction:column; gap:7px}
.pslot .thumb{aspect-ratio:4/5; background-size:cover; background-position:50% 16%; border:1px solid var(--line2)}
.pslot select{width:100%}
.pslot .num{font-size:10.5px; letter-spacing:.14em; color:var(--muted); font-weight:700}

/* ---------- chips / controls ---------- */
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{border:1px solid var(--line2); background:var(--panel2); padding:6px 14px; font-weight:700; font-size:13.5px;
  display:inline-flex; align-items:center; gap:7px; transition:.12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold); color:var(--pitch); border-color:var(--gold)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px var(--pitch)}
.btn{background:var(--gold); color:#141005; font-weight:800; font-size:14px; padding:10px 20px;
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px)); transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{background:var(--panel3); color:var(--muted); cursor:default; filter:none}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line2); clip-path:none; font-weight:700}
.btn.ghost:hover{border-color:var(--gold); color:var(--gold)}
.btn.sm{font-size:12.5px; padding:6px 13px}
.btn.danger:hover{color:var(--neg); border-color:var(--neg)}
select,input[type="text"],input[type="number"]{background:var(--panel3); border:1px solid var(--line2);
  color:var(--ink); padding:6px 9px; font-size:13.5px; font-weight:600}
input[type="number"]{width:52px; text-align:center; font-weight:800; font-size:15px}
.toggle{display:inline-flex; border:1px solid var(--line2); overflow:hidden; background:var(--panel2)}
.toggle button{padding:6px 13px; font-size:12.5px; font-weight:700; color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--panel3); color:var(--gold)}
label.check{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink2); cursor:pointer}
label.check input{accent-color:var(--gold); width:15px; height:15px}

/* ---------- draw ceremony ---------- */
.pots{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:10px}
.pot{border:1px solid var(--line); background:var(--panel); padding:12px 14px; min-height:96px;
  display:flex; flex-direction:column; gap:7px; position:relative; overflow:hidden}
.pot .slot{font-family:"Secular One",sans-serif; font-size:12px; color:var(--muted); letter-spacing:.1em}
.pot .who{font-family:"Secular One",sans-serif; font-size:23px; line-height:1.1; min-height:26px}
.pot .got{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; min-height:20px}
.pot.empty .who{color:var(--line2)}
.pot .bar{position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--c)}
.pot.reveal{animation:pop .42s cubic-bezier(.2,1.5,.4,1)}
.pot.rolling .who{color:var(--gold); opacity:.65}
@keyframes pop{0%{transform:scale(.93); opacity:.25} 60%{transform:scale(1.02)} 100%{transform:scale(1); opacity:1}}
.blocked{font-size:11.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.blocked s{color:var(--neg); opacity:.75; text-decoration-thickness:1px}

.savebar{justify-content:space-between; font-size:12.5px}
.savebar.warn b{color:var(--ink)}

/* ---------- match rows ---------- */
.matches{display:flex; flex-direction:column}
.mrow{display:grid; grid-template-columns:26px 1fr auto 1fr; align-items:center; gap:10px;
  padding:9px 13px; border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow:nth-child(even){background:rgba(255,255,255,.017)}
.side{display:flex; flex-direction:column; gap:3px; min-width:0}
.side.away{align-items:flex-end; text-align:left}
.side .duo{display:flex; gap:10px; flex-wrap:wrap}
.mn{color:var(--muted); font-weight:800; font-size:11.5px}
.score{font-family:"Secular One",sans-serif; font-size:17px; padding:3px 12px; background:var(--panel3);
  white-space:nowrap; direction:ltr; border:1px solid var(--line2); min-width:74px; text-align:center}
.score.live{background:#12202B; border-color:#24506B; color:var(--ink)}
.entry{display:flex; align-items:center; gap:5px; direction:ltr}
.rowsave{width:30px; height:30px; display:grid; place-items:center; padding:0; line-height:1;
  font-size:14px; font-weight:800; background:var(--panel3); border:1px solid var(--line2);
  color:var(--ink2); margin-inline-start:4px; transition:.12s}
.rowsave:hover{border-color:var(--gold); color:var(--gold)}
.rowsave.busy{opacity:.55}
.rowsave.done{background:#12331F; border-color:#2E6B4C; color:var(--pos)}
.rowsave.bad{background:#2C1414; border-color:#6B2E2E; color:var(--neg)}
.fade{opacity:.5}

/* ---------- newsroom ---------- */
.newsgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:12px}
.story{background:var(--panel); border:1px solid var(--line); padding:14px 16px 12px;
  display:flex; flex-direction:column; gap:9px}
.story.hero{grid-column:1/-1; border-color:var(--gold); border-top-width:2px;
  background:linear-gradient(150deg,#151104,var(--panel) 62%)}
.stag{font-size:10px; letter-spacing:.18em; color:var(--gold); font-weight:800}
.shead{font-family:"Secular One",sans-serif; font-size:17px; line-height:1.3}
.story.hero .shead{font-size:22px}
.sbody{font-size:13.5px; color:var(--ink2); line-height:1.6; display:flex; flex-direction:column; gap:8px}
.sbody b{color:var(--ink)}
.sfoot{display:flex; justify-content:flex-start; padding-top:3px}
.qbar{display:flex; flex-direction:column; gap:6px}
.qrow{display:grid; grid-template-columns:58px 1fr 42px; align-items:center; gap:9px; font-size:12.5px}
.qtrack{height:14px; background:var(--panel3); overflow:hidden}
.qfill{height:100%; background:var(--c)}
.qval{text-align:left; font-weight:800; color:var(--ink)}
.swing{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px}
.swing span{white-space:nowrap}
.up{color:var(--pos); font-weight:800}
.down{color:var(--neg); font-weight:800}
.newsbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* ---------- match odds ---------- */
.fixture{border-bottom:1px solid var(--line)}
.fixture:last-child{border-bottom:0}
.fixture:nth-child(even){background:rgba(255,255,255,.017)}
.fixture .mrow{border-bottom:0; background:none}
.odds{display:flex; align-items:center; gap:10px; padding:0 13px 10px}
.oddsbar{display:flex; flex:1; min-width:130px; height:17px; gap:2px; cursor:pointer; border:0; padding:0}
.oddsbar i{display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800;
  font-style:normal; overflow:hidden; min-width:0}
.oddsbar .oh{background:#1C7C8C; color:#EAFBFF}
.oddsbar .od{background:#39424B; color:#D6DEE6}
.oddsbar .oa{background:#A8601A; color:#FFF3E4}
.oddsbar:hover i{filter:brightness(1.15)}
.odds .cap{font-size:10.5px; letter-spacing:.1em; color:var(--muted); font-weight:700; white-space:nowrap}
.doneline{display:flex; align-items:center; gap:9px; padding:0 13px 10px; font-size:11.5px; color:var(--muted); flex-wrap:wrap}
.doneline .ok{color:var(--pos); font-weight:800; white-space:nowrap}
.doneline .ok.pend{color:var(--gold)}
.doneline .grow{flex:1; min-width:120px}
.entry input.filled{border-color:#2E6B4C; background:#12211A}
.oddskey{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11.5px; color:var(--muted);
  padding:9px 13px; border-bottom:1px solid var(--line)}
.oddskey b{font-weight:700}
.oddskey i{display:inline-block; width:11px; height:11px; vertical-align:-1px; margin-inline-end:4px}
.tip table{font-size:12px; margin-top:5px; width:100%}
.tip table td{padding:1px 0; white-space:nowrap}
.tip table td:last-child{text-align:left; font-weight:800}

/* ---------- the club ring, in the draw briefing ---------- */
.ringline{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:12px}

/* ---------- season awards ---------- */
.awards{display:grid; grid-template-columns:repeat(auto-fit,minmax(214px,1fr)); gap:10px}
.award{position:relative; padding:14px 15px 15px; display:flex; flex-direction:column; gap:6px;
  background:linear-gradient(180deg,#141018 0%,#0D1017 100%); border:1px solid var(--line2)}
.award.gold{background:linear-gradient(180deg,#1A1406,#100C03); border-color:var(--gold-dim)}
.award.gold .lbl{color:var(--gold)}
.award .who{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:14px}
.award .big{font-family:"Secular One",sans-serif; font-size:25px; line-height:1.05; color:var(--ink)}
.award.gold .big{color:var(--gold); text-shadow:0 0 20px rgba(245,197,66,.35)}
.award .sub{font-size:11.5px; color:var(--ink2); line-height:1.5}
.award .cup2{position:absolute; inset-inline-end:11px; top:10px; font-size:16px; opacity:.5}

/* ---------- the pre-tournament forecast ---------- */
.fcverdict{margin-top:11px; padding:10px 13px; font-size:13px; line-height:1.6;
  background:var(--panel2); border:1px solid var(--line2); color:var(--ink2)}
.fcverdict b{color:var(--ink)}
.fcverdict.hit{background:#0F2418; border-color:#2E6B4C; color:#C9F2D8}
.fcverdict.miss{background:#1E1410; border-color:#6B4A2E; color:#F2DCC9}
.calib td,.calib th{white-space:nowrap}
.calib .bar{display:inline-block; height:9px; background:var(--gold); vertical-align:middle;
  margin-inline-end:6px; min-width:2px}

/* ---------- the rivalry card ---------- */
.rivpick{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px}
.rivpick select{background:var(--panel2); border:1px solid var(--line2); color:var(--ink);
  padding:7px 10px; font-size:13px; font-weight:700}
.rivpick .sw{font-size:12.5px}
.rivgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px}
.rivside{border:1px solid var(--line); background:var(--panel2); padding:13px 15px}
.rivside h4{font-size:12px; letter-spacing:.14em; color:var(--muted); font-weight:700; margin:0 0 9px}
.rivscore{display:flex; align-items:baseline; gap:10px; font-family:"Secular One",sans-serif;
  font-size:26px; color:var(--ink); direction:ltr; justify-content:center}
.rivscore i{font-style:normal; font-size:13px; color:var(--muted)}
.rivrow{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12.5px;
  border-top:1px solid var(--line); color:var(--ink2)}
.rivrow b{color:var(--ink)}
.rivbar{display:flex; height:9px; margin:9px 0 3px; overflow:hidden; background:var(--panel3)}
.rivbar i{display:block}
.meets{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
.meet{border:1px solid var(--line); background:var(--panel2); padding:6px 9px; font-size:11.5px;
  color:var(--ink2); display:flex; flex-direction:column; gap:2px; min-width:86px}
.meet .s{font-family:"Secular One",sans-serif; font-size:15px; direction:ltr}
.meet.w{border-color:#2E6B4C} .meet.w .s{color:var(--pos)}
.meet.l{border-color:#6B2E2E} .meet.l .s{color:var(--neg)}
.meet.d .s{color:var(--ink2)}

/* ---------- chemistry ---------- */
.chemrow{display:grid; grid-template-columns:minmax(150px,1fr) minmax(120px,2fr) 74px 58px;
  align-items:center; gap:10px; padding:7px 2px; border-top:1px solid var(--line); font-size:12.5px}
.chemrow:first-child{border-top:0}
.chemrow .who{display:flex; gap:5px; align-items:center; flex-wrap:wrap}
.cbar{position:relative; height:15px; background:var(--panel3); border:1px solid var(--line); direction:ltr}
.cbar i{position:absolute; top:0; bottom:0; display:block}
.cbar i.up{background:var(--pos); left:50%}
.cbar i.dn{background:var(--neg); right:50%}
.cbar .mid{position:absolute; top:-3px; bottom:-3px; left:50%; width:1px; background:var(--line2)}
.cval{text-align:end; font-weight:800; font-variant-numeric:tabular-nums}
.cval.up{color:var(--pos)} .cval.dn{color:var(--neg)}
.cnote{font-size:11px; color:var(--muted); text-align:end}

/* ---------- asking before something irreversible ---------- */
.modalback{position:fixed; inset:0; z-index:200; padding:18px; display:grid; place-items:center;
  background:rgba(3,6,10,.74); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.modalcard{width:100%; max-width:430px; background:var(--panel); border:1px solid var(--line2);
  box-shadow:0 26px 70px rgba(0,0,0,.8); padding:20px 20px 17px}
.modalcard h3{font-family:"Secular One",sans-serif; font-size:18px; color:var(--ink)}
.modalcard p{margin-top:9px; font-size:13.5px; line-height:1.6; color:var(--ink2)}
.modalcard .warnstrip{margin-top:11px; padding:8px 11px; font-size:12.5px;
  background:#2A1212; border:1px solid #7A3030; color:#FFD9D9}
.modalrow{display:flex; gap:9px; margin-top:17px; flex-wrap:wrap}

/* ---------- the tournament timeline ---------- */
.tline{display:flex; gap:4px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:thin}
.tnode{flex:none; width:52px; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 3px 5px; background:var(--panel2); border:1px solid var(--line); transition:.12s}
.tnode:hover{border-color:var(--gold)}
.tnode[aria-pressed="true"]{border-color:var(--gold); background:#161104}
.tnode b{font-size:12.5px; font-weight:800; color:var(--ink)}
.tnode .n{font-size:10px; color:var(--muted); font-weight:700}
.tnode .sw{display:block; width:14px; background:linear-gradient(180deg,var(--gold),var(--gold2));
  align-self:center; border-radius:2px 2px 0 0; opacity:.9}
.tnode.zero .sw{background:var(--line2)}
.tnode.future{background:transparent; border-style:dashed; opacity:.5; cursor:default}
.tnode.future b{color:var(--muted)}
.tlmatch{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 11px;
  background:var(--panel2); border:1px solid var(--line); margin-bottom:9px; font-size:13px}
.tlmatch .mn{width:22px; height:22px; flex:none; display:grid; place-items:center; font-size:11px;
  font-weight:800; background:var(--panel3); color:var(--ink2)}
.tlmatch .sc{font-family:"Secular One",sans-serif; font-size:17px; color:var(--gold)}
.mvar{font-style:normal; font-size:9px; margin-inline-start:3px}
.mvar.up{color:var(--pos)} .mvar.down{color:var(--neg)}
.peakcard{display:block; width:100%; text-align:start; padding:11px 13px; margin-bottom:10px;
  background:linear-gradient(180deg,#171206,#120E04); border:1px solid var(--gold-dim);
  color:var(--ink2); font-size:13px; line-height:1.6; transition:.12s}
.peakcard:hover{border-color:var(--gold)}
.peakcard .lbl{display:block; color:var(--gold); margin-bottom:3px}
.peakcard b{color:var(--ink)}

/* ---------- a fixture that settles it ---------- */
.gravity{display:flex; align-items:center; gap:8px; width:100%; text-align:start;
  padding:7px 11px; font-size:12px; line-height:1.5; color:var(--ink2);
  background:var(--panel2); border-top:1px solid var(--line)}
.gravity:hover{color:var(--ink)}
.gravity.hot{background:#20130A; color:#FFD9A8; border-top-color:#5A3818}
.gravity .gk{flex:none; font-weight:800; letter-spacing:.04em}
.gravity.hot .gk{color:var(--gold)}

/* ---------- the ceremony ---------- */
.podiumscene{position:relative; overflow:hidden; grid-column:1/-1; margin-top:12px;
  min-height:330px; border:1px solid var(--gold); padding:18px 14px 20px;
  background:
    radial-gradient(85% 70% at 50% 108%, rgba(245,197,66,.20), rgba(245,197,66,0) 62%),
    linear-gradient(180deg,#05090F 0%, #0A1320 52%, #0D1A12 100%)}
.podiumscene .sky{position:absolute; inset:0; pointer-events:none}
.fw{position:absolute; width:4px; height:4px; border-radius:50%; opacity:0;
  animation:burst 3.2s ease-out infinite}
@keyframes burst{
  0%{opacity:0; transform:scale(.15)}
  10%{opacity:1}
  55%{opacity:.95}
  100%{opacity:0; transform:scale(1.9)}}
.confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
.confetti i{position:absolute; top:-16px; width:7px; height:12px; border-radius:1px;
  animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-20px,0) rotate(0deg); opacity:0}
  8%{opacity:1}
  100%{transform:translate3d(var(--dx,0px),360px,0) rotate(760deg); opacity:.9}}

.podiumscene .ttl2{position:relative; z-index:3; text-align:center;
  font-family:"Secular One",sans-serif; font-size:clamp(17px,3.6vw,23px); color:var(--gold);
  text-shadow:0 0 26px rgba(245,197,66,.6)}
.rostrum{position:relative; z-index:3; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; margin-top:14px}
.cup{width:62px; height:78px; filter:drop-shadow(0 0 22px rgba(245,197,66,.75));
  animation:lift 3.4s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
.standers{display:flex; align-items:flex-end; gap:26px; margin-top:-6px}
.stander{display:flex; flex-direction:column; align-items:center; position:relative}
.stander .head{width:40px; height:40px; border-radius:50%; background-size:cover; background-position:50% 40%;
  box-shadow:0 0 0 3px var(--c), 0 0 26px rgba(245,197,66,.45)}
.stander .torso{width:44px; height:38px; margin-top:-4px; border-radius:12px 12px 4px 4px;
  background:var(--c); opacity:.88}
.stander .arm{position:absolute; top:16px; width:8px; height:26px; border-radius:4px;
  background:var(--c); opacity:.88}
.stander .arm.l{inset-inline-start:-11px; transform:rotate(28deg)}
.stander .arm.r{inset-inline-end:-11px; transform:rotate(-28deg)}
.plinth{position:relative; z-index:3; width:min(300px,86%); height:62px; margin-inline:auto;
  background:linear-gradient(180deg,#F3D06A 0 7px,#2A3442 7px);
  border:1px solid rgba(255,255,255,.18); display:grid; place-items:center}
.plinth span{font-family:"Secular One",sans-serif; font-size:30px; color:var(--gold);
  text-shadow:0 0 18px rgba(245,197,66,.5)}
.wnames{position:relative; z-index:3; display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
  margin-top:12px; font-size:12.5px; color:var(--ink2)}
.wnames b{color:#fff; font-weight:800}
@media (prefers-reduced-motion:reduce){
  .fw,.confetti i,.cup{animation:none}
  .fw{opacity:.9}
}

/* ---------- the final: a pitch of its own ---------- */
.turf{
  background:
    radial-gradient(135% 85% at 50% -25%, rgba(255,255,255,.17), rgba(255,255,255,0) 58%),
    repeating-linear-gradient(90deg, #1F6E35 0 46px, #1A5F2E 46px 92px);
  box-shadow: inset 0 0 90px rgba(0,0,0,.55);
  border:1px solid #0E3A1C;
}
.finalgate{position:relative; display:flex; flex-direction:column; align-items:center; gap:15px;
  padding:34px 18px 30px; text-align:center; overflow:hidden}
.finalgate .kicker{font-size:11px; letter-spacing:.22em; color:rgba(255,255,255,.72); font-weight:800}
.finalgate h3{font-family:"Secular One",sans-serif; font-size:clamp(23px,5vw,34px); color:#fff;
  text-shadow:0 3px 18px rgba(0,0,0,.65)}
.finalgate .four{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.finalgate .four i{width:44px; height:44px; border-radius:50%; background-size:cover; background-position:50% 42%;
  box-shadow:0 0 0 2.5px var(--c), 0 8px 20px rgba(0,0,0,.55)}
.btn.enter{font-size:16px; padding:13px 30px; box-shadow:0 10px 26px rgba(0,0,0,.45)}

.finalstage{position:relative; overflow:hidden}
.finalstage .midline{position:absolute; inset-inline:0; top:0; height:2px; background:rgba(255,255,255,.22)}
.finalstage .arc{position:absolute; left:50%; top:-84px; width:168px; height:168px; margin-left:-84px;
  border:2px solid rgba(255,255,255,.18); border-radius:50%}
.walkout{position:relative; display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:14px;
  padding:26px 16px 24px; z-index:2}
.file{display:flex; gap:14px; flex-wrap:wrap}
.file.home{justify-content:flex-end}
.file.away{justify-content:flex-start}
.walker{display:flex; flex-direction:column; align-items:center; gap:5px}
.walker .ph{width:56px; height:56px; border-radius:50%; background-size:cover; background-position:50% 42%;
  box-shadow:0 0 0 3px var(--c), 0 12px 26px rgba(0,0,0,.55)}
.walker .nm{font-family:"Secular One",sans-serif; font-size:14px; color:#fff; text-shadow:0 2px 9px rgba(0,0,0,.8)}
.walker .cl{font-size:10.5px; color:rgba(255,255,255,.85); font-weight:600}
.vs{font-family:"Secular One",sans-serif; font-size:clamp(20px,4vw,30px); color:#FFD86B;
  text-shadow:0 0 24px rgba(245,197,66,.6); padding-bottom:16px; white-space:nowrap}
/* ---- the entrance: lights, then people, then the title ---- */
.finalstage .curtain,.finalstage .bloom,.finalstage .sweep{position:absolute; pointer-events:none}
.finalstage .curtain{inset:0; z-index:4; opacity:0;
  background:radial-gradient(125% 85% at 50% 0%, rgba(0,0,0,.5), rgba(0,0,0,.94) 72%)}
.finalstage .bloom{inset-inline:-10%; top:-46%; height:105%; z-index:1; opacity:.5;
  background:radial-gradient(52% 58% at 50% 56%, rgba(255,252,225,.55), rgba(255,252,225,0) 70%)}
.finalstage .sweep{inset:0; z-index:3; opacity:0;
  background:linear-gradient(104deg, transparent 34%, rgba(255,255,255,.22) 47%, transparent 61%)}

.intro .curtain{animation:lightsUp 3.4s cubic-bezier(.4,0,.2,1) both}
@keyframes lightsUp{
  0%{opacity:1} 7%{opacity:.5} 11%{opacity:.95} 19%{opacity:.3} 25%{opacity:.85}
  34%{opacity:.22} 62%{opacity:.07} 100%{opacity:0}}
.intro .bloom{animation:bloomUp 4s ease-out both}
@keyframes bloomUp{
  0%{opacity:0} 8%{opacity:.4} 13%{opacity:.05} 22%{opacity:.7} 30%{opacity:.12}
  72%{opacity:1} 100%{opacity:.62}}
.intro .sweep{animation:sweepBy 2.6s 1.05s ease-in-out both}
@keyframes sweepBy{
  0%{opacity:0; transform:translateX(-55%)} 22%{opacity:1} 78%{opacity:1}
  100%{opacity:0; transform:translateX(55%)}}

.intro .file.home .walker{animation:inRight 1.5s cubic-bezier(.16,.9,.2,1) both}
.intro .file.away .walker{animation:inLeft 1.5s cubic-bezier(.16,.9,.2,1) both}
@keyframes inRight{
  0%{opacity:0; transform:translateX(150px) scale(.66); filter:brightness(.35)}
  58%{opacity:1; filter:brightness(1.65)}
  100%{opacity:1; transform:none; filter:brightness(1)}}
@keyframes inLeft{
  0%{opacity:0; transform:translateX(-150px) scale(.66); filter:brightness(.35)}
  58%{opacity:1; filter:brightness(1.65)}
  100%{opacity:1; transform:none; filter:brightness(1)}}
.intro .walker .ph{animation:phBloom 1.9s both}
@keyframes phBloom{
  0%{box-shadow:0 0 0 3px var(--c)}
  55%{box-shadow:0 0 0 3px var(--c), 0 0 52px 14px rgba(255,255,255,.6)}
  100%{box-shadow:0 0 0 3px var(--c), 0 12px 26px rgba(0,0,0,.55)}}
.intro .walker .nm,.intro .walker .cl{animation:nameUp .8s both}
@keyframes nameUp{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}

.intro .vs{animation:vsIgnite 1.8s 4.15s both}
@keyframes vsIgnite{
  0%{opacity:0; transform:scale(2.4); letter-spacing:.55em; filter:blur(12px)}
  42%{opacity:1; filter:blur(0)}
  66%{text-shadow:0 0 70px rgba(245,197,66,1), 0 0 140px rgba(245,197,66,.65)}
  100%{opacity:1; transform:none; letter-spacing:.02em;
       text-shadow:0 0 26px rgba(245,197,66,.65)}}

.skipintro{position:absolute; inset-block-start:10px; inset-inline-end:12px; z-index:6;
  background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); color:#fff;
  font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:999px}
.skipintro:hover{background:rgba(0,0,0,.7)}
.stageboard{position:relative; z-index:2; padding:0 14px 16px; transition:opacity .9s ease, transform .9s ease}
.stageboard.pending{opacity:0; transform:translateY(26px) scale(.985); pointer-events:none}
.bracket.onpitch .bteam,.bracket.onpitch .bcore,.bracket.onpitch .dugout{
  background:rgba(7,16,11,.74); backdrop-filter:blur(3px); border-color:rgba(255,255,255,.16)}
.bracket.onpitch .bteam.win{background:linear-gradient(150deg,rgba(40,29,5,.9),rgba(7,16,11,.8) 72%);
  border-color:var(--gold)}
.bracket.onpitch::before{background:rgba(255,255,255,.22)}
.bracket.onpitch .bcore{border-inline-color:rgba(245,197,66,.45)}
.replay{background:none; border:0; color:rgba(255,255,255,.7); font-size:11.5px; font-weight:700;
  text-decoration:underline; padding:0 14px 14px; position:relative; z-index:2}
.replay:hover{color:#fff}

/* ---------- the bench, drawn as a bench ---------- */
.dugout{border:1px solid var(--line2); background:var(--panel); padding:12px 11px 10px;
  display:flex; flex-direction:column; gap:8px}
.dugout .seed{font-size:10px; letter-spacing:.14em; color:var(--muted); font-weight:800}
.dscene{position:relative; padding-top:4px}
.drail{position:absolute; inset-inline:4px; top:6px; height:6px; border-radius:3px;
  background:linear-gradient(180deg,#5C4732,#33271A)}
.dseats{position:relative; z-index:2; display:flex; gap:12px; justify-content:center; align-items:flex-end}
.sitter{display:flex; flex-direction:column; align-items:center}
.sitter .head{width:30px; height:30px; border-radius:50%; background-size:cover; background-position:50% 40%;
  box-shadow:0 0 0 2px var(--c); filter:grayscale(.6) brightness(.92)}
.sitter .torso{width:36px; height:24px; margin-top:-4px; border-radius:10px 10px 3px 3px;
  background:var(--c); opacity:.7}
.dplank{height:10px; border-radius:3px; margin-top:-2px;
  background:linear-gradient(180deg,#8B6C48,#5A4429); box-shadow:0 2px 0 rgba(0,0,0,.45)}
.dlegs{display:flex; justify-content:space-between; padding:0 12px}
.dlegs i{width:7px; height:15px; border-radius:0 0 2px 2px; background:linear-gradient(180deg,#4B3927,#2B2116)}
.dnames{display:flex; gap:12px; justify-content:center; font-size:10.5px; color:var(--muted); font-weight:700}
.dnote{font-size:11px; color:var(--muted); line-height:1.45; text-align:center}
.bracket.onpitch .dugout .dnote,.bracket.onpitch .dugout .dnames,.bracket.onpitch .dugout .seed{
  color:rgba(255,255,255,.72)}

@media (prefers-reduced-motion:reduce){
  .intro .file .walker,.intro .vs,.intro .curtain,.intro .bloom,.intro .sweep,
  .intro .walker .ph,.intro .walker .nm,.intro .walker .cl{animation:none}
  .finalstage .curtain{opacity:0}
  .stageboard.pending{opacity:1; transform:none; pointer-events:auto}
}
@media (max-width:660px){
  .walkout{grid-template-columns:1fr; gap:10px; padding:20px 12px 18px}
  .file.home,.file.away{justify-content:center}
  .vs{padding:0; text-align:center}
  .walker .ph{width:46px; height:46px}
}

/* ---------- the final, as a bracket ---------- */
.bracket{position:relative; display:grid; gap:14px; align-items:stretch;
  grid-template-columns:minmax(158px,1fr) minmax(290px,1.6fr) minmax(158px,1fr) minmax(112px,auto)}
.bracket::before{content:""; position:absolute; inset-inline:0; top:50%; height:1px;
  background:var(--line2); z-index:0}
.bracket > *{position:relative; z-index:1}
.bteam{background:var(--panel2); border:1px solid var(--line2); padding:12px 13px;
  display:flex; flex-direction:column; gap:9px}
.bteam .seed{font-size:10px; letter-spacing:.14em; color:var(--muted); font-weight:800}
.bteam .one{display:flex; align-items:center; gap:8px}
.bteam .one .club{margin-inline-start:auto}
.bteam.win{border-color:var(--gold); background:linear-gradient(150deg,#1A1305,var(--panel2) 72%)}
.bteam.win .seed{color:var(--gold)}
.bteam .tot{font-family:"Secular One",sans-serif; font-size:25px; line-height:1; margin-top:2px}
.bteam.win .tot{color:var(--gold)}
.bcore{display:flex; flex-direction:column; gap:11px; background:var(--panel);
  border:1px solid var(--line); border-inline:2px solid var(--gold-dim); padding:13px 14px}
.bleg{display:flex; flex-direction:column; gap:8px; padding-bottom:11px; border-bottom:1px solid var(--line)}
.bleg .lbl2{font-size:10.5px; letter-spacing:.12em; color:var(--muted); font-weight:800}
.blegrow{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px}
.blegrow .away{text-align:left}
.bagg{display:flex; align-items:center; justify-content:center; gap:13px; flex-wrap:wrap}
.bagg .lbl2{font-size:10.5px; letter-spacing:.12em; color:var(--muted); font-weight:800}
.bagg .v{font-family:"Secular One",sans-serif; font-size:26px; direction:ltr; letter-spacing:.03em}
.bench{border:1px dashed var(--line2); background:repeating-linear-gradient(135deg,
  rgba(255,255,255,.018) 0 6px, rgba(0,0,0,0) 6px 12px), var(--panel);
  padding:12px 11px; display:flex; flex-direction:column; gap:10px}
.bench .seed{font-size:10px; letter-spacing:.14em; color:var(--muted); font-weight:800}
.bench .one{display:flex; align-items:center; gap:8px; opacity:.62}
.bench .one .pface{filter:grayscale(1)}
.bench .note2{font-size:11px; color:var(--muted); line-height:1.45; margin-top:auto}
@media (max-width:880px){
  .bracket{grid-template-columns:1fr}
  .bracket::before{display:none}
}

/* ---------- final ---------- */
.finalbox{border:1px solid var(--gold); background:linear-gradient(140deg,#181203,#0D0F14 65%); padding:16px 18px;
  display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; justify-content:space-between;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.finalbox .ttl{font-family:"Secular One",sans-serif; font-size:17px; color:var(--gold)}
.finalbox .who{display:flex; gap:18px; flex-wrap:wrap; align-items:center}
.tag{font-size:11.5px; font-weight:700; color:var(--gold); border:1px solid var(--gold-dim); padding:3px 11px}
.duel{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center}
.duelside{border:1px solid var(--line2); background:var(--panel2); padding:13px 15px; display:flex;
  flex-direction:column; gap:8px; cursor:pointer; transition:.15s}
.duelside:hover{border-color:var(--gold)}
.duelside[aria-pressed="true"]{border-color:var(--gold); background:#161104}
.duelside .cap{font-size:11px; letter-spacing:.12em; color:var(--muted); font-weight:700}

/* ---------- tournament standings: fits the page, never scrolls sideways ---------- */
.sttbl{min-width:0; width:100%; table-layout:auto; font-size:13.5px}
.sttbl th,.sttbl td{padding:8px 7px}
.sttbl td.rank{width:1%; text-align:center; padding-inline:7px}
.sttbl .c-num,.sttbl th.c-num{text-align:center}
.sttbl .crown{color:var(--gold); font-size:11px; margin-inline-start:3px}
.sttbl tr.qual td.rank{color:var(--gold)}
.sttbl .who{display:flex; align-items:center; gap:4px}
.stlegend{display:flex; flex-wrap:wrap; gap:5px 16px; font-size:11.5px; color:var(--muted); padding-top:9px}
.stlegend b{color:var(--ink2); font-weight:700}
@media (max-width:600px){
  .sttbl .cn{display:none}
  .sttbl th,.sttbl td{padding:7px 4px; font-size:12.5px}
  .sttbl td.rank{padding-inline:5px}
}

/* ---------- charts ---------- */
.chart-card{background:var(--panel); border:1px solid var(--line); padding:14px 12px 8px}
svg.chart{display:block; width:100%; height:auto}
.legend{display:flex; flex-wrap:wrap; gap:6px 15px; padding:10px 4px 2px; font-size:12px; font-weight:600; color:var(--ink2)}
.legend .li{display:inline-flex; align-items:center; gap:6px}
.tip{position:fixed; z-index:80; pointer-events:none; background:#0B1119; border:1px solid var(--line2);
  padding:9px 11px; font-size:12.5px; box-shadow:0 12px 34px rgba(0,0,0,.65); max-width:250px; line-height:1.45}
.tip .th{font-weight:800; margin-bottom:4px; color:var(--gold)}
.tip .tr{display:flex; gap:12px; justify-content:space-between}

/* ---------- places bars ---------- */
.dist{display:flex; flex-direction:column; gap:7px}
.dist-row{display:grid; grid-template-columns:66px 1fr; align-items:center; gap:10px}
.dist-bar{display:flex; height:23px; gap:2px; background:var(--panel3)}
.dist-seg{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; min-width:2px}

/* ---------- history strip ---------- */
.hstrip{display:flex; flex-wrap:wrap; gap:3px}
.cell{width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800}
.cell.miss{background:var(--panel3); color:var(--muted); opacity:.5}
.cell.win{box-shadow:0 0 0 2px var(--gold)}

/* ---------- tournament picker ---------- */
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(50px,1fr)); gap:5px}
.tbtn{border:1px solid var(--line); background:var(--panel); padding:6px 2px 5px; display:flex;
  flex-direction:column; align-items:center; gap:4px; font-weight:800; font-size:13px; transition:.12s}
.tbtn:hover{border-color:var(--muted)}
.tbtn[aria-pressed="true"]{background:var(--gold); color:var(--pitch); border-color:var(--gold)}
.tbtn .duo{display:flex; gap:2px}
.tbtn .duo i{width:7px; height:7px}
.tbtn.new{border-color:var(--p2)}
.nav-pair{display:flex; gap:6px}

/* ---------- misc ---------- */
.recs{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:10px}
.rec{background:var(--panel); border:1px solid var(--line); padding:13px 15px; display:flex; flex-direction:column; gap:5px}
.rec .v{font-family:"Secular One",sans-serif; font-size:22px; line-height:1.15}
.rec .d{font-size:12.5px; color:var(--ink2); display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.matrix td.cellv{text-align:center; font-weight:800; width:66px}
.matrix td.self{background:var(--panel3); color:var(--muted)}
.ramp-key{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); font-weight:600}
.ramp-key i{width:24px; height:11px; display:inline-block}
.cols2{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:16px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:8px; flex:1 1 400px}
.kpi{background:var(--panel2); border:1px solid var(--line); padding:8px 11px}
.kpi .v{font-size:20px; font-weight:800; line-height:1.2}
.prof-head{display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between;
  padding:15px 16px; border:1px solid var(--line); background:var(--panel)}
.prof-name{font-family:"Secular One",sans-serif; font-size:26px; line-height:1.1; display:flex; align-items:center; gap:10px}
.prof-name i{width:15px; height:15px; background:var(--c); flex:none; transform:skewX(-14deg)}
.notice{border:1px solid var(--line2); background:var(--panel2); padding:10px 14px; font-size:13px; color:var(--ink2);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.notice b{color:var(--ink)}
.notice.warn{border-color:#4A3A12; background:#150F03}
.errbar{position:fixed; inset-inline:10px; bottom:10px; z-index:120; background:#2A1212;
  border:1px solid #7A3030; color:#FFD9D9; padding:10px 13px; font-size:12.5px; line-height:1.5;
  display:flex; gap:10px; align-items:flex-start; box-shadow:0 14px 40px rgba(0,0,0,.7);
  max-width:640px; margin-inline:auto}
.errbar code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; word-break:break-word}
.errbar .x{margin-inline-start:auto; color:#FFD9D9; font-weight:800}

footer{border-top:1px solid var(--line); padding-block:22px 6px; color:var(--muted); font-size:12px; line-height:1.6}

@media (max-width:660px){
  .mrow{grid-template-columns:18px 1fr auto 1fr; gap:6px; padding:8px 8px}
  .mrow .club{font-size:11px}
  .pface{width:18px; height:18px}
  .score{font-size:15px; padding:2px 7px; min-width:62px}
  th,td{padding:8px 9px; font-size:13.5px}
  .dist-row{grid-template-columns:54px 1fr}
  .cell{width:18px; height:18px; font-size:10px}
  .deck{grid-template-columns:repeat(auto-fit,minmax(142px,1fr)); gap:10px}
  .duel{grid-template-columns:1fr; }
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ==========================================================================
   THE SCORES-APP LOOK — layered over everything above
   --------------------------------------------------------------------------
   A quiet dark surface, rounded cards, one blue accent for "selected", grey
   pills for secondary numbers, and plain sans-serif type. Gold stays only
   where it means something: trophies and champions.
   ========================================================================== */
:root{
  --pitch:#0E1218; --panel:#1B2129; --panel2:#222931; --panel3:#2A313A;
  --line:#12171D; --line2:#2E3640;
  --ink:#FFFFFF; --ink2:#AAB3BF; --muted:#7D8896;
  --blue:#3D7EF5; --blue-dim:#1E3A6B;
  --cut:0px; --r:14px;
}
body{background:var(--pitch); font-family:"Heebo","Segoe UI",system-ui,sans-serif}
h1,h2,h3,.disp,.bhead h2,.stat .v{font-family:"Heebo","Segoe UI",system-ui,sans-serif}
.bhead h2{font-size:17px; font-weight:700; letter-spacing:0}
.bhead .note{color:var(--muted)}
.lbl{letter-spacing:.04em; font-weight:600}

/* ---------- top bar ---------- */
.appbar{position:sticky; top:0; z-index:50; background:#151B22; box-shadow:0 1px 0 #0B0F14}
.appbar-in{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px 6px}
.appbar .mark{display:flex; align-items:center; gap:10px}
.appbar .mark .glyph{width:34px; height:34px; font-size:15px}
.appbar .mark h1{font-size:18px; font-weight:800}
.appbar .mark .sub{font-size:11px; letter-spacing:.02em; color:var(--muted); font-weight:500; margin-top:1px}
.appbar .seasonbar .lbl{display:none}
.appbar .seasonbar select{background:var(--panel2); border:0; border-radius:999px; padding:7px 14px;
  font-size:13px; font-weight:600; color:var(--ink)}

/* ---------- the current section's tabs ---------- */
.subtabs{background:#151B22}
.subtabs-in{display:flex; overflow-x:auto; scrollbar-width:none}
.subtabs-in::-webkit-scrollbar{display:none}
.stab{flex:1 0 auto; padding:11px 16px 10px; font-size:16px; font-weight:600; color:var(--muted);
  border-bottom:3px solid transparent; white-space:nowrap; transition:color .15s, border-color .15s}
.stab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--blue)}

/* ---------- one screen at a time ---------- */
main{padding-block:16px calc(92px + env(safe-area-inset-bottom))}
.view{gap:18px}
footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ---------- the four sections ---------- */
.bottomnav{position:fixed; bottom:0; inset-inline:0; z-index:60; background:#1A2027;
  border-top:1px solid #232A33; padding-bottom:env(safe-area-inset-bottom)}
.bottomnav-in{display:grid; grid-template-columns:repeat(4,1fr); max-width:680px; margin-inline:auto}
.navbtn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0 8px;
  color:#8A94A3; font-size:12px; font-weight:500}
.navbtn .ico{position:relative; height:26px; display:grid; place-items:center}
.navbtn svg{width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.navbtn .ico-score{font-size:19px; font-weight:800; letter-spacing:.02em; direction:ltr}
.navbtn[aria-selected="true"]{color:var(--ink)}
.navbtn[aria-selected="true"] .nl{font-weight:800}
.navbtn .badge{position:absolute; top:-5px; inset-inline-end:-12px; min-width:17px; height:17px; padding:0 5px;
  border-radius:999px; background:var(--blue); color:#fff; font-size:10.5px; font-weight:800;
  display:grid; place-items:center; line-height:1}

/* ---------- surfaces: rounded, no cut corners ---------- */
.panel,.tscroll,.rec,.notice,.stat,.chart-card,.award,.rivside,.modalcard,.peakcard,.tlmatch,.meet,.fcverdict{
  border-radius:var(--r); clip-path:none}
.tscroll{border:0; background:var(--panel)}
.strip4{border-radius:var(--r); overflow:hidden; background:var(--line)}
.rec{background:var(--panel); border:0}
.panel{border:0}
.notice{border:0}

/* ---------- buttons, chips, pills ---------- */
.btn{background:var(--blue); color:#fff; border-radius:999px; clip-path:none; font-weight:700}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--blue); color:#fff}
.chip{border-radius:999px; clip-path:none}
.chip[aria-pressed="true"]{background:var(--blue); color:#fff; border-color:var(--blue)}

/* ---------- tournament picker, like a date strip ---------- */
.picker{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.picker::-webkit-scrollbar{display:none}
.pick{flex:none; padding:7px 15px; border-radius:999px; background:var(--panel); color:var(--ink2);
  font-size:13.5px; font-weight:600}
.pick[aria-pressed="true"]{background:var(--blue); color:#fff}

/* ---------- tables, 365 style ---------- */
table th{color:var(--muted); font-weight:600; background:transparent}
table tbody tr{border-top:2px solid var(--line)}
table tbody tr:hover{background:var(--panel2)}

/* ---------- the latest champions, at the top of the summary ---------- */
.reigncard{background:linear-gradient(180deg,#1E1A0E,#16140D); border-radius:var(--r); padding:14px 16px}
.reigncard .lbl{color:var(--gold)}
.reigncard .row{display:flex; gap:22px; margin-top:10px; flex-wrap:wrap}
.reigncard .champ{display:flex; flex-direction:column; gap:4px}
.block.empty{background:var(--panel); border-radius:var(--r); padding:18px}

/* ---------- the league strip over the fixtures ---------- */
.leaguehead{display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:var(--r) var(--r) 0 0;
  padding:12px 16px; margin-bottom:-18px; font-weight:700; font-size:15px}
.leaguehead .lg-ico{font-size:17px}
.leaguehead .lg-name{flex:1}
.leaguehead .lg-count{font-size:12.5px; font-weight:500; color:var(--muted)}
#v-live .leaguehead + section.block .panel.matches{border-top-left-radius:0; border-top-right-radius:0}

/* ---------- match cards ---------- */
.panel.matches{background:var(--panel); overflow:hidden}
.panel.matches .oddskey{display:none}                  /* 1 · X · 2 says it */
.fixture{position:relative; border-bottom:2px solid var(--line); background:none !important; padding-top:24px}
.fixture .mrow{grid-template-columns:1fr auto 1fr; gap:10px; padding:4px 16px 10px}
.fixture .mrow .mn{position:absolute; top:7px; inset-inline:0; text-align:center; font-size:12px;
  font-weight:500; color:var(--muted)}
.fixture.played .mrow .mn::after{content:" · הסתיים"}
.side .duo{flex-direction:column; gap:6px}
.side .plate{font-size:15px; font-weight:600}
.side.tap{cursor:pointer; border-radius:10px}
.side.tap:active{background:var(--panel2)}
.entry{gap:6px}
.entry input{width:46px; height:44px; border:0; border-radius:10px; background:var(--pitch);
  color:var(--ink); font-size:24px; font-weight:300; text-align:center}
.entry input.filled{background:transparent; border:0; font-weight:400}
.entry .mut{font-size:20px; font-weight:300}
.rowsave{width:32px; height:32px; border-radius:50%; background:var(--panel2); border:0; font-size:13px}
.rowsave:hover{color:#fff; background:var(--blue)}
.score{font-family:"Heebo",sans-serif; font-size:26px; font-weight:300; background:none; border:0; padding:0 6px}
.side.fade{opacity:.55}

/* 1 · X · 2 pills instead of the coloured bar */
.odds{padding:0 16px 14px}
.odds .cap{display:none}
.oddsbar{display:flex; gap:10px; height:auto; background:none}
.oddsbar i{flex:1 !important; height:34px; border-radius:999px; background:var(--pitch) !important;
  color:var(--ink) !important; font-size:14px; font-weight:500; font-style:normal; direction:ltr}
.oddsbar .oh::before{content:"1 · "; color:var(--muted)}
.oddsbar .od::before{content:"X · "; color:var(--muted)}
.oddsbar .oa::before{content:"2 · "; color:var(--muted)}

/* saved + clear, quietly */
.doneline{justify-content:center; padding:0 16px 12px; gap:12px}
.doneline .ok{font-weight:600; font-size:12px}
.doneline .grow{display:none}
.doneline .btn.sm{padding:4px 12px; font-size:12px}
.gravity{border-top:0; border-radius:10px; margin:0 12px 12px; width:auto}

/* ---------- the match page ---------- */
.mpage{position:fixed; inset:0; z-index:90; background:var(--pitch); overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom)}
.mp-top{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:10px 8px 0;
  background:linear-gradient(180deg,#1D2A3E 0%,#141C28 100%)}
.mp-title{text-align:center; font-size:14px; font-weight:600; line-height:1.4}
.mp-back{font-size:24px; color:var(--ink); height:44px}
.mp-teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; padding:18px 14px 20px;
  background:linear-gradient(180deg,#141C28 0%,#101620 100%)}
.mp-side{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.mp-faces{display:flex; gap:6px}
.mp-face{display:inline-flex}
.mp-face .pface{width:46px; height:46px}
.mp-face .dot{width:30px; height:30px; border-radius:50%}
.mp-names{font-weight:700; font-size:15px}
.mp-mid{text-align:center}
.mp-score{font-size:40px; font-weight:400; letter-spacing:.02em}
.mp-tabs{display:flex; background:#101620; border-bottom:1px solid #1C2530; position:sticky; top:0; z-index:2}
.mp-tabs .stab{flex:1}
.mp-body{padding:16px; display:flex; flex-direction:column; gap:12px; max-width:760px; margin-inline:auto}
.mp-pills{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.mp-pill{display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px; border-radius:var(--r);
  background:var(--panel); font-size:22px; font-weight:400}
.mp-pill b{font-size:12px; color:var(--muted); font-weight:700}
.mp-pill small{font-size:11.5px; color:var(--muted); text-align:center}
.mp-why{padding:14px 16px; font-size:13px; line-height:1.7}
.mp-why .th{font-weight:700; margin-bottom:6px}
.mp-why table{margin:6px 0 10px}
.mp-why .hint{color:var(--ink2)}
.mp-list{overflow:hidden}
.mp-row{display:flex; justify-content:space-between; padding:11px 16px; border-bottom:2px solid var(--line); font-size:14px}
.mp-row:last-child{border-bottom:0}
.mp-row.w .ltr{color:var(--pos)} .mp-row.l .ltr{color:var(--neg)}
tr.hl{background:#1E2A3C !important; box-shadow:inset -3px 0 0 var(--blue)}
/* ---------- news, 365 style ---------- */
.nfeed{display:flex; flex-direction:column; gap:10px; max-width:760px; width:100%; margin-inline:auto}
.nbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 2px 4px; font-size:14px}
.nbar .mut{font-size:12px}
.ncard{display:grid; grid-template-columns:112px 1fr; gap:12px; align-items:stretch; text-align:start;
  background:var(--panel); border-radius:var(--r); padding:10px; color:var(--ink); width:100%;
  font:inherit; cursor:pointer; overflow:hidden; border:0}
.ncard:active{filter:brightness(1.15)}
.ncard.lead{grid-template-columns:1fr; padding:0; gap:0}
.ncard.lead .ntext{padding:12px 14px 14px}
.nart{position:relative; border-radius:10px; min-height:84px; overflow:hidden;
  background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--c0) 70%,transparent),transparent 60%),
             radial-gradient(90% 90% at 10% 100%,color-mix(in srgb,var(--c1) 55%,transparent),transparent 65%),#141A22;
  display:flex; align-items:center; justify-content:center}
.nart.big{border-radius:0; aspect-ratio:16/8; min-height:0}
.nfaces{display:flex}
.nface{width:44px; height:44px; border-radius:50%; border:2px solid var(--c); background:#0E1218;
  display:inline-flex; align-items:center; justify-content:center; margin-inline-start:-10px;
  box-shadow:0 4px 12px rgba(0,0,0,.45); overflow:hidden}
.nface:first-child{margin-inline-start:0}
.nface .pface{width:100%; height:100%}
.nface b{font-size:18px}
.nart.big .nface{width:78px; height:78px; border-width:3px; margin-inline-start:-16px}
.nart.big .nface:first-child{margin-inline-start:0}
.nart.big .nface b{font-size:30px}
.nicon{position:absolute; bottom:6px; inset-inline-end:8px; font-size:16px;
  background:rgba(0,0,0,.45); border-radius:999px; padding:2px 6px; line-height:1.3}
.nart.big .nicon{font-size:20px; bottom:10px; inset-inline-end:12px}
.ntext{display:flex; flex-direction:column; gap:4px; min-width:0}
.nmeta{font-size:12px; color:#8A94A3}
.ntag{color:var(--blue); font-weight:700}
.ncard .nhead{font-weight:700; font-size:15px; line-height:1.35}
.ncard.lead .nhead{font-size:20px}
.nsnip{font-size:13px; line-height:1.45; color:#9AA4B2; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden}
.ncard:not(.lead) .nsnip{-webkit-line-clamp:1}
.nstory{padding:16px; display:flex; flex-direction:column; gap:12px; max-width:760px; margin-inline:auto}
.nstory .nhead{font-size:22px; line-height:1.3; font-weight:800}
.nstory .sbody{display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.6}
.nstory .btn{align-self:flex-start}
/* ---------- draw luck ---------- */
.dluck{display:flex; flex-direction:column; gap:8px}
.dl-row{background:#141A22; border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:3px}
.dl-top{display:grid; grid-template-columns:18px 1fr auto; gap:8px; align-items:center}
.dl-top .qval{font-weight:800}
.dl-top .qval.up{color:#3DDC84}
.dl-top .qval.down{color:#FF6B6B}
.dl-sub{font-size:12.5px; color:#9AA4B2; padding-inline-start:26px; line-height:1.5}
/* chemistry rows on a phone: names and the number on top, the bar under them.
   Their fixed column minimums added up wider than the screen and pushed the
   whole page sideways (the rivalry card looked shrunk). */
@media (max-width:560px){
  .chemrow{grid-template-columns:1fr auto; grid-template-areas:"who val" "bar note"; row-gap:6px; column-gap:10px}
  .chemrow .who{grid-area:who; min-width:0}
  .chemrow .cbar{grid-area:bar}
  .chemrow .cval{grid-area:val}
  .chemrow .cnote{grid-area:note}
}
/* a safety net: whatever overflows inside a screen is clipped there, never
   widening the page (clip, not hidden, so the sticky bars keep working) */
main.wrap, .view{overflow-x:clip; max-width:100%}
/* ---------- the intro ---------- */
.intro{position:fixed; inset:0; z-index:200; overflow:hidden; background:radial-gradient(120% 70% at 50% 110%,#123A22 0%,#0A1A12 45%,#05080C 100%);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  animation:i-leave .35s ease 3.75s forwards}
.intro.i-out{animation:i-leave .35s ease forwards}
@keyframes i-leave{to{opacity:0; visibility:hidden; pointer-events:none}}
.i-beam{position:absolute; top:-20%; width:70vmax; height:140vmax; transform-origin:50% 0;
  background:linear-gradient(180deg,rgba(255,255,240,.16),rgba(255,255,240,0) 65%); filter:blur(22px); opacity:0;
  animation:i-beam 2.2s ease-out forwards}
.i-b1{left:-30vmax; --r0:-38deg; --r1:-22deg} .i-b2{right:-30vmax; --r0:38deg; --r1:22deg; animation-delay:.12s}
@keyframes i-beam{0%{opacity:0; transform:rotate(var(--r0))} 25%{opacity:1} 100%{opacity:.75; transform:rotate(var(--r1))}}
.i-pitch{position:absolute; left:50%; bottom:-6%; width:180vmax; height:60vmax; transform:translateX(-50%) perspective(600px) rotateX(62deg);
  background:repeating-linear-gradient(90deg,#15502C 0 9vmax,#124726 9vmax 18vmax); opacity:.9}
.i-line{position:absolute; left:50%; top:0; bottom:0; width:3px; background:rgba(255,255,255,.55); transform:translateX(-50%)}
.i-circle{position:absolute; left:50%; top:50%; width:24vmax; height:24vmax; border:3px solid rgba(255,255,255,.55); border-radius:50%; transform:translate(-50%,-50%)}
.i-roll{position:absolute; left:50%; top:76%; width:92px; height:92px; margin:-46px 0 0 -46px;
  animation:i-roll .7s cubic-bezier(.2,.7,.3,1) .15s both, i-shoot .4s cubic-bezier(.5,0,.9,.4) .85s forwards}
@keyframes i-roll{from{transform:translateX(75vw)} to{transform:translateX(0)}}
@keyframes i-shoot{0%{transform:translate(0,0) scale(1); opacity:1} 100%{transform:translate(0,-34vh) scale(9); opacity:0}}
.i-ball{width:100%; height:100%; animation:i-spin .7s linear .15s both; filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
@keyframes i-spin{from{transform:rotate(0)} to{transform:rotate(-720deg)}}
.ib-svg{width:100%; height:100%; display:block}
.i-flash{position:absolute; inset:0; background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(255,255,255,0) 55%);
  opacity:0; animation:i-flash .45s ease-out 1.1s}
@keyframes i-flash{0%{opacity:0} 25%{opacity:1} 100%{opacity:0}}
.i-title{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; transform:scale(.6); animation:i-pop .55s cubic-bezier(.2,1.6,.4,1) 1.15s forwards}
@keyframes i-pop{to{opacity:1; transform:scale(1)}}
.i-badge{width:66px; height:66px; display:grid; place-items:center; font-size:34px;
  background:linear-gradient(135deg,var(--gold),var(--gold2)); clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  box-shadow:0 0 30px rgba(245,197,66,.5)}
.i-name{font-family:"Secular One","Heebo",sans-serif; font-size:42px; line-height:1; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.7)}
.i-six{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; font-size:13px; font-weight:700; max-width:320px}
.i-six span{color:var(--c); opacity:0; animation:i-in .3s ease forwards}
.i-six span:nth-child(1){animation-delay:1.45s} .i-six span:nth-child(2){animation-delay:1.52s}
.i-six span:nth-child(3){animation-delay:1.59s} .i-six span:nth-child(4){animation-delay:1.66s}
.i-six span:nth-child(5){animation-delay:1.73s} .i-six span:nth-child(6){animation-delay:1.8s}
@keyframes i-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
/* motion kept to a minimum: just the name, briefly */
@media (prefers-reduced-motion:reduce){
  .intro{animation:i-leave .3s ease 1.1s forwards !important}
  .i-roll,.i-flash,.i-beam{display:none}
  .i-title,.i-six span{animation:none !important; opacity:1; transform:none}
}
/* ---------- the standings, dressed up ---------- */
.lt{display:flex; flex-direction:column; gap:6px}
.lt-top{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; color:#9AA4B2; padding:0 2px 4px}
.lt-prog{flex:0 0 38%; height:5px; border-radius:99px; background:#222A35; overflow:hidden}
.lt-prog i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--blue),#7FB0FF)}
.lt-head,.lt-row{display:grid; grid-template-columns:34px 40px minmax(0,1fr) 28px 38px 38px; align-items:center; column-gap:8px}
.lt-head{font-size:11px; color:#7D8795; font-weight:700; padding:0 12px 2px}
.lt-head span:nth-child(n+4){text-align:center}
.lt-row{position:relative; background:linear-gradient(180deg,#1E252F,#191F28); border-radius:14px; padding:10px 12px;
  border-inline-start:4px solid transparent; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 16px rgba(0,0,0,.25);
  animation:lt-in .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes lt-in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.lt-row.z12{border-inline-start-color:var(--gold)}
.lt-row.z34{border-inline-start-color:var(--blue)}
.lt-row.lead{background:linear-gradient(100deg,rgba(245,197,66,.16),rgba(245,197,66,.03) 55%),linear-gradient(180deg,#222A33,#1A2029);
  box-shadow:0 0 0 1px rgba(245,197,66,.35) inset, 0 8px 24px rgba(245,197,66,.08)}
.lt-row.hl{box-shadow:0 0 0 2px var(--c) inset}
.lt-pos{display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1}
.lt-pos b{font-size:17px; font-weight:800}
.lt-row.z12 .lt-pos b{color:var(--gold)} .lt-row.z34 .lt-pos b{color:#8DB5FF}
.mv{font-style:normal; font-size:9.5px; font-weight:800}
.mv.up{color:var(--pos)} .mv.dn{color:var(--neg)} .mv.eq{color:#5C6673}
.lt-face{width:40px; height:40px; border-radius:50%; border:2px solid var(--c); display:grid; place-items:center;
  background:#0E1218; overflow:hidden; box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.lt-face .pface{width:100%; height:100%}
.lt-face b{font-size:17px; color:var(--c)}
.lt-main{min-width:0; display:flex; flex-direction:column; gap:3px}
.lt-name{font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:5px}
.lt-crown{font-size:13px}
.lt-sub{display:flex; align-items:center; gap:8px; font-size:11.5px; color:#9AA4B2; flex-wrap:wrap}
.lt-sub .club{font-size:11.5px}
.lt-rec{color:#7D8795}
.lt-form{display:flex; gap:3px}
.lt-form i{font-style:normal; width:17px; height:17px; border-radius:50%; display:grid; place-items:center;
  font-size:9.5px; font-weight:800; color:#0B0F14}
.lt-form .f-w{background:#3DDC84} .lt-form .f-d{background:#8A94A3} .lt-form .f-l{background:#FF6B6B}
.lt-n{text-align:center; font-size:13.5px; color:#C9D1DB; font-variant-numeric:tabular-nums}
.lt-n.pos{color:var(--pos)} .lt-n.neg{color:var(--neg)}
.lt-pts{text-align:center; font-size:20px; font-weight:900; font-variant-numeric:tabular-nums}
.lt-row.lead .lt-pts{color:var(--gold)}
.lt-odds{grid-column:3 / -1; display:flex; align-items:center; gap:8px; margin-top:7px}
.lt-obar{flex:1; height:4px; border-radius:99px; background:#262E39; overflow:hidden}
.lt-obar i{display:block; height:100%; border-radius:99px; background:var(--c)}
.lt-oval{font-size:11px; color:#9AA4B2; white-space:nowrap}
.lt-oval b{color:#E6EBF1}
.lt-odds.done .lt-oval{color:var(--pos); font-weight:800}
.lt-cut{display:flex; align-items:center; gap:10px; margin:4px 0; color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.06em}
.lt-cut::before,.lt-cut::after{content:""; flex:1; border-top:1.5px dashed rgba(245,197,66,.55)}
.lt-legend{margin-top:4px}
.lt-key{display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px; vertical-align:-1px}
.lt-key.z12{background:var(--gold)} .lt-key.z34{background:var(--blue)}
@media (max-width:400px){
  .lt-head,.lt-row{grid-template-columns:30px 36px minmax(0,1fr) 24px 34px 34px; column-gap:6px}
  .lt-row{padding:9px 9px}
  .lt-face{width:36px; height:36px}
  .lt-rec{display:none}
}
@media (prefers-reduced-motion:reduce){ .lt-row{animation:none} }
/* ---------- a news card sent as a push (admin) ---------- */
.spush{margin-top:6px; padding:12px 14px; border-radius:14px; background:#141A22; border:1px dashed #3A4656;
  display:flex; flex-direction:column; gap:9px}
.spush-prev{display:flex; flex-direction:column; gap:3px; padding:10px 12px; border-radius:12px; background:#1F2630;
  border-inline-start:3px solid var(--blue); font-size:13px}
.spush-prev span{color:#9AA4B2}
/* ---------- table look switch + the charts look ---------- */
.ltwrap{display:flex; flex-direction:column; gap:10px}
.ltmodes{display:flex; gap:4px; padding:4px; border-radius:999px; background:#161C24; align-self:flex-start}
.ltmode{border:0; background:transparent; color:#9AA4B2; font:inherit; font-size:12.5px; font-weight:700;
  padding:6px 14px; border-radius:999px; cursor:pointer}
.ltmode.on{background:var(--blue); color:#fff}
.sttbl tr.hl td{background:rgba(61,126,245,.14)}
.ltcharts{display:flex; flex-direction:column; gap:12px}
.ltc{background:linear-gradient(180deg,#1E252F,#191F28); border-radius:14px; padding:12px 12px 10px; display:flex; flex-direction:column; gap:8px}
.ltc-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.ltc-h b{font-size:15px} .ltc-h span{font-size:11.5px; color:#9AA4B2}
.ltc-svg{direction:ltr}
.ltc-svg svg{width:100%; height:auto; display:block; overflow:visible}
.ltc-svg .gl{stroke:#2A333F; stroke-width:1}
.ltc-svg .ax{fill:#6F7A88; font-size:9.5px; font-family:inherit}
.ltc-svg .ln{fill:none; stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round}
.ltc-svg .ln.dim{opacity:.25}
.ltc-svg .lb{font-size:10.5px; font-weight:800; font-family:inherit}
.ltc-note{font-size:11px; color:#7D8795}
.ltc-row{display:grid; grid-template-columns:16px 78px 1fr 26px; gap:8px; align-items:center; font-size:13px; padding:3px 0}
.ltc-row.cut{border-bottom:1.5px dashed rgba(245,197,66,.5); padding-bottom:8px; margin-bottom:4px}
.ltc-row.hl,.ltc-grow.hl{background:rgba(61,126,245,.12); border-radius:8px}
.ltc-n{color:#7D8795; font-size:12px; text-align:center}
.ltc-bar{display:flex; height:12px; border-radius:99px; background:#262E39; overflow:hidden}
.ltc-bar i{display:block; height:100%}
.ltc-bar i.w{background:linear-gradient(90deg,#2FB86F,#3DDC84)} .ltc-bar i.d{background:#8A94A3}
.ltc-v{text-align:center; font-size:15px; font-variant-numeric:tabular-nums}
.ltc-v.pos{color:var(--pos)} .ltc-v.neg{color:var(--neg)}
.ltc-grow{display:grid; grid-template-columns:78px 1fr 32px; gap:8px; align-items:center; font-size:13px; padding:3px 0}
.ltc-dual{display:grid; grid-template-columns:1fr 1fr; gap:2px; direction:ltr}
.ltc-dual > span{position:relative; height:14px; display:flex; align-items:center}
.ltc-dual .ga{justify-content:flex-end} .ltc-dual .gf{justify-content:flex-start}
.ltc-dual i{display:block; height:100%; border-radius:4px}
.ltc-dual .ga i{background:#FF6B6B} .ltc-dual .gf i{background:#3DDC84}
.ltc-dual em{font-style:normal; font-size:10.5px; font-weight:800; color:#C9D1DB; padding:0 4px}
.ltc-dual .ga em{order:-1}
/* ---------- who am I + activity log ---------- */
.whocard{gap:12px}
.whogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0}
.whobtn{display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:14px;
  background:#1B2129; border:1px solid #2A333F; color:var(--ink); font:inherit; font-weight:700; cursor:pointer}
.whobtn:active{border-color:var(--c)}
.whoface{width:54px; height:54px; border-radius:50%; border:2px solid var(--c); overflow:hidden; display:grid; place-items:center; background:#0E1218}
.whoface .pface{width:100%; height:100%}
.whoface b{font-size:22px; color:var(--c)}
.act{display:flex; flex-direction:column; gap:10px}
.act-sum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.act-sum div{background:#1B2129; border-radius:12px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:2px}
.act-sum b{font-size:22px} .act-sum span{font-size:11.5px; color:#9AA4B2}
.act-hours{background:#1B2129; border-radius:12px; padding:10px 10px 6px}
.act-bars{display:grid; grid-template-columns:repeat(24,1fr); gap:2px; height:70px; align-items:end; direction:ltr}
.act-bars span{height:100%; display:flex; align-items:flex-end}
.act-bars i{display:block; width:100%; border-radius:3px 3px 0 0; background:linear-gradient(180deg,#7FB0FF,var(--blue))}
.act-axis{display:flex; justify-content:space-between; direction:ltr; font-size:10px; color:#6F7A88; margin-top:4px}
.act-row{background:#1B2129; border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:5px}
.act-top{display:flex; align-items:center; justify-content:space-between}
.act-n{font-size:20px}
.act-sub{font-size:12px; color:#9AA4B2}
.act-heat{display:grid; grid-template-columns:repeat(24,1fr); gap:2px; direction:ltr}
.act-heat i{height:10px; border-radius:2px; background:var(--c)}
.act-log summary{cursor:pointer; color:var(--blue); font-weight:700; font-size:13px; padding:4px 0}
.act-line{display:grid; grid-template-columns:1fr auto auto; gap:10px; font-size:12.5px; padding:5px 2px; border-bottom:1px solid #222A35}
/* ---------- predictions, reactions, poll ---------- */
.social{display:flex; flex-wrap:wrap; align-items:center; gap:8px; justify-content:space-between; margin-top:8px}
.soc-pred{border:0; background:#1F2833; color:#C9D1DB; font:inherit; font-size:12.5px; padding:6px 12px; border-radius:999px; cursor:pointer}
.soc-pred b{color:#fff}
.soc-pred.done{background:#1B2A22; color:#9FE3BD}
.soc-react{display:flex; gap:4px}
.rx{border:1px solid #2A333F; background:#161C24; border-radius:999px; font-size:14px; padding:3px 8px; cursor:pointer; display:inline-flex; gap:4px; align-items:center; color:#C9D1DB; font-family:inherit}
.rx span{font-size:11px; font-weight:800}
.rx.has{background:#1F2833}
.rx.on{border-color:var(--blue); background:rgba(61,126,245,.18)}
.pred-box{background:#1B2129; border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px}
.pred-row{display:grid; grid-template-columns:1fr 54px auto 54px 1fr; gap:8px; align-items:center}
.pred-side{font-size:12.5px; font-weight:700; text-align:center}
.pred-in{width:54px; height:48px; text-align:center; font-size:22px; font-weight:800; border-radius:12px; border:1px solid #2F3946; background:#0E1218; color:#fff}
.pred-note{font-size:11.5px}
.pred-list{display:flex; flex-direction:column; gap:6px}
.pred-line{display:grid; grid-template-columns:1fr auto 56px; gap:10px; align-items:center; background:#1B2129; border-radius:10px; padding:8px 10px}
.pred-line.exact{box-shadow:0 0 0 1px var(--gold) inset} .pred-line.hit{box-shadow:0 0 0 1px #2FB86F inset}
.pred-pts{text-align:end; font-weight:800; font-size:12.5px}
.pred-board{display:flex; flex-direction:column; gap:5px; margin-bottom:10px}
.pb-row{display:grid; grid-template-columns:18px 1fr auto 30px; gap:8px; align-items:center; background:#1B2129; border-radius:10px; padding:7px 10px; font-size:13px}
.pb-row b{font-size:17px; text-align:center} .pb-n{color:#7D8795; text-align:center}
.pollcard{background:linear-gradient(135deg,#1C2D4A,#15202F); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px}
.poll-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.poll-kicker{font-size:12px; color:#9DB7E0; font-weight:700} .poll-when{font-size:20px; font-weight:800}
.poll-count{display:flex; flex-direction:column; align-items:center; background:rgba(0,0,0,.25); border-radius:12px; padding:6px 12px}
.poll-count b{font-size:20px} .poll-count span{font-size:11px; color:#9AA4B2} .poll-count.ok b{color:#3DDC84}
.poll-faces{display:flex; flex-wrap:wrap; gap:6px} .pf-n{opacity:.4; text-decoration:line-through}
.poll-btns{display:flex; gap:8px}
.soc-pred.live{background:linear-gradient(90deg,#3D2E7A,#5B3DB8); color:#fff; box-shadow:0 0 0 1px #8E74FF inset}
.pred-timer{font-weight:800; color:#FFD36B; margin-inline-start:4px; font-variant-numeric:tabular-nums}
/* ---------- trophy cabinet, achievements, Wrapped ---------- */
.cabinet{display:flex; flex-direction:column; gap:12px}
.shelf{background:linear-gradient(180deg,#1E252F,#161B23); border-radius:14px; padding:10px 12px 0; box-shadow:0 10px 0 -4px #3A2A12 inset}
.shelf-name{font-size:12px; color:#9AA4B2; font-weight:700; margin-bottom:6px}
.cups{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:10px; border-bottom:6px solid #5A3F16; border-radius:0 0 4px 4px}
.cup{border:0; background:transparent; width:46px; display:flex; flex-direction:column; align-items:center; cursor:pointer; padding:0; color:#F5C542}
.cup svg{width:40px; height:45px; filter:drop-shadow(0 4px 6px rgba(245,197,66,.25))}
.cup-n{font-size:11px; font-weight:800; margin-top:-2px}
.achs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.ach{display:flex; gap:9px; align-items:center; background:#161B23; border-radius:12px; padding:9px 10px; opacity:.45; filter:grayscale(1)}
.ach.on{opacity:1; filter:none; background:linear-gradient(135deg,#232C39,#1A2029); box-shadow:0 0 0 1px rgba(245,197,66,.3) inset}
.ach-i{font-size:24px} .ach-t{display:flex; flex-direction:column; min-width:0}
.ach-t b{font-size:13px} .ach-t small{font-size:11px; color:#9AA4B2}
.wr-open{margin-top:10px; background:linear-gradient(90deg,#7B3FE4,#E54C7A); border:0; color:#fff}
.wrapped{position:fixed; inset:0; z-index:250; background:#000; display:flex; flex-direction:column}
.wr-bars{position:absolute; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; display:flex; gap:4px; z-index:2; direction:ltr}
.wr-bars i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden}
.wr-bars i b{display:block; height:100%; width:0; background:#fff}
.wr-bars i.done b{width:100%} .wr-bars i.now b{animation:wr-fill 4.2s linear forwards}
@keyframes wr-fill{to{width:100%}}
.wr-x{position:absolute; top:calc(22px + env(safe-area-inset-top)); left:14px; z-index:3; border:0; background:rgba(0,0,0,.35); color:#fff; width:36px; height:36px; border-radius:50%; font-size:16px}
.wr-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:24px; transition:background .5s}
.wr-card{text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; animation:wr-in .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes wr-in{from{opacity:0; transform:translateY(24px) scale(.94)} to{opacity:1; transform:none}}
.wr-k{font-size:16px; letter-spacing:.08em; color:rgba(255,255,255,.75); font-weight:700}
.wr-big{font-family:"Secular One",Heebo,sans-serif; font-size:64px; line-height:1.05; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.5)}
