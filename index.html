let curT = null;
function viewTournaments(root) {
  root.innerHTML = "";
  if (!TSS.length) { root.appendChild(emptySeason()); return; }
  if (curT == null || !TSS.some(t => t.i === curT)) curT = TSS[TSS.length - 1].i;
  const pick = el("section", "block");
  const ph = el("div", "bhead");
  ph.innerHTML = "<h2>בחירת טורניר</h2>";
  const nav = el("div", "nav-pair");
  const bPrev = el("button", "btn ghost sm", "‹ הקודם"), bNext = el("button", "btn ghost sm", "הבא ›");
  nav.append(bNext, bPrev); ph.appendChild(nav); pick.appendChild(ph);
  const grid = el("div", "tgrid");
  TSS.forEach(t => {
    const b = el("button", "tbtn" + (t.live ? " new" : ""));
    b.innerHTML = t.num + '<span class="duo">' + (t.done ? t.c.map(p => '<i style="background:' + PC(p) + '"></i>').join("") : '<i style="background:var(--line2)"></i>') + "</span>";
    b.title = t.done ? "אלופים: " + t.c.map(p => P[p]).join(" ו") : "בעיצומו";
    b.setAttribute("aria-pressed", String(t.i === curT));
    b.onclick = () => { curT = t.i; viewTournaments(root); };
    grid.appendChild(b);
  });
  pick.appendChild(grid);
  root.appendChild(pick);
  const idx = TSS.findIndex(t => t.i === curT);
  bPrev.disabled = idx <= 0; bNext.disabled = idx >= TSS.length - 1;
  bPrev.onclick = () => { curT = TSS[idx - 1].i; viewTournaments(root); };
  bNext.onclick = () => { curT = TSS[idx + 1].i; viewTournaments(root); };
  root.appendChild(tournamentDetail(TSS[idx]));
}

function tournamentDetail(t) {
  const box = el("div", "view");
  if (t.done) {
    const fin = el("div", "finalbox");
    fin.innerHTML = '<div class="ttl">אלופי טורניר ' + t.num + "</div>" +
      '<div class="who">' + t.c.map(p => '<span style="display:flex;flex-direction:column;gap:3px">' + plate(p, "lg") + clubTag(t.teamOf[p]) + "</span>").join("") + "</div>" +
      '<div class="tag">' + (t.top2 ? "צמד 1–2 ניצח בגמר" : "צמד 3–4 הפתיע בגמר") + "</div>";
    box.appendChild(fin);
    box.appendChild(shareButton(t));
  } else {
    const n = el("div", "notice warn");
    n.innerHTML = "<b>טורניר בעיצומו</b> אפשר להזין תוצאות בלשונית «חדר הבקרה».";
    box.appendChild(n);
  }
  box.appendChild(forecastBlock(t));

  const st = el("section", "block");
  st.innerHTML = '<div class="bhead"><h2>טבלת הטורניר</h2><span class="note">ארבעת הראשונים עולים לגמר: צמד 1–2 מול צמד 3–4.</span></div>';
  st.appendChild(standingsTable(t));
  box.appendChild(st);

  if (t.m.some(m => m[6] != null && m[7] != null)) box.appendChild(timelineBlock(t));

  const mb = el("section", "block");
  mb.innerHTML = '<div class="bhead"><h2>' + t.m.length + ' משחקי הליגה</h2><span class="note">בכל משחק הצמד משחק עם הקבוצה של אחד משני השחקנים.</span></div>';
  const mc = el("div", "panel matches");
  if (t.m.some(m => m[6] == null || m[7] == null)) mc.appendChild(oddsKey());
  t.m.forEach((m, idx) => {
    const [h1, h2, ht, a1, a2, at, hg, ag] = m;
    const has = hg != null && ag != null;
    const fx = el("div", "fixture");
    const row = el("div", "mrow");
    /* RTL puts the home side on the right, so the LTR score chip prints away first */
    row.innerHTML = '<div class="mn">מחזור ' + (idx + 1) + "</div>" +
      '<div class="side' + (has && ag > hg ? " fade" : "") + '"><div class="duo">' + plateFace(h1) + plateFace(h2) + "</div>" + clubTag(ht) + "</div>" +
      '<div class="score">' + (has ? ag + " – " + hg : "— – —") + "</div>" +
      '<div class="side away' + (has && hg > ag ? " fade" : "") + '"><div class="duo">' + plateFace(a1) + plateFace(a2) + "</div>" + clubTag(at) + "</div>";
    if (has) fx.classList.add("played");
    tapToOpen(row, t.i, idx);
    fx.appendChild(row);
    if (!has) { const o = oddsRow(m); if (o) fx.appendChild(o); }
    mc.appendChild(fx);
  });
  mb.appendChild(mc);
  box.appendChild(mb);
  return box;
}

/* ==========================================================================
   The match page — tap a match, get its own screen, like a scores app
   --------------------------------------------------------------------------
   The two pairs and the score on top, then three tabs: the odds (with the
   model's full reasoning), the head-to-head record of these exact two pairs,
   and the table with the four of them marked. Android's back button closes
   it, the same as the arrow.
   ========================================================================== */
function tapToOpen(row, tid, idx) {
  row.querySelectorAll(".side").forEach(sd => {
    sd.classList.add("tap");
    sd.title = "פתח את המשחק";
    sd.onclick = () => openMatch(tid, idx);
  });
}

let matchOpen = false;
addEventListener("popstate", () => { if (matchOpen) closeMatch(true); });
function closeMatch(fromHistory) {
  const pg = document.getElementById("matchPage");
  if (pg) pg.remove();
  document.body.style.overflow = "";
  if (matchOpen && !fromHistory) { matchOpen = false; history.back(); return; }
  matchOpen = false;
}

function h2hOf(pa, pb) {
  const same = (x, y) => (x[0] === y[0] && x[1] === y[1]) || (x[0] === y[1] && x[1] === y[0]);
  const games = [];
  TS.forEach(t => t.m.forEach(m => {
    if (m[6] == null || m[7] == null) return;
    const H = [m[0], m[1]], A = [m[3], m[4]];
    if (same(H, pa) && same(A, pb)) games.push({ t, gf: m[6], ga: m[7] });
    else if (same(H, pb) && same(A, pa)) games.push({ t, gf: m[7], ga: m[6] });
  }));
  const r = { g: games.length, w: 0, d: 0, l: 0, gf: 0, ga: 0, games };
  games.forEach(x => { r.gf += x.gf; r.ga += x.ga; if (x.gf > x.ga) r.w++; else if (x.gf < x.ga) r.l++; else r.d++; });
  return r;
}

function openMatch(tid, idx, tab) {
  const t = LIVE[tid] || TS.find(x => x.i === tid);
  if (!t || !t.m[idx]) return;
  const m = t.m[idx];
  const [h1, h2, ht, a1, a2, at, hg, ag] = m;
  const played = hg != null && ag != null;
  const had = !!document.getElementById("matchPage");
  const old = document.getElementById("matchPage");
  if (old) old.remove();

  const pg = el("div", "mpage");
  pg.id = "matchPage";
  const top = el("div", "mp-top");
  top.innerHTML = '<span></span><div class="mp-title"><div>טורניר ' + t.num + " · " +
    esc(seasonById(t.season).name) + '</div><div class="mut">מחזור ' + (idx + 1) + "</div></div>";
  const back = el("button", "mp-back", "←");
  back.setAttribute("aria-label", "חזרה");
  back.onclick = () => closeMatch(false);
  top.appendChild(back);
  pg.appendChild(top);

  const side = (a, b, c) => '<div class="mp-side">' +
    '<div class="mp-faces">' + [a, b].map(p => '<span class="mp-face" style="--c:' + PC(p) + '">' +
      (photoOf(p) ? '<i class="pface pf' + p + '"></i>' : '<i class="dot"></i>') + "</span>").join("") + "</div>" +
    '<div class="mp-names">' + esc(P[a]) + " ו" + esc(P[b]) + "</div>" + clubTag(c) + "</div>";
  const teams = el("div", "mp-teams");
  teams.innerHTML = side(h1, h2, ht) +
    '<div class="mp-mid"><div class="mp-score ltr">' + (played ? ag + " - " + hg : "- : -") + "</div>" +
    '<div class="mut">' + (played ? "הסתיים" : "טרם שוחק") + "</div></div>" +
    side(a1, a2, at);
  pg.appendChild(teams);

  const tabs = el("div", "mp-tabs");
  const body = el("div", "mp-body");
  const TABS = [["odds", "סיכויים"], ["pred", "ניחושים"], ["h2h", "ראש בראש"], ["table", "טבלה"]];
  const show = k => {
    tabs.querySelectorAll(".stab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.k === k)));
    body.innerHTML = "";
    if (k === "odds") {
      const f = forecast(m);
      if (!f) { body.appendChild(el("div", "mut", "אין מספיק היסטוריה לתחזית.")); return; }
      body.appendChild(el("div", "mp-pills",
        '<span class="mp-pill"><b>1</b>' + pct(f.w) + "%<small>" + esc(P[h1]) + " ו" + esc(P[h2]) + "</small></span>" +
        '<span class="mp-pill"><b>X</b>' + pct(f.d) + "%<small>תיקו</small></span>" +
        '<span class="mp-pill"><b>2</b>' + (100 - pct(f.w) - pct(f.d)) + "%<small>" + esc(P[a1]) + " ו" + esc(P[a2]) + "</small></span>"));
      if (played) body.appendChild(el("div", "mut", "הסיכויים כפי שהמודל רואה את המשחק הזה, בלי התוצאה שלו."));
      body.appendChild(el("div", "panel mp-why", oddsWhy(m, f)));
    } else if (k === "pred") {
      predTab(t, idx, body);
      if (!Social.loaded) Social.load().then(() => { if (document.getElementById("matchPage")) { body.innerHTML = ""; predTab(t, idx, body); } });
    } else if (k === "h2h") {
      const r = h2hOf([h1, h2], [a1, a2]);
      const who = esc(P[h1]) + " ו" + esc(P[h2]);
      if (!r.g) { body.appendChild(el("div", "mut", "שני הצמדים האלה עוד לא נפגשו.")); return; }
      body.appendChild(el("div", "mp-pills",
        '<span class="mp-pill"><b>נצחונות</b>' + r.w + "<small>" + who + "</small></span>" +
        '<span class="mp-pill"><b>תיקו</b>' + r.d + "<small>" + r.g + " מפגשים</small></span>" +
        '<span class="mp-pill"><b>נצחונות</b>' + r.l + "<small>" + esc(P[a1]) + " ו" + esc(P[a2]) + "</small></span>"));
      body.appendChild(el("div", "mut", "שערים: " + scoreTxt(r.gf, r.ga) + " · מנקודת המבט של " + who));
      const list = el("div", "panel mp-list");
      r.games.slice(-10).reverse().forEach(x => {
        const res = x.gf > x.ga ? "w" : x.gf < x.ga ? "l" : "d";
        list.appendChild(el("div", "mp-row " + res,
          "<span>טורניר " + x.t.num + ' <span class="mut">' + esc(seasonById(x.t.season).name) + "</span></span>" +
          '<span class="ltr">' + x.gf + " - " + x.ga + "</span>"));
      });
      body.appendChild(list);
    } else {
      body.appendChild(standingsTable(t, { hl: new Set([h1, h2, a1, a2]) }));
    }
  };
  TABS.forEach(([k, label]) => {
    const b = el("button", "stab", label);
    b.dataset.k = k;
    b.onclick = () => show(k);
    tabs.appendChild(b);
  });
  pg.append(tabs, body);
  document.body.appendChild(pg);
  document.body.style.overflow = "hidden";
  if (!had) { history.pushState({ match: 1 }, ""); matchOpen = true; }
  show(tab || "odds");
}

/* ==========================================================================
   PAIRS / TEAMS / RECORDS
   ========================================================================== */
/* ---------- the rivalry card ---------- */
let rivA = null, rivB = null;

function meetings(a, b) {
  return LOG[a].filter(e => e.opp.indexOf(b) >= 0);
}

function rivalryCard() {
  const sec = el("section", "block");
  sec.innerHTML = '<div class="bhead"><h2>כרטיס יריבות</h2>' +
    '<span class="note">שני השחקנים משני הצדדים: מה קורה כשהם יריבים, ומה קורה כשהם באותו צמד.</span></div>';
  const order = ORDER.filter(p => S[p].g);
  if (order.length < 2) { sec.appendChild(el("div", "mut", "אין עדיין מספיק משחקים.")); return sec; }
  if (order.indexOf(rivA) < 0) rivA = order[0];
  if (order.indexOf(rivB) < 0 || rivB === rivA) rivB = order.filter(p => p !== rivA)[0];

  const body = el("div");
  const pick = el("div", "rivpick");
  const mkSel = (cur, set) => {
    const s = el("select");
    order.forEach(p => { const o = el("option", "", esc(P[p])); o.value = String(p); s.appendChild(o); });
    s.value = String(cur);
    s.onchange = () => { set(Number(s.value)); draw(); };
    return s;
  };
  const swap = el("button", "btn ghost sm sw", "החלף ⇄");
  swap.onclick = () => { const x = rivA; rivA = rivB; rivB = x; draw(); };

  function draw() {
    if (rivA === rivB) rivB = order.filter(p => p !== rivA)[0];
    pick.innerHTML = "";
    pick.append(mkSel(rivA, v => { rivA = v; }), el("span", "mut", "מול"), mkSel(rivB, v => { rivB = v; }), swap);
    body.innerHTML = "";

    const a = rivA, b = rivB;
    const h = H2H[a][b], pr = PAIR[pairKey(a, b)], ch = CHEM[pairKey(a, b)];
    const met = meetings(a, b);
    const grid = el("div", "rivgrid");

    /* as opponents */
    const opp = el("div", "rivside");
    let oh = "<h4>כשהם יריבים</h4>";
    if (!h || !h.g) oh += '<div class="mut">טרם נפגשו זה מול זה.</div>';
    else {
      const wp = h.w / h.g, dp = h.dr / h.g, lp = h.l / h.g;
      oh += '<div class="rivscore">' + plate(a) + "<b>" + h.w + "</b><i>–</i><b>" + h.dr +
        "</b><i>–</i><b>" + h.l + "</b>" + plate(b) + "</div>" +
        '<div class="rivbar">' +
          '<i style="flex:' + Math.max(wp, .02) + ';background:var(--pos)"></i>' +
          '<i style="flex:' + Math.max(dp, .02) + ';background:var(--line2)"></i>' +
          '<i style="flex:' + Math.max(lp, .02) + ';background:var(--neg)"></i></div>' +
        '<div class="rivrow"><span>משחקים זה מול זה</span><b>' + h.g + "</b></div>" +
        '<div class="rivrow"><span>אחוז נצחון ל' + esc(P[a]) + "</span><b>" + Math.round(wp * 100) + "%</b></div>" +
        '<div class="rivrow"><span>שערים</span><b>' + scoreTxt(h.gf, h.ga) + "</b></div>" +
        '<div class="rivrow"><span>הפרש</span><b>' + sgn(h.gf - h.ga) + "</b></div>";
      const wins = met.filter(e => e.res === "w"), losses = met.filter(e => e.res === "l");
      /* each side's heaviest blow is the biggest margin in ITS own favour */
      const widest = (l, f) => l.length ? l.reduce((x, y) => f(y) > f(x) ? y : x) : null;
      const bw = widest(wins, e => e.gf - e.ga), bl = widest(losses, e => e.ga - e.gf);
      if (bw) oh += '<div class="rivrow"><span>הניצחון הגדול של ' + esc(P[a]) + "</span><b>" +
        scoreTxt(bw.gf, bw.ga) + ' <span class="mut">טורניר ' + bw.num + "</span></b></div>";
      if (bl) oh += '<div class="rivrow"><span>הניצחון הגדול של ' + esc(P[b]) + "</span><b>" +
        scoreTxt(bl.ga, bl.gf) + ' <span class="mut">טורניר ' + bl.num + "</span></b></div>";
    }
    opp.innerHTML = oh;
    grid.appendChild(opp);

    /* as partners */
    const tog = el("div", "rivside");
    let th = "<h4>כשהם באותו צמד</h4>";
    if (!pr || !pr.g) th += '<div class="mut">טרם שיחקו יחד.</div>';
    else {
      const wp = pr.w / pr.g, dp = pr.dr / pr.g, lp = pr.l / pr.g;
      th += '<div class="rivscore">' + plate(a) + '<span class="mut">+</span>' + plate(b) + "</div>" +
        '<div class="rivbar">' +
          '<i style="flex:' + Math.max(wp, .02) + ';background:var(--pos)"></i>' +
          '<i style="flex:' + Math.max(dp, .02) + ';background:var(--line2)"></i>' +
          '<i style="flex:' + Math.max(lp, .02) + ';background:var(--neg)"></i></div>' +
        '<div class="rivrow"><span>משחקים יחד</span><b>' + pr.g + "</b></div>" +
        '<div class="rivrow"><span>מאזן</span><b><span class="ltr">' + pr.w + "-" + pr.dr + "-" + pr.l + "</span></b></div>" +
        '<div class="rivrow"><span>נקודות למשחק</span><b>' + f2(pr.ppg) + "</b></div>" +
        '<div class="rivrow"><span>שערים</span><b>' + scoreTxt(pr.gf, pr.ga) + "</b></div>" +
        '<div class="rivrow"><span>אליפויות יחד</span><b>' + pr.titles + "</b></div>";
      if (ch) th += '<div class="rivrow"><span>כימיה</span><b class="' + (ch.d >= 0 ? "pos" : "neg") + '">' +
        sgnF2(ch.d) + ' <span class="mut">מול ' + f2(ch.exp) + " לחוד</span></b></div>";
    }
    tog.innerHTML = th;
    grid.appendChild(tog);
    body.appendChild(grid);

    /* the last meetings, newest first */
    if (met.length) {
      const rc = el("section", "block");
      rc.style.marginTop = "12px";
      rc.innerHTML = '<div class="bhead"><h2>המפגשים האחרונים</h2><span class="note">מנקודת המבט של ' +
        esc(P[a]) + ", החדש ביותר מימין.</span></div>";
      const row = el("div", "meets");
      met.slice(-12).reverse().forEach(e => {
        row.appendChild(el("div", "meet " + e.res,
          '<span class="s">' + e.gf + " – " + e.ga + "</span>" +
          "<span>טורניר " + e.num + " · משחק " + (e.mi + 1) + "</span>" +
          '<span class="mut">עם ' + esc(P[e.mate]) + "</span>"));
      });
      rc.appendChild(row);
      body.appendChild(rc);
    }
  }
  draw();
  sec.append(pick, body);
  return sec;
}

/* ---------- chemistry ---------- */
function chemistryBlock() {
  const sec = el("section", "block");
  sec.innerHTML = '<div class="bhead"><h2>כימיה בין שחקנים</h2>' +
    '<span class="note">נקודות למשחק של הצמד, מול מה ששני אותם שחקנים מביאים כשהם <b>לא</b> יחד. ' +
    'ההפרש הוא הכימיה. ★ מסמן הפרש גדול מהרעש הסטטיסטי.</span></div>';
  const rows = Object.keys(CHEM).map(k => CHEM[k]).filter(c => c.g).sort((x, y) => y.d - x.d);
  if (!rows.length) { sec.appendChild(el("div", "mut", "אין עדיין מספיק משחקים.")); return sec; }
  const scale = Math.max(0.1, ...rows.map(c => Math.abs(c.d)));
  const host = el("div");
  rows.forEach(c => {
    const w = Math.round(100 * Math.abs(c.d) / scale / 2);
    const r = el("div", "chemrow");
    r.innerHTML =
      '<span class="who">' + plate(c.a) + '<span class="mut">+</span>' + plate(c.b) + "</span>" +
      '<span class="cbar"><span class="mid"></span>' +
        (c.d >= 0 ? '<i class="up" style="width:' + w + '%"></i>'
                  : '<i class="dn" style="width:' + w + '%"></i>') + "</span>" +
      '<span class="cval ' + (c.d >= 0 ? "up" : "dn") + '">' + sgnF2(c.d) + (c.solid ? " ★" : "") + "</span>" +
      '<span class="cnote"><span class="ltr">' + f2(c.act) + " / " + f2(c.exp) + "</span></span>";
    r.title = P[c.a] + " + " + P[c.b] + ": " + f2(c.act) + " נק׳ למשחק יחד, " +
      f2(c.exp) + " לחוד, מתוך " + c.g + " משחקים משותפים";
    host.appendChild(r);
  });
  sec.appendChild(host);
  sec.appendChild(el("div", "stlegend",
    '<span>העמודה הימנית: <b>יחד / לחוד</b></span>' +
    '<span><b style="color:var(--pos)">ירוק</b> הצמד טוב מסכום חלקיו</span>' +
    '<span><b style="color:var(--neg)">אדום</b> הצמד פחות מסכום חלקיו</span>'));
  return sec;
}

/* ---------- pair against pair ---------- */
function duelBlock() {
  const sec = el("section", "block");
  sec.innerHTML = '<div class="bhead"><h2>צמד מול צמד</h2>' +
    '<span class="note">כל אחד מ־45 העימותים האפשריים בין שני צמדים. המאזן נכתב מצד הצמד המוביל.</span></div>';
  const seen = {}, rows = [];
  Object.keys(DUEL).forEach(k => {
    const d = DUEL[k];
    const un = [d.x, d.y].slice().sort().join("~");
    if (seen[un]) return;
    seen[un] = 1;
    /* read it from whichever side is ahead, so the table scans quickly */
    const o = DUEL[d.y + "|" + d.x];
    const lead = (d.w > d.l || (d.w === d.l && d.gf >= d.ga)) ? d : o;
    const ids = s => s.split("-").map(Number);
    rows.push({ x: ids(lead.x), y: ids(lead.y), g: lead.g, w: lead.w, dr: lead.dr, l: lead.l,
                gf: lead.gf, ga: lead.ga, pts: lead.w * 3 + lead.dr });
  });
  if (!rows.length) { sec.appendChild(el("div", "mut", "אין עדיין מספיק משחקים.")); return sec; }
  const duo = q => plate(q[0]) + '<span class="mut">+</span>' + plate(q[1]);
  makeTable(sec, [
    { label: "#", key: "rk", sortable: false, cls: () => "rank", val: () => "", render: (r, i) => i + 1 },
    { label: "צמד", key: "n", val: r => P[r.x[0]] + P[r.x[1]], render: r => duo(r.x) },
    { label: "יריב", key: "n2", val: r => P[r.y[0]] + P[r.y[1]], render: r => duo(r.y) },
    { label: "מפגשים", key: "g", val: r => r.g },
    { label: "נצ׳", key: "w", val: r => r.w },
    { label: "תיקו", key: "dr", val: r => r.dr },
    { label: "הפ׳", key: "l", val: r => r.l },
    { label: "אחוז נצחון", key: "pc", val: r => r.w / r.g, cls: () => "strong",
      render: r => Math.round(100 * r.w / r.g) + "%" },
    { label: "שערים", key: "gd", val: r => r.gf - r.ga,
      cls: r => (r.gf - r.ga) > 0 ? "pos" : (r.gf - r.ga) < 0 ? "neg" : "",
      render: r => scoreTxt(r.gf, r.ga) },
    { label: "נק׳/מפגש", key: "ppg", val: r => r.pts / r.g, render: r => f2(r.pts / r.g) }
  ], rows, { sort: "pc" });
  return sec;
}

function viewPairs(root) {
  root.innerHTML = "";
  const list = Object.values(PAIR).sort((a, b) => b.ppg - a.ppg);
  if (!list.length) { root.appendChild(emptySeason()); return; }
  root.appendChild(rivalryCard());
  root.appendChild(chemistryBlock());
  const b1 = el("section", "block");
  b1.innerHTML = '<div class="bhead"><h2>כל הצמדים</h2><span class="note">הרכב הזוגות מתחלף בכל משחק, כך שכל אחד מ־15 הצמדים האפשריים שיחק יחד עשרות פעמים.</span></div>';
  makeTable(b1, [
    { label: "#", key: "rk", sortable: false, cls: () => "rank", val: () => "", render: (r, i) => i + 1 },
    { label: "צמד", key: "n", val: r => P[r.a] + P[r.b], render: r => plate(r.a) + ' <span class="mut">+</span> ' + plate(r.b) },
    { label: "משחקים", key: "g", val: r => r.g },
    { label: "נצ׳", key: "w", val: r => r.w },
    { label: "תיקו", key: "dr", val: r => r.dr },
    { label: "הפ׳", key: "l", val: r => r.l },
    { label: "זכות", key: "gf", val: r => r.gf },
    { label: "חובה", key: "ga", val: r => r.ga },
    { label: "הפרש", key: "gd", val: r => r.gd, cls: r => r.gd > 0 ? "pos" : r.gd < 0 ? "neg" : "", render: r => sgn(r.gd) },
    { label: "נקודות", key: "pts", val: r => r.pts },
    { label: "נק׳/משחק", key: "ppg", val: r => r.ppg, cls: () => "strong", render: r => f2(r.ppg) },
    { label: "אליפויות יחד", key: "t", val: r => r.titles, render: r => r.titles ? '<span class="g">' + r.titles + "</span>" : '<span class="mut">0</span>' }
  ], list, { sort: "ppg" });
  root.appendChild(b1);
  root.appendChild(duelBlock());

  const b2 = el("section", "block");
  b2.innerHTML = '<div class="bhead"><h2>מפת נקודות למשחק</h2><span class="note">ככל שהתא בהיר יותר, הצמד חזק יותר.</span></div>';
  const vals = list.map(x => x.ppg), lo = Math.min(...vals), hi = Math.max(...vals);
  const step = v => Math.min(5, Math.floor(((v - lo) / (hi - lo || 1)) * 6));
  const card = el("div", "chart-card matrix");
  const sc = el("div", "tscroll");
  let html = "<table><thead><tr><th></th>" + ORDER.map(p => "<th>" + plate(p) + "</th>").join("") + "</tr></thead><tbody>";
  ORDER.forEach(a => {
    html += "<tr><td>" + plate(a) + "</td>";
    ORDER.forEach(b => {
      if (a === b) { html += '<td class="cellv self">—</td>'; return; }
      const r = PAIR[pairKey(a, b)], s = 6 - step(r.ppg);
      html += '<td class="cellv" style="background:var(--o' + s + ');color:var(--o' + s + 't)" title="' + esc(P[a]) + " + " + esc(P[b]) + " · " + r.g + ' משחקים">' + f2(r.ppg) + "</td>";
    });
    html += "</tr>";
  });
  sc.innerHTML = html + "</tbody></table>";
  card.appendChild(sc);
  card.appendChild(el("div", "legend", '<span class="ramp-key">' + f2(lo) + " " +
    [6,5,4,3,2,1].map(j => '<i style="background:var(--o' + j + ')"></i>').join("") + " " + f2(hi) + " נק׳ למשחק</span>"));
  b2.appendChild(card);
  root.appendChild(b2);

  const b3 = el("section", "block");
  b3.innerHTML = '<div class="bhead"><h2>צמדי הגמר שניצחו</h2></div>';
  const gr = el("div", "recs");
  list.filter(x => x.titles).sort((a, b) => b.titles - a.titles).forEach(x => {
    const ts = TSS.filter(t => t.done && t.c.includes(x.a) && t.c.includes(x.b)).map(t => t.num);
    gr.appendChild(el("div", "rec",
      '<div class="lbl">' + x.titles + " אליפויות יחד</div>" +
      '<div class="d" style="font-size:15px">' + plate(x.a, "lg") + '<span class="mut">+</span>' + plate(x.b, "lg") + "</div>" +
      '<div class="d mut">טורנירים ' + ts.join(", ") + "</div>"));
  });
  b3.appendChild(gr);
  root.appendChild(b3);
}

    const g = el("div", "recs");

      '<div class="d" style="margin-top:4px">אלופים: ' + t.c.map(p => plate(p)).join(" + ") + "</div>")));

function viewRecords(root) {
  root.innerHTML = "";
  const lines = [], ms = [];
  TSS.filter(t => t.done).forEach(t => {
    t.players.forEach(p => lines.push(Object.assign({ p, t: t.num }, perT[p][t.i])));
    t.m.forEach((m, i) => ms.push({ t: t.num, i: i + 1, m }));
  });
  if (!ms.length) { root.appendChild(emptySeason()); return; }
  const best = (a, f) => a.reduce((x, y) => f(y) > f(x) ? y : x);
  const worst = (a, f) => a.reduce((x, y) => f(y) < f(x) ? y : x);
  const mBig = best(ms, x => Math.abs(x.m[6] - x.m[7])), mGoals = best(ms, x => x.m[6] + x.m[7]);
  const duoA = m => '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + plate(m[0]) + plate(m[1]) + clubTag(m[2]) + "</span>";
  const duoB = m => '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + plate(m[3]) + plate(m[4]) + clubTag(m[5]) + "</span>";

  const b1 = el("section", "block");
  b1.innerHTML = '<div class="bhead"><h2>שיאי משחק</h2></div>';
  const g1 = el("div", "recs");
  g1.appendChild(el("div", "rec",
    '<div class="lbl">הניצחון הגדול ביותר</div><div class="v ltr">' + Math.max(mBig.m[6], mBig.m[7]) + " – " + Math.min(mBig.m[6], mBig.m[7]) + "</div>" +
    '<div class="d">' + (mBig.m[6] > mBig.m[7] ? duoA(mBig.m) : duoB(mBig.m)) + "</div>" +
    '<div class="d mut">טורניר ' + mBig.t + " · משחק " + mBig.i + "</div>"));
  g1.appendChild(el("div", "rec",
    '<div class="lbl">המשחק עתיר השערים</div><div class="v ltr">' + mGoals.m[7] + " – " + mGoals.m[6] + "</div>" +
    '<div class="d">' + duoA(mGoals.m) + '</div><div class="d">' + duoB(mGoals.m) + "</div>" +
    '<div class="d mut">טורניר ' + mGoals.t + " · " + (mGoals.m[6] + mGoals.m[7]) + " שערים</div>"));
  g1.appendChild(el("div", "rec",
    '<div class="lbl">0–0</div><div class="v">' + ms.filter(x => x.m[6] + x.m[7] === 0).length + "</div>" +
    '<div class="d mut">משחקים ללא שערים מתוך ' + ms.length + "</div>"));
  b1.appendChild(g1);
  root.appendChild(b1);

  const b2 = el("section", "block");
  b2.innerHTML = '<div class="bhead"><h2>שיאי טורניר</h2><span class="note">ההישג הטוב והגרוע ביותר של שחקן בטבלת טורניר אחת.</span></div>';
  const g2 = el("div", "recs");
  const rec = (k, x, v) => el("div", "rec",
    '<div class="lbl">' + k + '</div><div class="v ltr">' + v + "</div>" +
    '<div class="d">' + plate(x.p, "lg") + clubTag(x.club) + "</div>" +
    '<div class="d mut">טורניר ' + x.t + " · מקום " + x.place + " · " + scoreTxt(x.gf, x.ga) + "</div>");
  g2.append(
    rec("הכי הרבה נקודות", best(lines, x => x.pts), best(lines, x => x.pts).pts + " נק׳"),
    rec("הכי מעט נקודות", worst(lines, x => x.pts), worst(lines, x => x.pts).pts + " נק׳"),
    rec("הכי הרבה שערים", best(lines, x => x.gf), best(lines, x => x.gf).gf + " שערים"),
    rec("הכי מעט שערים", worst(lines, x => x.gf), worst(lines, x => x.gf).gf + " שערים"),
    rec("ההפרש הטוב ביותר", best(lines, x => x.gf - x.ga), sgn(best(lines, x => x.gf - x.ga).gf - best(lines, x => x.gf - x.ga).ga)),
    rec("ההפרש הגרוע ביותר", worst(lines, x => x.gf - x.ga), sgn(worst(lines, x => x.gf - x.ga).gf - worst(lines, x => x.gf - x.ga).ga)));
  b2.appendChild(g2);
  root.appendChild(b2);

  const b3 = el("section", "block");
  b3.innerHTML = '<div class="bhead"><h2>רצפים</h2><span class="note">אליפויות רצופות ובצורת ארוכה, לפי סדר הטורנירים.</span></div>';
  const g3 = el("div", "recs");
  ORDER.forEach(p => {
    let cur = 0, bs = 0, be = 0, dry = 0, bd = 0, de = 0;
    TSS.filter(t => t.done).forEach(t => {
      if (!t.players.includes(p)) return;
      if (t.c.includes(p)) { cur++; dry = 0; if (cur > bs) { bs = cur; be = t.num; } }
      else { cur = 0; dry++; if (dry > bd) { bd = dry; de = t.num; } }
    });
    g3.appendChild(el("div", "rec",
      '<div class="lbl">' + esc(P[p]) + '</div><div class="v">' + bs + " ברצף</div>" +
      '<div class="d mut">רצף האליפויות הארוך ביותר, עד טורניר ' + be + "</div>" +
      '<div class="d mut">בצורת ארוכה ביותר: ' + bd + " טורנירים, עד " + de + "</div>"));
  });
  b3.appendChild(g3);
  root.appendChild(b3);

  /* runs measured match by match, not tournament by tournament */
  if (LOG && LOG.some(l => l.length)) {
    const bS = el("section", "block");
    bS.innerHTML = '<div class="bhead"><h2>רצפים במשחקים</h2><span class="note">' +
      'רצפים רצופים לאורך כל המשחקים של השחקן, חוצי טורנירים. הכתר מסמן את בעל השיא.</span></div>';
    const rows = ORDER.filter(p => LOG[p].length).map(p => ({
      p,
      w: longestRun(LOG[p], isW),
      u: longestRun(LOG[p], isNL),
      l: longestRun(LOG[p], isL),
      now: { w: currentRun(LOG[p], isW), l: currentRun(LOG[p], isL), u: currentRun(LOG[p], isNL) },
      last: S[p].last, app: S[p].app
    }));
    const topW = Math.max(...rows.map(r => r.w.n)), topU = Math.max(...rows.map(r => r.u.n));
    const topL = Math.max(...rows.map(r => r.l.n)), topLast = Math.max(...rows.map(r => r.last));
    const crown = on => on ? ' <span class="crown">★</span>' : "";
    const span = r => r.span ? '<span class="mut"> · ' + runSpan(r, true) + "</span>" : "";
    makeTable(bS, [
      { label: "שחקן", key: "n", val: r => P[r.p], render: r => plate(r.p) },
      { label: "רצף נצחונות", key: "w", val: r => r.w.n, cls: () => "strong",
        render: r => r.w.n + crown(r.w.n === topW) + span(r.w) },
      { label: "רצף ללא הפסד", key: "u", val: r => r.u.n,
        render: r => r.u.n + crown(r.u.n === topU) + span(r.u) },
      { label: "רצף הפסדים", key: "l", val: r => r.l.n, cls: () => "neg",
        render: r => r.l.n + crown(r.l.n === topL) + span(r.l) },
      { label: "הרצף עכשיו", key: "c", sortable: false, val: () => 0,
        render: r => r.now.w ? '<span class="pos">' + runWord("w", r.now.w) + "</span>"
                  : r.now.l ? '<span class="neg">' + runWord("l", r.now.l) + "</span>"
                  : r.now.u ? runWord("u", r.now.u) : "—" },
      { label: "סיים אחרון", key: "last", val: r => r.last,
        render: r => r.last + crown(r.last === topLast) + ' <span class="mut">מתוך ' + r.app + "</span>" }
    ], rows, { sort: "w" });
    root.appendChild(bS);
  }

  const b4 = el("section", "block");
  b4.innerHTML = '<div class="bhead"><h2>אחד מול השני</h2><span class="note">אחוז הנצחונות של השחקן בשורה מול השחקן בעמודה.</span></div>';
  const card = el("div", "chart-card matrix"), sc = el("div", "tscroll");
  let html = "<table><thead><tr><th></th>" + ORDER.map(p => "<th>" + plate(p) + "</th>").join("") + "</tr></thead><tbody>";
  ORDER.forEach(a => {
    html += "<tr><td>" + plate(a) + "</td>";
    ORDER.forEach(b => {
      if (a === b) { html += '<td class="cellv self">—</td>'; return; }
      const r = H2H[a][b], pc = r.w / r.g;
      const s = Math.max(1, Math.min(6, 6 - Math.min(5, Math.floor(((pc - 0.28) / 0.22) * 6))));
      html += '<td class="cellv" style="background:var(--o' + s + ');color:var(--o' + s + 't)" title="' +
        r.w + " נצחונות, " + r.dr + " תיקו, " + r.l + " הפסדים מתוך " + r.g + '">' + Math.round(pc * 100) + "%</td>";
    });
    html += "</tr>";
  });
  sc.innerHTML = html + "</tbody></table>";
  card.appendChild(sc);
  card.appendChild(el("div", "legend", '<span class="ramp-key">נמוך ' +
    [6,5,4,3,2,1].map(j => '<i style="background:var(--o' + j + ')"></i>').join("") + " גבוה</span>"));
  b4.appendChild(card);
  root.appendChild(b4);
}

/* ==========================================================================
   NEWSROOM
   ========================================================================== */
/* Build every story once; the screen renders them and the snapshot serialises
   them, so the two can never drift apart. */
function newsItems(t) {
  const played = t.m.filter(m => m[6] != null && m[7] != null).length;
  const total = t.m.length;
  const sim = simulate(t, 4000);
  const nx = nextFixture(t), lp = lastPlayed(t);
  const stand = t.table.map((p, i) => ({ p, place: i + 1, a: t.acc[p] }));
  const items = [];

  items.push(heroItem(t, sim, played, total, stand));

  if (played < total) {
    const rows = t.players.slice().sort((x, y) => sim[y].top4 - sim[x].top4);
    items.push({
      tag: "סיכויי עלייה", head: "מי עולה לארבעת הגדולים", hero: false, icon: "📊", who: rows.slice(0, 3),
      body: '<div class="qbar">' + rows.map(p =>
        '<div class="qrow"><span>' + plate(p) + "</span>" +
        '<span class="qtrack"><span class="qfill" style="--c:' + PC(p) + ';width:' +
        Math.max(1, Math.round(sim[p].top4 * 100)) + '%"></span></span>' +
        '<span class="qval">' + Math.round(sim[p].top4 * 100) + "%</span></div>").join("") + "</div>" +
        '<div class="swing">' + rows.map(p => "<span>" + esc(P[p]) +
          " · אליפות " + Math.round(sim[p].title * 100) + "%</span>").join("") + "</div>",
      plain: "📊 סיכויי עלייה לגמר\n" + rows.map(p =>
        P[p] + ": " + Math.round(sim[p].top4 * 100) + "% (אליפות " + Math.round(sim[p].title * 100) + "%)").join("\n")
    });
  }

  if (nx) {
    const f = forecast(nx.m);
    const inv = [nx.m[0], nx.m[1], nx.m[3], nx.m[4]];
    const simH = simulate(t, 1500, "h"), simA = simulate(t, 1500, "a");
    const swing = inv.map(p => {
      const now = Math.round(sim[p].top4 * 100);
      const ifH = Math.round(simH[p].top4 * 100), ifA = Math.round(simA[p].top4 * 100);
      return "<span>" + plate(p) + " <b>" + now + "%</b> → <span class='up'>" + Math.max(ifH, ifA) +
        "%</span> / <span class='down'>" + Math.min(ifH, ifA) + "%</span></span>";
    }).join("");
    items.push({
      tag: "המשחק הבא", head: "משחק " + (nx.i + 1) + " מתוך " + total, hero: false, icon: "⚽", who: inv,
      body: "<div><b>" + esc(P[nx.m[0]]) + " ו" + esc(P[nx.m[1]]) + "</b> (" + esc(CLUBS[nx.m[2]]) +
        ") נגד <b>" + esc(P[nx.m[3]]) + " ו" + esc(P[nx.m[4]]) + "</b> (" + esc(CLUBS[nx.m[5]]) + ")</div>" +
        (f ? "<div>הסיכויים: <b>" + Math.round(f.w * 100) + "%</b> לבית, " + Math.round(f.d * 100) +
          "% תיקו, <b>" + Math.round(f.l * 100) + "%</b> לחוץ · שערים צפויים " +
          f.lh.toFixed(1) + "–" + f.la.toFixed(1) + "</div>" : "") +
        "<div>סיכויי העלייה של המשתתפים, לפי התוצאה:</div>" +
        '<div class="swing">' + swing + "</div>",
      plain: "⚽ המשחק הבא · מספר " + (nx.i + 1) + "\n" +
        P[nx.m[0]] + " ו" + P[nx.m[1]] + " (" + CLUBS[nx.m[2]] + ") נגד " +
        P[nx.m[3]] + " ו" + P[nx.m[4]] + " (" + CLUBS[nx.m[5]] + ")" +
        (f ? "\nסיכויים: " + Math.round(f.w * 100) + "% / " + Math.round(f.d * 100) + "% / " +
          Math.round(f.l * 100) + "%" : "")
    });
  }

  /* the fixture that settles it, if one of the remaining ones does */
  /* cached only: these take seconds on a phone, so viewNews computes them in
     the background and redraws once they are ready */
  const gv = played < total ? gravityCached(t) : null;
  if (gv && gv.top && gv.top.spread >= 0.25) {
    const g = gv.top, gm = t.m[g.i];
    const ord = [{ o: "h", v: g.v[0] }, { o: "d", v: g.v[1] }, { o: "a", v: g.v[2] }]
      .sort((a, b) => b.v - a.v);
    const best = ord[0], worst = ord[ord.length - 1];
    const bare = o => o === "d" ? "תיקו"
      : o === "h" ? "ניצחון של " + P[gm[0]] + " ו" + P[gm[1]]
                  : "ניצחון של " + P[gm[3]] + " ו" + P[gm[4]];
    items.push({
      tag: "משחק גורלי", hero: false, icon: "🔥", who: [g.p],
      head: "🔥 משחק " + (g.i + 1) + " מכריע את העלייה",
      body: "<div><b>" + esc(P[gm[0]]) + " ו" + esc(P[gm[1]]) + "</b> (" + esc(CLUBS[gm[2]]) +
        ") נגד <b>" + esc(P[gm[3]]) + " ו" + esc(P[gm[4]]) + "</b> (" + esc(CLUBS[gm[5]]) + ")</div>" +
        "<div>" + plate(g.p) + " תלוי בתוצאה הזאת יותר מכולם: " + esc(bare(best.o)) +
        ' מעלה אותו ל־<b class="ltr">' + pct(best.v) + "%</b> לגמר, " + esc(bare(worst.o)) +
        ' מוריד אותו ל־<b class="ltr">' + pct(worst.v) + "%</b>.</div>" +
        '<div class="swing">' + g.all.map(r => "<span>" + plate(r.p) + " " +
          pct(Math.max(r.h, r.d, r.a)) + "% / " + pct(Math.min(r.h, r.d, r.a)) + "%</span>").join("") + "</div>",
      plain: "🔥 משחק גורלי · מספר " + (g.i + 1) + "\n" +
        P[gm[0]] + " ו" + P[gm[1]] + " נגד " + P[gm[3]] + " ו" + P[gm[4]] + "\n" +
        P[g.p] + ": " + bare(best.o) + " → " + pct(best.v) + "% לגמר, " +
        bare(worst.o) + " → " + pct(worst.v) + "%"
    });
  }

  /* the match that moved the tournament most, once there is enough to compare */
  const tlN = played >= 3 ? timelineCached(t) : null;
  if (tlN && tlN.peak && tlN.peak.swing >= 0.08 && tlN.peak.mover != null) {
    const sp = tlN.peak, pm = t.m[sp.k - 1], mp = sp.mover;
    const b4 = tlN.stages[sp.k - 1].sim[mp].top4, af = sp.sim[mp].top4;
    items.push({
      tag: "רגע השיא", hero: false, icon: "⚡", who: [mp],
      head: "המשחק ששינה את הטורניר",
      body: "<div><b>משחק " + sp.k + "</b>: " + esc(P[pm[0]]) + " ו" + esc(P[pm[1]]) + " " +
        scoreTxt(pm[6], pm[7]) + " " + esc(P[pm[3]]) + " ו" + esc(P[pm[4]]) + "</div>" +
        "<div>" + plate(mp) + " " + (af >= b4 ? "קפץ" : "צנח") + ' מ־<b class="ltr">' + pct(b4) +
        '%</b> ל־<b class="ltr">' + pct(af) + "%</b> סיכוי לעלות לגמר — התזוזה הגדולה בטורניר.</div>",
      plain: "⚡ רגע השיא\nמשחק " + sp.k + ": " + P[pm[0]] + " ו" + P[pm[1]] + " " +
        pm[6] + ":" + pm[7] + " " + P[pm[3]] + " ו" + P[pm[4]] + "\n" +
        P[mp] + ": " + pct(b4) + "% ← " + pct(af) + "% לגמר"
    });
  }

  if (lp) {
    const m = lp.m;
    const won = m[6] > m[7] ? [m[0], m[1]] : m[7] > m[6] ? [m[3], m[4]] : null;
    items.push({
      tag: "עדכון", hero: false, icon: "🔔", who: won || [m[0], m[1], m[3], m[4]],
      head: won ? "ניצחון ל" + esc(P[won[0]]) + " ו" + esc(P[won[1]]) : "תיקו במשחק " + (lp.i + 1),
      body: "<div>משחק " + (lp.i + 1) + ": <b>" + esc(P[m[0]]) + " ו" + esc(P[m[1]]) + "</b> " +
        scoreTxt(m[6], m[7]) + " <b>" + esc(P[m[3]]) + " ו" + esc(P[m[4]]) + "</b></div>" +
        "<div>" + (won ? "שלוש נקודות ל" + esc(P[won[0]]) + " ול" + esc(P[won[1]]) + "." : "נקודה לכל צמד.") + "</div>" +
        '<div class="swing">' + [m[0], m[1], m[3], m[4]].map(p =>
          "<span>" + plate(p) + " מקום " + t.place[p] + " · " + t.acc[p].pts + " נק׳</span>").join("") + "</div>",
      plain: "🔔 תוצאה אחרונה\nמשחק " + (lp.i + 1) + ": " + P[m[0]] + " ו" + P[m[1]] +
        " " + m[6] + ":" + m[7] + " " + P[m[3]] + " ו" + P[m[4]]
    });
  }

  items.push({
    tag: "הטבלה", hero: false, icon: "🏆", who: stand.slice(0, 3).map(r => r.p),
    head: played ? "המצב אחרי " + played + " משחקים" : "לפני הפתיחה",
    body: '<div class="qbar">' + stand.map(r =>
      '<div class="qrow" style="grid-template-columns:20px 1fr auto"><span class="mut">' + r.place +
      "</span><span>" + plate(r.p) + " " + clubTag(t.teamOf[r.p]) + '</span><span class="qval">' +
      r.a.pts + " נק׳ · " + sgn(r.a.gf - r.a.ga) + "</span></div>").join("") + "</div>" +
      (played < total ? "<div>קו העלייה עובר אחרי המקום הרביעי.</div>" : ""),
    plain: "🏆 הטבלה\n" + stand.map(r =>
      r.place + ". " + P[r.p] + " (" + CLUBS[t.teamOf[r.p]] + ") — " + r.a.pts + " נק׳, " +
      r.a.gf + ":" + r.a.ga).join("\n")
  });

  const q = drawLuck(t);
  if (q && q[0].luck != null) {
    const who = t.players.length;
    const hardTxt = h => h ? "נגד " + P[h.a] + " ו" + P[h.b] + " (" + CLUBS[h.c] + ") · " + pct(h.win) + "% לנצח" : "";
    const hardHtml = h => h ? "נגד " + esc(P[h.a]) + " ו" + esc(P[h.b]) + " " + clubTag(h.c) +
      ' <span class="ltr">' + pct(h.win) + "%</span> לנצח" : "";
    items.push({
      tag: "ההגרלה", head: esc(P[q[0].p]) + " יצא הכי מרוצה מההגרלה", hero: false, icon: "🎲",
      who: [q[0].p, q[who - 1].p],
      body: "<div>כמה נקודות ההגרלה \"נתנה\" לכל שחקן: הקבוצה שלו, השותפים, הזוגות שמולו והקבוצות שלהם — " +
        "לעומת הגרלה אקראית ממוצעת. <b>פלוס</b> = דרך נוחה, <b>מינוס</b> = דרך קשה.</div>" +
        '<div class="dluck">' + q.map((c, i) =>
          '<div class="dl-row"><div class="dl-top"><span class="mut">' + (i + 1) + "</span><span>" + plate(c.p) + " " +
          clubTag(c.ci) + '</span><span class="qval ' + (c.luck >= 0 ? "up" : "down") + '">' + sgn1(c.luck) + " נק׳</span></div>" +
          '<div class="dl-sub">הצמדים שלו <b class="ltr">' + f2(c.mate) + '</b> · הקבוצה <b class="ltr">' + f2(c.club) + "</b> · זוגות מולו <b class=\"ltr\">" + f2(c.opp) +
          '</b> · קבוצות מולו <b class="ltr">' + f2(c.oppClub) + "</b></div>" +
          '<div class="dl-sub">הכי קשה: ' + hardHtml(c.hard) + "</div></div>").join("") + "</div>" +
        "<div class=\"mut\">המספרים הם נקודות למשחק לאורך ההיסטוריה: של הצמדים שהוא משחק בהם, של הקבוצה שלו, ושל הזוגות והקבוצות שמולו. " +
        "הממוצע הוא בערך " + f2(q.reduce((s2, c) => s2 + c.opp, 0) / who) + " — מעליו, היריבים קשים יותר.</div>",
      plain: "🎲 מי יצא מרוצה מההגרלה\n" + q.map((c, i) =>
        (i + 1) + ". " + P[c.p] + " (" + c.name + ") " + (c.luck >= 0 ? "+" : "") + c.luck.toFixed(1) +
        " נק׳ · הצמדים שלו " + f2(c.mate) + " · זוגות מולו " + f2(c.opp) + " · קבוצות מולו " + f2(c.oppClub) +
        (c.hard ? "\n   הכי קשה: " + hardTxt(c.hard) : "")).join("\n")
    });
  }

  return { items, played, total, sim, stand };
}

function heroItem(t, sim, played, total, stand) {
  let tag = "הכותרת", head = "", body = "", plain = "", who = [];
  if (t.done) {
    tag = "סיום"; who = t.c.slice();
    head = "אלופי טורניר " + t.num + ": " + esc(P[t.c[0]]) + " ו" + esc(P[t.c[1]]);
    body = "<div>" + (t.top2 ? "צמד 1–2 עשה את העבודה בגמר." : "צמד 3–4 הפך את היוצרות בגמר.") +
      " " + esc(P[stand[0].p]) + " סיים ראשון בטבלה עם " + stand[0].a.pts + " נקודות.</div>";
    plain = "🏁 טורניר " + t.num + " הסתיים\nאלופים: " + P[t.c[0]] + " ו" + P[t.c[1]];
  } else if (!played) {
    const fav = t.players.slice().sort((a, b) => sim[b].title - sim[a].title)[0];
    tag = "לפני הפתיחה"; who = [fav];
    head = esc(P[fav]) + " פותח כפייבוריט";
    body = "<div>לפי " + nf(MODEL.matches) + " המשחקים שנרשמו עד היום, <b>" + esc(P[fav]) +
      "</b> נכנס עם " + Math.round(sim[fav].title * 100) + "% לאליפות ו־" +
      Math.round(sim[fav].top4 * 100) + "% לעלייה לגמר. " + total + " משחקים עד הגביע.</div>";
    plain = "🎬 טורניר " + t.num + " נפתח\nפייבוריט: " + P[fav] + " (" +
      Math.round(sim[fav].title * 100) + "% לאליפות)";
  } else if (played === total) {
    tag = "הגמר"; who = stand.slice(0, 4).map(r => r.p);
    head = "הגמר נקבע: " + esc(P[stand[0].p]) + " ו" + esc(P[stand[1].p]) + " מול " +
      esc(P[stand[2].p]) + " ו" + esc(P[stand[3].p]);
    const lg = finalLegLambdas(t, t.table);
    body = "<div>שלב הליגה נגמר. <b>" + esc(P[stand[0].p]) + "</b> סיים ראשון עם " +
      stand[0].a.pts + " נקודות. הגמר הוא שני משחקים — " + esc(P[stand[2].p]) + " ו" +
      esc(P[stand[3].p]) + " מארחים ראשונים" +
      (lg[0] ? ", שערים צפויים " + lg[0][0].toFixed(1) + "–" + lg[0][1].toFixed(1) : "") + ".</div>";
    plain = "🥊 הגמר\n" + P[stand[0].p] + " ו" + P[stand[1].p] + " מול " +
      P[stand[2].p] + " ו" + P[stand[3].p];
  } else {
    const safest = t.players.slice().sort((a, b) => sim[b].top4 - sim[a].top4)[0];
    const risk = t.players.slice().sort((a, b) => sim[a].top4 - sim[b].top4)[0];
    const lead = stand[0], gap = stand[0].a.pts - stand[1].a.pts;
    if (sim[safest].top4 > 0.985) {
      head = esc(P[safest]) + " כבר בגמר"; who = [safest];
      body = "<div>אין תרחיש שמוציא את <b>" + esc(P[safest]) + "</b> מארבעת הראשונים. בקצה השני, <b>" +
        esc(P[risk]) + "</b> יורד ל־" + Math.round(sim[risk].top4 * 100) + "%.</div>";
    } else if (sim[risk].top4 < 0.05) {
      head = esc(P[risk]) + " כמעט בחוץ"; who = [risk];
      body = "<div><b>" + esc(P[risk]) + "</b> נשאר עם " + Math.round(sim[risk].top4 * 100) +
        "% בלבד לעלייה. במקום הראשון: <b>" + esc(P[lead.p]) + "</b> עם " + lead.a.pts + " נקודות.</div>";
    } else {
      who = gap >= 3 ? [lead.p] : [lead.p, stand[1].p];
      head = gap >= 3 ? esc(P[lead.p]) + " בורח בפסגה" : "הפסגה צמודה — " + esc(P[lead.p]) + " בראש";
      body = "<div><b>" + esc(P[lead.p]) + "</b> מוביל עם " + lead.a.pts + " נקודות" +
        (gap ? ", " + gap + " מעל " + esc(P[stand[1].p]) : ", שווה נקודות עם " + esc(P[stand[1].p])) +
        ". הכי קרוב ליציאה: <b>" + esc(P[risk]) + "</b> עם " + Math.round(sim[risk].top4 * 100) +
        "% לעלייה.</div>";
    }
    plain = "📰 טורניר " + t.num + " · אחרי " + played + " מתוך " + total + "\n" +
      P[lead.p] + " מוביל עם " + lead.a.pts + " נקודות";
  }
  return { tag: tag, head: head, body: body, plain: plain, hero: true, icon: "📰", who: who };
}

const stripTags = h => String(h).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();

function bulletinFor(t, pre) {
  const n = pre || newsItems(t);          // reuse the stories if the caller has them
  return {
    headline: stripTags(n.items[0].head),
    text: "📰 חדר חדשות · טורניר " + t.num + " · " + seasonById(t.season).name + "\n\n" +
      n.items.map(i => i.plain).filter(Boolean).join("\n\n"),
    played: n.played, total: n.total
  };
}

/* ==========================================================================
   Notifications panel (every phone) and the admin's send box (one phone)
   --------------------------------------------------------------------------
   Nobody's phone sends pushes any more. "The next match" goes out from the
   server after any new result; the admin's own messages go through the
   server too, which checks the admin key. This panel only lets a phone say
   "notify me", and — on the admin's phone — write a message.
   ========================================================================== */
const ADMIN_KEY_LS = "fifa-admin-key";
const adminKey = () => { try { return localStorage.getItem(ADMIN_KEY_LS) || ""; } catch (e) { return ""; } };
const pushErr = e => {
  const m = String((e && (e.code || e.message)) || e);
  /* the admin call's refusal first: "permission-denied" also contains "denied" */
  if (/functions\/permission-denied|^permission-denied$/.test(m)) return "מפתח האדמין שגוי.";
  /* the phone said no: in the APK that is Android's switch for the app, in
     the browser-installed app it is Chrome's setting for the site */
  if (m === "denied" || /permission-blocked|messaging\/permission-default/.test(m))
    return "הטלפון חוסם התראות לאפליקציה. באפליקציה שהותקנה מקובץ APK: הגדרות הטלפון ← אפליקציות ← טורניר פיפא ← התראות ← להפעיל. " +

  if (!t.live || !LIVE[t.i]) return;

        const [p, r, v, pl, pw] = await Promise.all([
          db.collection("predictions").get(), db.collection("reactions").get(),
          db.collection("pollVotes").get(), db.doc("meta/poll").get(), db.collection("predWindows").get()]);

  paint() {

    const pp = document.getElementById("predPanel");

        '</span><span class="mut">נגד</span><span>' + plateFace(m[3]) + plateFace(m[4]) + " " + clubTag(m[5]) + "</span>"));
      const body = el("div", "pn-body");
      predTab(t, mineK, body);
      now.appendChild(body);
    } else if (openK.length) {
      const w = winOf(t, openK[0]);
      now.appendChild(el("div", "notice", "🔮 " + w.sit.map(x => esc(P[x])).join(" ו") + " מנחשים את מחזור " + (openK[0] + 1) + " · " +
        '<span class="pred-timer" data-close="' + w.closeMs + '">⏳ ' + mmss(w.closeMs - Date.now()) + "</span>"));
    } else {
      /* who predicts the next match, and whether that is me */
      const nk = t.m.findIndex(m => m[6] == null || m[7] == null);
      if (nk < 0) now.appendChild(el("div", "notice", "שלב הליגה הסתיים — אין עוד משחקים לנחש בטורניר הזה."));
      else {
        const m = t.m[nk], on = [m[0], m[1], m[3], m[4]];
        const sit = t.players.filter(p => on.indexOf(p) < 0);
        now.appendChild(el("div", "notice", sit.indexOf(me) >= 0
          ? "🔮 <b>אתה מנחש את מחזור " + (nk + 1) + "!</b> הניחוש ייפתח עם הפוש שמודיע עליו — יהיו לך 3 דקות."
          : "במחזור " + (nk + 1) + " מנחשים " + sit.map(x => esc(P[x])).join(" ו") + ". אתה משחק בו — בהצלחה ⚽"));
      }
    }
  }
  box.appendChild(now);

  /* 2 — my predictions this season */
  if (isMe) {
    const season = t ? t.season : activeSeason();
    const mine = [];
    TS.filter(x => x.season === season).forEach(x => x.m.forEach((m, k) => {
      const p = (Social.pred[x.i + "_" + k] || {})[me];
      if (p) mine.push({ t: x, k, m, p, pts: predPoints(p, m[6], m[7]) });
    }));
    mine.sort((a, b) => b.t.i - a.t.i || b.k - a.k);
    const done = mine.filter(r => r.pts != null);
    const sec = el("section", "block");
    sec.innerHTML = '<div class="bhead"><h2>הניחושים שלי</h2><span class="note">' + esc(seasonById(season).name) + "</span></div>";
    sec.appendChild(el("div", "act-sum",
      "<div><b>" + done.reduce((n, r) => n + r.pts, 0) + "</b><span>נקודות</span></div>" +
      "<div><b>" + done.filter(r => r.pts === 3).length + "</b><span>🎯 מדויקים</span></div>" +
      "<div><b>" + mine.length + "</b><span>ניחושים</span></div>"));
    if (!mine.length) sec.appendChild(el("div", "mut", Social.loaded ? "עוד לא ניחשת העונה." : "טוען…"));
    mine.forEach(r => {
      const played = r.pts != null;
      const row = el("button", "pn-row" + (r.pts === 3 ? " exact" : r.pts === 1 ? " hit" : played ? " miss" : ""),
        '<span class="pn-where">טורניר ' + r.t.num + " · מחזור " + (r.k + 1) + "</span>" +
        '<span class="pn-pairs">' + esc(P[r.m[0]]) + " ו" + esc(P[r.m[1]]) + ' <span class="mut">נגד</span> ' + esc(P[r.m[3]]) + " ו" + esc(P[r.m[4]]) + "</span>" +
        '<span class="pn-guess">ניחוש <b class="ltr">' + r.p.a + " - " + r.p.h + "</b>" +
          (played ? ' · תוצאה <b class="ltr">' + r.m[7] + " - " + r.m[6] + "</b>" : " · עוד לא שוחק") + "</span>" +
        '<span class="pn-pts"><span class="ltr">' + (r.pts === 3 ? "+3 🎯" : r.pts === 1 ? "+1 ✓" : played ? "0" : "…") + "</span></span>");
      row.onclick = () => openMatch(r.t.i, r.k, "pred");
      sec.appendChild(row);
    });
    box.appendChild(sec);
  }

  /* 3 — the predictors table, 4 — the rules */
  if (t) box.appendChild(predBoard(t));
  box.appendChild(el("section", "block pn-rules",
    '<div class="bhead"><h2>החוקים</h2></div>' +
    "<div>🔮 מנחשים רק שני השחקנים שלא משחקים במשחק.</div>" +
    "<div>⏳ יש 3 דקות מרגע הפוש שמודיע על המשחק.</div>" +
    "<div>🎯 תוצאה מדויקת — 3 נקודות · ✓ המנצח הנכון או תיקו — נקודה · אחרת 0.</div>" +
    "<div>🙈 הניחוש של השני נחשף רק כשהזמן נגמר.</div>"));
  if (!Social.loaded) Social.load();
  return box;
}

/* ==========================================================================
   Who is holding this phone, and the activity log
   --------------------------------------------------------------------------
   The app has no logins. Each phone is asked once, after the intro, whose it
   is (one of the six, or "just visiting"); the answer stays on the phone and
   can be changed under ניהול. Every opening of the app — a fresh start, or a
   return after half an hour away — adds one line to visits/: who, when, and
   whether it was the APK, the home-screen app or a browser tab. Phones can
   only add lines; the admin reads them through the server (adminVisits).
   ========================================================================== */
const ME_LS = "fifa-me", DEV_LS = "fifa-dev", LASTVISIT_LS = "fifa-lastvisit";
const meWho = () => {                 // undefined: never asked · -1: visiting · 0..5
  try { const v = localStorage.getItem(ME_LS); return v == null ? undefined : Number(v); } catch (e) { return -1; }
};
const setMe = v => { try { localStorage.setItem(ME_LS, String(v)); } catch (e) {} };
function deviceId() {
  try {
    let d = localStorage.getItem(DEV_LS);
    if (!d) { d = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(DEV_LS, d); }
    return d;
  } catch (e) { return "none"; }
}
/* the APK opens the site from an android-app:// referrer; the browser-installed
   app runs standalone; anything else is a tab */
const APP_KIND = (() => {
  try {
    if (/^android-app:\/\//.test(document.referrer) || sessionStorage.getItem("fifa-apk")) {
      sessionStorage.setItem("fifa-apk", "1"); return "apk";
    }
  } catch (e) {}
  return matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches ? "app" : "web";
})();

async function logVisit(force) {
  try {
    const now = Date.now();
    const last = Number(localStorage.getItem(LASTVISIT_LS) || 0);
    if (!force && now - last < 5 * 60e3) return;       // a reload is not a new visit
    const db = Store.db || (window.APP_DB && await window.APP_DB.open());
    if (!db) return;
    localStorage.setItem(LASTVISIT_LS, String(now));
    const w = meWho();
    await db.doc("visits/" + deviceId() + "_" + now.toString(36)).set({
      who: typeof w === "number" && w >= 0 && w <= 5 ? w : null,
      at: new Date(now).toISOString(), dev: deviceId(), app: APP_KIND
    });
  } catch (e) { /* the log must never get in the way of the app */ }
}

/* back after half an hour in the background counts as opening the app again */
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt >= 30 * 60e3) logVisit();
});

function askWho() {

      b.innerHTML = '<span class="whoface">' + (photoOf(p) ? '<i class="pface pf' + p + '"></i>' : "<b>" + esc(name.slice(0, 1)) + "</b>") +

  });
}

function drawActivity(host, visits, days) {
  host.innerHTML = "";
  const since = days === 1 ? new Date(new Date().setHours(0, 0, 0, 0)) : new Date(Date.now() - days * 864e5);
  const vs = visits.map(v => Object.assign({}, v, { d: new Date(v.at) })).filter(v => v.d >= since);
  if (!vs.length) { host.appendChild(el("div", "mut", "אין כניסות בתקופה הזאת.")); return; }
  const key = v => (v.who == null ? "g" : String(v.who));
  const people = {};
  vs.forEach(v => {
    const k = key(v);
    const o = people[k] || (people[k] = { who: v.who, n: 0, last: v.d, hours: new Array(24).fill(0), devs: new Set(), apps: new Set() });
    o.n++; if (v.d > o.last) o.last = v.d;
    o.hours[v.d.getHours()]++; o.devs.add(v.dev); o.apps.add(v.app);
  });
  const hoursAll = new Array(24).fill(0);
  vs.forEach(v => { hoursAll[v.d.getHours()]++; });
  const whoN = Object.keys(people).filter(k => k !== "g").length;

  host.appendChild(el("div", "act-sum",
    '<div><b>' + vs.length + "</b><span>כניסות</span></div>" +
    "<div><b>" + whoN + "</b><span>שחקנים נכנסו</span></div>" +
    "<div><b>" + String(hoursAll.indexOf(Math.max(...hoursAll))).padStart(2, "0") + ":00</b><span>השעה העמוסה</span></div>"));

  /* every hour of the day, all players together */
  const mx = Math.max(...hoursAll);
  host.appendChild(el("div", "act-hours",
    '<div class="act-bars">' + hoursAll.map((c, h) => '<span title="' + h + ':00 · ' + c + '"><i style="height:' +
      (c ? Math.max(6, Math.round(100 * c / mx)) : 0) + '%"></i></span>').join("") + "</div>" +
    '<div class="act-axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>'));

  const fmt = d => {
    const t = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
    return (diff === 0 ? "היום" : diff === 1 ? "אתמול" : d.getDate() + "/" + (d.getMonth() + 1)) + " " + t;
  };
  const appName = a => ({ apk: "APK", app: "מסך הבית", web: "דפדפן" })[a] || a;
  Object.values(people).sort((a, b) => b.n - a.n).forEach(o => {
    const hm = Math.max(...o.hours);
    const name = o.who == null ? '<span class="mut">בלי שם</span>' : plateFace(o.who);
    host.appendChild(el("div", "act-row",
      '<div class="act-top"><span>' + name + '</span><b class="act-n">' + o.n + '</b></div>' +
      '<div class="act-sub">אחרון: ' + fmt(o.last) + " · " + [...o.apps].map(appName).join(", ") +
        (o.devs.size > 1 ? " · " + o.devs.size + " מכשירים" : "") + "</div>" +
      '<div class="act-heat" style="--c:' + (o.who == null ? "#8A94A3" : PC(o.who)) + '">' +
        o.hours.map((c, h) => '<i title="' + h + ':00 · ' + c + '" style="opacity:' + (c ? (0.25 + 0.75 * c / hm).toFixed(2) : 0.06) + '"></i>').join("") + "</div>"));
  });

  const list = el("details", "act-log");
  list.innerHTML = "<summary>כל הכניסות (" + vs.length + ")</summary>" +
    vs.slice(0, 200).map(v => '<div class="act-line"><span>' + (v.who == null ? "בלי שם" : esc(P[v.who])) + "</span><span class=\"mut\">" +
      appName(v.app) + "</span><span>" + fmt(v.d) + "</span></div>").join("");
  host.appendChild(list);
}

/* ==========================================================================
   News, 365 style — a feed of cards. The lead story is a big picture card,
   the rest are rows with a picture beside the headline. Each card opens its
   story on its own page (the match page's shell, so Android's back closes it).
   The "picture" is the faces of the players the story is about, on their
   colour, with the story's emoji.
   ========================================================================== */
/* the card's one-line preview: tags become spaces, so "רועי 96% · דביר 84%"
   does not run together as "רועי96%דביר84%" */
const snippet = h => String(h).replace(/<\/(div|span|b)>/g, "$& ").replace(/<[^>]*>/g, "")
  .replace(/\s+/g, " ").replace(/ %/g, "%").trim();

function newsArt(it, big) {
  const who = (it.who || []).filter(p => p != null && P[p] != null).slice(0, big ? 4 : 3);
  const c0 = who.length ? PC(who[0]) : "var(--blue)";
  const c1 = who.length > 1 ? PC(who[1]) : "#1B2129";
  return '<div class="nart' + (big ? " big" : "") + '" style="--c0:' + c0 + ";--c1:" + c1 + '">' +
    '<div class="nfaces">' + who.map(p => '<span class="nface" style="--c:' + PC(p) + '">' +
      (photoOf(p) ? '<i class="pface pf' + p + '"></i>' : "<b>" + esc(P[p].slice(0, 1)) + "</b>") +
      "</span>").join("") + "</div>" +
    '<span class="nicon">' + (it.icon || "📰") + "</span></div>";
}

function openStory(it, t, n) {
  openStoryPage(it, { num: t.num, season: seasonById(t.season).name, played: n.played, total: n.total });
}

/* one story on its own page. meta: {num, season, played, total, shared} —
   shared means it came from a push (a frozen copy), so no "send" button */
function openStoryPage(it, meta) {
  const had = !!document.getElementById("matchPage");
  const old = document.getElementById("matchPage");
  if (old) old.remove();
  const pg = el("div", "mpage npage");
  pg.id = "matchPage";
  const top = el("div", "mp-top");
  top.innerHTML = '<span></span><div class="mp-title"><div>חדשות</div><div class="mut">' +
    (meta.num != null ? "טורניר " + meta.num + " · " : "") + esc(meta.season || "") + "</div></div>";
  const back = el("button", "mp-back", "←");
  back.setAttribute("aria-label", "חזרה");
  back.onclick = () => closeMatch(false);
  top.appendChild(back);
  pg.appendChild(top);
  pg.appendChild(el("div", "", newsArt(it, true)));
  const body = el("article", "nstory");
  body.innerHTML = '<div class="nmeta"><span class="ntag">' + esc(it.tag) + "</span>" +
    (meta.played != null ? " · " + meta.played + " מתוך " + meta.total + " משחקים" : "") +
    (meta.shared ? ' · <span class="mut">כפי שנשלח בפוש</span>' : "") + "</div>" +
    '<h1 class="nhead">' + it.head + "</h1>" + '<div class="sbody">' + it.body + "</div>";
  if (it.plain) {
    const b = el("button", "btn ghost sm", "העתק לקבוצה");
    b.onclick = () => copyText(it.plain, b);
    body.appendChild(b);
  }
  if (!meta.shared && adminKey() && window.APP_PUSH) body.appendChild(storyPushBox(it, meta));
  pg.appendChild(body);
  document.body.appendChild(pg);
  document.body.style.overflow = "hidden";
  if (!had) { history.pushState({ match: 1 }, ""); matchOpen = true; }
}

/* ---- the admin sends a card as a push: the headline is the push, the card
   (frozen as it is now) is what a tap opens */
function storyPushBox(it, meta) {
  const box = el("div", "spush");
  box.appendChild(el("div", "lbl", "אדמין · שליחה כפוש"));
  const out = el("div", "mut");
  const row = el("div", "chips");
  const title = stripTags(it.head).slice(0, 80);
  const text = snippet(it.body).slice(0, 140);
  const send = async (onlyMe, btn) => {
    const token = window.APP_PUSH.token();
    if (onlyMe && !token) { flash("הפעל קודם התראות בטלפון הזה", true); return; }
    if (!onlyMe) {
      const ok = await askConfirm({ title: "לשלוח את הכתבה לכולם?", body: title, ok: "שלח לכולם", cancel: "ביטול" });
      if (!ok) return;
    }
    btn.disabled = true; out.textContent = "שולח…";
    try {
      const r = await window.APP_PUSH.admin({ key: adminKey(), title, body: text, token: onlyMe ? token : undefined,
        story: { tag: it.tag, head: it.head, body: it.body, plain: it.plain || "", icon: it.icon || "", who: it.who || [],
                 num: meta.num, season: meta.season, played: meta.played, total: meta.total } });
      out.textContent = "נשלח ל־" + r.sent + " מתוך " + r.phones + " טלפונים" + (r.failed ? " · " + r.failed + " נכשלו" : "") + ".";
    } catch (e) { out.textContent = pushErr(e); }
    btn.disabled = false;
  };
  const all = el("button", "btn sm", "📣 שלח כפוש לכולם");
  all.onclick = () => send(false, all);
  const me = el("button", "btn ghost sm", "בדיקה — רק אליי");
  me.onclick = () => send(true, me);
  row.append(all, me);
  box.append(el("div", "spush-prev", "<b>" + esc(title) + "</b><span>" + esc(text) + "</span>"), row, out);
  return box;
}

/* ---- a tap on such a push: open the frozen card, over the news screen */
async function openSharedStory(id) {
  try {
    const db = Store.db || (window.APP_DB && await window.APP_DB.open());
    if (!db) return;
    const s = await db.doc("stories/" + id).get();
    if (!s.exists) { flash("הכתבה לא נמצאה", true); return; }
    const d = s.data();
    go("news");
    openStoryPage({ tag: d.tag, head: d.head, body: d.body, plain: d.plain, icon: d.icon, who: d.who || [] },
      { num: d.num, season: d.season, played: d.played, total: d.total, shared: true });
  } catch (e) { flash("לא הצלחתי לפתוח את הכתבה", true); }
}
function storyFromHash() {
  const m = /[#&]story=([\w-]+)/.exec(location.hash || "");
  if (!m) return null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return m[1];
}
addEventListener("hashchange", () => { const id = storyFromHash(); if (id) openSharedStory(id); });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && typeof e.data.story === "string") openSharedStory(e.data.story);
  });
}

function viewNews(root) {
  root.innerHTML = "";
  const open = TSS.filter(t => !t.done).slice(-1)[0];
  const t = open || TSS.filter(t2 => t2.done).slice(-1)[0];
  if (!t || !MODEL || !MODEL.matches) { root.appendChild(emptySeason()); return; }

  const n = newsItems(t);
  const feed = el("div", "nfeed");
  const bar = el("div", "nbar");
  bar.innerHTML = '<div><b>טורניר ' + t.num + "</b> · " + esc(seasonById(t.season).name) +
    '<div class="mut">' + n.played + " מתוך " + n.total + " משחקים · לפי 4,000 סימולציות</div></div>";
  const all = el("button", "btn ghost sm", "העתק הכל");
  bar.appendChild(all);
  feed.appendChild(bar);

  n.items.forEach((it, k) => {
    const card = el("button", "ncard" + (k === 0 ? " lead" : ""));
    card.type = "button";
    card.innerHTML = newsArt(it, k === 0) +
      '<div class="ntext"><div class="nmeta"><span class="ntag">' + esc(it.tag) + "</span></div>" +
      '<div class="nhead">' + it.head + "</div>" +
      '<div class="nsnip">' + esc(snippet(it.body)) + "</div></div>";
    card.onclick = () => openStory(it, t, n);
    feed.appendChild(card);
  });
  root.appendChild(feed);

  const full = "📰 חדר חדשות · טורניר " + t.num + " · " + seasonById(t.season).name + "\n\n" +
    n.items.map(i => i.plain).filter(Boolean).join("\n\n");
  all.onclick = () => copyText(full, all);
  publishBulletin(t, n);

  /* The peak-moment and decisive-match stories need simulations that take
     seconds on a phone. Work them out in the background, a step at a time,
     and redraw only if the reader is still on this screen, looking at the
     same tournament in the same state. The redraw finds them cached. */
  const needTl = n.played >= 3 && !timelineCached(t);
  const needGv = n.played < n.total && !gravityCached(t);
  if (needTl || needGv) {
    const sig = scoreSig(t);
    Promise.all([needTl ? timelineAsync(t) : null, needGv ? gravityAsync(t) : null]).then(() => {
      const cur = TSS.filter(x => !x.done).slice(-1)[0] || TSS.filter(x => x.done).slice(-1)[0];
      if (!root.hidden && root.isConnected && cur && cur.i === t.i && scoreSig(cur) === sig) viewNews(root);
    }).catch(() => {});
  }
}

/* ==========================================================================
   Chrome + router
   ========================================================================== */
function emptySeason() {
  const n = el("div", "notice warn");
  /* The stats count finished tournaments only. A season whose first one is
     still being played has started — saying otherwise reads like a wrong page. */
  const open = SCOPE === "all" ? null : TS.filter(t => t.season === SCOPE && !t.done).slice(-1)[0];
  if (open) {
    n.innerHTML = "<b>" + esc(seasonById(SCOPE).name) + " · טורניר " + open.num + " בעיצומו</b> " +
      "הנתונים כאן נספרים מטורנירים שהסתיימו, ולכן יופיעו כשטורניר " + open.num + " יסתיים. " +
      "עד אז — התוצאות והטבלה בחדר הבקרה, והעונה הקודמת בבורר שלמעלה.";
  } else {
    n.innerHTML = "<b>" + esc(SCOPE === "all" ? "אין נתונים" : seasonById(SCOPE).name + " טרם התחילה") +
      "</b> פתח טורניר ראשון בחדר הבקרה, או עבור לעונה אחרת בבורר שלמעלה.";
  }
  return n;
}

/* Opening the app lands on what is happening now: the season of the running
   tournament, else the newest season. A season picked by hand holds for the
   rest of the visit (sessionStorage), not forever — a remembered 2026 would
   hide the live tournament once 2027 starts. */
function launchScope() {
  const open = Object.values(LIVE).filter(t => !t.done).sort((a, b) => b.i - a.i)[0];
  return open ? open.season : latestSeason();
}
const pickedScope = () => {
  try { const v = sessionStorage.getItem("fifa-scope"); return v == null ? null : (v === "all" ? "all" : Number(v)); }
  catch (e) { return null; }
};

function setScope(v) {
  SCOPE = v;
  try { sessionStorage.setItem("fifa-scope", String(v)); } catch (e) {}
  curT = null;
  rebuild(); refreshChrome();
  const cur = VIEWS.find(x => !document.getElementById("v-" + x[0]).hidden);
  if (cur) cur[2](document.getElementById("v-" + cur[0]));
}

function refreshChrome() {
  /* the badge and the line under the name count the tournaments of the chosen
     season, the running one included (1 once the first is opened, 0 if it is
     deleted). Counting finished ones only showed 0 for a season under way. */
  const done = TSS.filter(t => t.done);
  const nT = TSS.length;
  const glyph = document.querySelector(".mark .glyph");
  glyph.textContent = nT;
  glyph.title = nT + " טורנירים" + (SCOPE === "all" ? "" : " בעונה");
  document.getElementById("railSub").textContent =
    (SCOPE === "all" ? "כל העונות" : seasonById(SCOPE).name) + " · " +
    (nT === 1 ? "טורניר אחד" : nT ? nf(nT) + " טורנירים" : "אין טורנירים");

  const sp = document.getElementById("seasonPick");
  sp.innerHTML = "";
  sp.appendChild(el("span", "lbl", "עונה"));
  const sel = el("select");
  sel.id = "season-scope";
  SEASONS.slice().sort((a, b) => a.id - b.id).forEach(sn => {
    const o = el("option", null, esc(sn.name));
    o.value = String(sn.id);
    if (SCOPE === sn.id) o.selected = true;
    sel.appendChild(o);
  });
  if (SEASONS.length > 1) {
    const o = el("option", null, "כל העונות");
    o.value = "all";
    if (SCOPE === "all") o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => setScope(sel.value === "all" ? "all" : Number(sel.value));
  sp.appendChild(sel);

  /* the latest champions now open the summary tab (reignCard) */
  const open = Object.values(LIVE).filter(t => !t.done && (SCOPE === "all" || t.season === SCOPE)).length;
  const nav = document.getElementById("nav-results");
  if (nav) {
    const old = nav.querySelector(".badge");
    if (old) old.remove();
    if (open) nav.querySelector(".ico").insertAdjacentHTML("beforeend", '<span class="badge">' + open + "</span>");
  }
  document.getElementById("foot").innerHTML =
    "כל המספרים מחושבים מחדש מתוך " + nf(totMatches) + " תוצאות המשחקים הגולמיות של " +
    (SCOPE === "all" ? "כל העונות" : esc(seasonById(SCOPE).name)) + ". " +
    (Store.mode === "cloud" ? "טורנירים חדשים נשמרים באחסון המשותף של הדף." : "טורנירים חדשים נשמרים בדפדפן הזה בלבד.");
}

const VIEWS = [
  ["live", "חדר הבקרה", viewLive],
  ["news", "חדר חדשות", viewNews],
  ["overview", "סיכום", viewOverview],
  ["players", "שחקנים", viewPlayers],
  ["tournaments", "טורנירים", viewTournaments],
  ["pairs", "צמדים", viewPairs],
  ["teams", "קבוצות", viewTeams],
  ["records", "שיאים", viewRecords]
];
/* ==========================================================================
   Navigation: four sections at the bottom, each with its own tabs at the top
   --------------------------------------------------------------------------
   The views above are unchanged; this only decides which one is on screen.
   A key is a view id ("tournaments") or, for the control room, "live:<pane>".
   Old calls such as go("players") keep working.
   ========================================================================== */
const ICON = {
  results: '<span class="ico-score">3:2</span>',
  news: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M7 8.5h6v4H7zM15.5 8.5H17M15.5 11.5H17M7 15.5h10"/></svg>',
  players: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.2c1.3-2.2 3.2-3.2 5.5-3.2s4.2 1 5.5 3.2"/></svg>',
  stats: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5V11M10 19.5V5M15 19.5v-6M20 19.5V8M3.5 19.5h17"/></svg>'
};
const SECTIONS = [
  { id: "results", label: "תוצאות", tabs: [["live:games", "משחקים"], ["live:table", "טבלה"], ["live:pred", "ניחושים"], ["live:final", "גמר"], ["live:manage", "ניהול"]] },
  { id: "news", label: "חדשות", tabs: [["news", "חדשות"]] },
  { id: "players", label: "שחקנים", tabs: [["players", "שחקנים"]] },
  { id: "stats", label: "סטטיסטיקות", tabs: [["overview", "סיכום"], ["tournaments", "טורנירים"], ["pairs", "צמדים"], ["teams", "קבוצות"], ["records", "שיאים"]] }
];
const SECTION_LAST = {};

const tabsHost = document.getElementById("tabs");
SECTIONS.forEach(sec => {
  const b = el("button", "navbtn", '<span class="ico">' + ICON[sec.id] + '</span><span class="nl">' + sec.label + "</span>");
  b.setAttribute("role", "tab"); b.id = "nav-" + sec.id;
  b.onclick = () => go(SECTION_LAST[sec.id] || sec.tabs[0][0]);
  tabsHost.appendChild(b);
});

function go(key) {
  key = String(key || "live:games");
  const parts = key.split(":"), view = parts[0];
  if (view === "live") { if (parts[1]) LIVE_PANE = parts[1]; key = "live:" + LIVE_PANE; }
  const sec = SECTIONS.find(x => x.tabs.some(t => t[0] === key)) || SECTIONS[0];
  SECTION_LAST[sec.id] = key;

  SECTIONS.forEach(x => {
    const b = document.getElementById("nav-" + x.id);
    if (b) b.setAttribute("aria-selected", String(x === sec));
  });
  const st = document.getElementById("subtabs");
  st.innerHTML = "";
  st.closest(".subtabs").hidden = sec.tabs.length < 2;       // one screen: no tab row
  sec.tabs.forEach(([k, label]) => {
    const b = el("button", "stab", label);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(k === key));
    b.onclick = () => go(k);
    st.appendChild(b);
    if (k === key) setTimeout(() => b.scrollIntoView({ block: "nearest", inline: "center" }), 0);
  });

  VIEWS.forEach(([vid, , fn]) => {
    const host = document.getElementById("v-" + vid);
    const on = vid === view;
    host.hidden = !on;
    if (on) fn(host);
  });
  hideTip();
  try { localStorage.setItem("fifa-tab", key); } catch (e) {}
  window.scrollTo(0, 0);                                      // every screen starts at its top
}

/* boot: render from history at once, then fold in anything the store holds */
try { localStorage.removeItem("fifa-scope"); } catch (e) {}   // the old, permanent choice
Store.initLocal();          // whatever this browser already holds, immediately
SCOPE = pickedScope() != null ? pickedScope() : launchScope();
installFaceStyles();
rebuild(); refreshChrome();
let start = "live:games";
try {
  const v = localStorage.getItem("fifa-tab");
  if (v && SECTIONS.some(x => x.tabs.some(t => t[0] === v || t[0].split(":")[0] === v))) start = v;
} catch (e) {}
go(start);

(async () => {
  const sharedStory = storyFromHash();   // read before anything rewrites the address
  await Store.initCloud();
  if (sharedStory) setTimeout(() => openSharedStory(sharedStory), 0);
  /* whose phone is this — asked once, after the intro — then log the visit */
  if (meWho() === undefined) setTimeout(() => askWho().then(() => logVisit(true)), document.getElementById("intro") ? 4300 : 300);
  else logVisit();
  /* the store may know a newer season or a running tournament this phone
     had not seen yet — land there unless the reader already picked one */
  /* before the cloud answered, a season this phone had not stored yet was
     swapped for one it had — put the reader's pick back now that it exists */
  const pick = pickedScope();
  if (pick == null) SCOPE = launchScope();
  else if (pick === "all" || SEASONS.some(x => x.id === pick)) SCOPE = pick;
  else SCOPE = launchScope();
  rebuild(); refreshChrome();
  /* never redraw over a field the user is in the middle of filling */
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA");
  if (!typing) {
    const cur = VIEWS.find(v => !document.getElementById("v-" + v[0]).hidden);
    if (cur) cur[2](document.getElementById("v-" + cur[0]));
  }
  Store.paint();
})();
</script>

<script>
/* Register the worker, and offer the new version rather than swapping the
   page out from under someone in the middle of typing a score. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) {
            const bar = document.createElement("div");
            bar.className = "updatebar";
            bar.innerHTML = "<span>יש גרסה חדשה של האפליקציה.</span>";
            const go = document.createElement("button");
            go.className = "btn sm";
            go.textContent = "רענן";
            go.onclick = () => { try { sessionStorage.setItem("fifa-nointro", "1"); } catch (e) {} w.postMessage("skipWaiting"); location.reload(); };
            const no = document.createElement("button");
            no.className = "btn ghost sm";
            no.textContent = "אחר כך";
            no.onclick = () => bar.remove();
            bar.append(go, no);
            document.body.appendChild(bar);
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
